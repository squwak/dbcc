<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doll Ball Collector Cards</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            margin: 6px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #loginScreen {
            padding-top: 80px;
        }

        #gameScreen {
            display: none;
        }

        #topBar {
            background: white;
            padding: 15px;
            box-shadow: 0 2px 5px #aaa;
        }

        #coins {
            font-size: 22px;
            font-weight: bold;
        }

        .cardGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 2px 7px #aaa;
            position: relative;
            box-sizing: border-box;
        }

        .card img {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 10px;
        }

        .cardName {
            font-weight: bold;
            font-size: 18px;
            margin-top: 8px;
        }

        .sellButton {
            background: #b3261e;
            width: 100%;
            margin-top: 8px;
        }

        .sellPrice {
            font-size: 14px;
            margin-top: 5px;
        }

        #search {
            width: 80%;
            max-width: 500px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #aaa;
            font-size: 16px;
            margin: 15px;
        }

        .page {
            display: none;
        }

        #homePage {
            display: block;
        }

        .dexButtons {
            margin-top: 15px;
        }

        .dexCard {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 2px 7px #aaa;
            position: relative;
        }

        .comingSoon {
            color: #888;
            font-weight: bold;
            padding: 30px 5px;
        }

        #message {
            min-height: 25px;
            font-weight: bold;
            padding: 10px;
        }

        #userInfo {
            margin: 10px;
            font-size: 14px;
        }

        /* CARD COUNT */

        .countBadge {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 100;

            background: black;
            color: white;

            width: 30px;
            height: 30px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
            font-size: 16px;
        }

        /* FAVORITE STAR */

        .favoriteButton {
            position: absolute;

            top: 8px;
            left: 8px;

            z-index: 101;

            width: 36px;
            height: 36px;

            padding: 0;
            margin: 0;

            border-radius: 50%;

            background: white;
            color: #999;

            border: 2px solid #ccc;

            font-size: 21px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .favoriteButton.isFavorite {
            color: #ffd21f;
            border-color: #ffd21f;
        }

        /* NORMAL FAVORITE */

        .favoriteCard {
            border: 4px solid #36b9ff;

            box-shadow:
                0 0 0 2px #8ee0ff,
                0 0 12px #36b9ff;
        }

        /* RARE FAVORITE */

        .rareFavoriteCard {
            border: 4px solid gold;

            box-shadow:
                0 0 0 2px #fff0a3,
                0 0 10px gold,
                0 0 22px #ffd700;
        }

        .rareFavoriteCard::before {
            content: "✦ ✧ ✦";
            position: absolute;

            top: -13px;
            left: 50%;

            transform: translateX(-50%);

            color: gold;

            font-size: 15px;

            white-space: nowrap;

            z-index: 102;
        }

        /* SETTINGS */

        #settingsMenu {
            display: none;

            position: fixed;

            top: 70px;
            right: 15px;

            background: white;

            width: 260px;

            padding: 20px;

            border-radius: 15px;

            box-shadow: 0 4px 20px #888;

            z-index: 1000;
        }

        #settingsMenu h2 {
            margin-top: 0;
        }

        .resetButton {
            background: #b3261e;
            width: 90%;
        }

        .closeSettings {
            background: #555;
            width: 90%;
        }

    </style>
</head>

<body>


    <!-- LOGIN -->

    <div id="loginScreen">

        <h1>Doll Ball Collector Cards</h1>

        <p>
            Sign in to save your collection and coins.
        </p>

        <button onclick="login()">
            Sign in with Google
        </button>

        <p id="loginMessage"></p>

    </div>


    <!-- GAME -->

    <div id="gameScreen">


        <!-- TOP BAR -->

        <div id="topBar">

            <h1>Doll Ball Collector Cards</h1>

            <div id="coins">
                Coins: 50
            </div>

            <div id="userInfo"></div>


            <button onclick="showHome()">
                Home
            </button>

            <button onclick="showCollection()">
                Collection
            </button>

            <button onclick="showDex()">
                DEX
            </button>

            <button onclick="toggleSettings()">
                Settings
            </button>

            <button onclick="logout()">
                Log Out
            </button>

        </div>


        <!-- SETTINGS MENU -->

        <div id="settingsMenu">

            <h2>Settings</h2>

            <p>
                Account Settings
            </p>

            <button
                class="resetButton"
                onclick="resetAccount()"

                Reset Account
            </button>

            <button

        <div id="message"></div>


        <!-- HOME -->

        <div id="homePage" class="page">

            <h2>Open Pack</h2>

            <p>
                3 cards per pack
            </p>

            <p>
                Cost: 10 coins
            </p>

            <button onclick="openPack()">

            </button>

            <div
                id="packResults"

            ></div>

        </div>


        <!-- COLLECTION -->

        <div id="collectionPage" class="page">

            ></div>

        <!-- DEX -->

        <div id="dexPage" class="page">

            <h2>DEX</h2>

            <div class="dexButtons">

                <button onclick="showDexDolls()">
                    DOLLS
                </button>

                <button onclick="showDexRares()">
                    RARES
                </button>

                <button onclick="showDexFavorites()">
                    FAVORITES
                </button>

            </div>

            <div
                id="dexGrid"
                class="cardGrid"
            ></div>

        </div>


    </div>

        /*
        ============================
        LOGIN
        ============================
        */


        async function login() {

            try {

                await signInWithPopup(
                    auth,
                    provider
                );

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "loginMessage"
                ).textContent =
                    "Login error: " +
                    error.message;

            }

        }


        /*
        ============================
        LOGOUT
        ============================
        */


        async function logout() {

            try {

                await signOut(auth);

            } catch (error) {

                console.error(error);

            }

        }


        /*
        ============================
        LOAD PLAYER
        ============================
        */


        async function loadPlayerData(user) {

            const playerRef =
                doc(
                    db,
                    "players",
                    user.uid
                );


            const playerSnap =
                await getDoc(playerRef);


            if (playerSnap.exists()) {

                const data =
                    playerSnap.data();


                if (
                    typeof data.money ===
                    "number"
                ) {

                    money =
                        data.money;

                } else {

                    money = 50;

                }


                collection = [];


                if (
                    Array.isArray(
                        data.collection
                    )
                ) {

                    for (
                        const cardName
                        of data.collection
                    ) {

                        const card =
                            cards.find(
                                c =>
                                c.name ===
                                cardName
                            );


                        if (card) {

                            collection.push(
                                card
                            );

                        }

                    }

                }


                favorites = [];


                if (
                    Array.isArray(
                        data.favorites
                    )
                ) {

                    favorites =
                        data.favorites.filter(
                            name =>
                            cards.some(
                                c =>
                                c.name ===
                                name
                            )
                        );

                }

            } else {

                money = 50;

                collection = [];

                favorites = [];


                await savePlayerData(user);

            }


            updateCoins();

        }


        /*
        ============================
        SAVE PLAYER
        ============================
        */


        async function savePlayerData(user) {

            if (!user) return;


            const playerRef =
                doc(
                    db,
                    "players",
                    user.uid
                );


            await setDoc(

                playerRef,

                {

                    money: money,

                    collection:
                        collection.map(
                            card =>
                            card.name
                        ),

                    favorites:
                        favorites

                },

                {
                    merge: true
                }

            );

        }


        /*
        ============================
        COINS
        ============================
        */


        function updateCoins() {

            document.getElementById(
                "coins"
            ).textContent =
                "Coins: " + money;

        }


        /*
        ============================
        RANDOM CARD
        ============================
        */


        function getRandomCard() {

            let totalWeight = 0;


            for (
                const card of cards
            ) {

                totalWeight +=
                    card.weight;

            }


            let random =
                Math.random() *
                totalWeight;


            for (
                const card of cards
            ) {

                random -=
                    card.weight;


                if (
                    random <= 0
                ) {

                    return card;

                }

            }


            return cards[
                cards.length - 1
            ];

        }


        /*
        ============================
        FAVORITE CHECK
        ============================
        */


        function isFavorite(card) {

            return favorites.includes(
                card.name
            );

        }


        /*
        ============================
        TOGGLE FAVORITE
        ============================
        */


        async function toggleFavorite(card) {

            if (!currentUser) return;


            const index =
                favorites.indexOf(
                    card.name
                );


            if (index === -1) {

                favorites.push(
                    card.name
                );

                document.getElementById(
                    "message"
                ).textContent =
                    card.name +
                    " added to favorites!";

            } else {

                favorites.splice(
                    index,
                    1
                );

                document.getElementById(
                    "message"
                ).textContent =
                    card.name +
                    " removed from favorites.";

            }


            try {

                await savePlayerData(
                    currentUser
                );

            } catch (error) {

                console.error(
                    "FAVORITE SAVE ERROR:",
                    error
                );

            }


            const search =
                document.getElementById(
                    "search"
                ).value;


            renderCollection(
                search
            );

        }


        /*
        ============================
        DISPLAY NORMAL CARD
        ============================
        */


        function displayCard(
            card,
            container
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "card";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                card.image;


            img.alt =
                card.name;


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "cardName";


            name.textContent =
                card.name;


            div.appendChild(
                img
            );


            div.appendChild(
                name
            );


            container.appendChild(
                div
            );

        }


        /*
        ============================
        DISPLAY SELLABLE CARD
        ============================
        */


        function displaySellableCard(
            card,
            container
        ) {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "card";


            div.style.position =
                "relative";


            /*
            FAVORITE BORDER
            */


            if (
                isFavorite(card)
            ) {

                if (
                    card.rarity ===
                    "rare"
                ) {

                    div.classList.add(
                        "rareFavoriteCard"
                    );

                } else {

                    div.classList.add(
                        "favoriteCard"
                    );

                }

            }


            /*
            COUNT
            */


            const count =
                collection.filter(
                    c =>
                    c.name ===
                    card.name
                ).length;


            const countBadge =
                document.createElement(
                    "div"
                );


            countBadge.className =
                "countBadge";


            countBadge.textContent =
                count;


            /*
            STAR
            */


            const favoriteButton =
                document.createElement(
                    "button"
                );


            favoriteButton.className =
                "favoriteButton";


            if (
                isFavorite(card)
            ) {

                favoriteButton.classList.add(
                    "isFavorite"
                );

                favoriteButton.textContent =
                    "★";

            } else {

                favoriteButton.textContent =
                    "☆";

            }


            favoriteButton.onclick =
                function(event) {

                    event.stopPropagation();

                    toggleFavorite(
                        card
                    );

                };


            /*
            IMAGE
            */


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                card.image;


            img.alt =
                card.name;


            /*
            NAME
            */


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "cardName";


            name.textContent =
                card.name;


            /*
            PRICE
            */


            const price =
                document.createElement(
                    "div"
                );


            price.className =
                "sellPrice";


            price.textContent =
                "Sell for " +
                card.sellPrice +
                " coins";


            /*
            SELL BUTTON
            */


            const sellButton =
                document.createElement(
                    "button"
                );


            sellButton.className =
                "sellButton";


            sellButton.textContent =
                "SELL";


            /*
            FAVORITES CANNOT BE SOLD
            */


            if (
                isFavorite(card)
            ) {

                sellButton.disabled =
                    true;


                sellButton.textContent =
                    "FAVORITED";


                sellButton.style.background =
                    "#777";

                sellButton.style.cursor =
                    "not-allowed";

            } else {

                sellButton.onclick =
                    function() {

                        sellCard(card);

                    };

            }


            div.appendChild(
                countBadge
            );


            div.appendChild(
                favoriteButton
            );


            div.appendChild(
                img
            );


            div.appendChild(
                name
            );


            div.appendChild(
                price
            );


            div.appendChild(
                sellButton
            );


            container.appendChild(
                div
            );

        }


        /*
        ============================
        OPEN PACK
        ============================
        */


        async function openPack() {

            if (!currentUser) return;


            const packCost =
                10;


            if (
                money < packCost
            ) {

                document.getElementById(
                    "message"
                ).textContent =
                    "Not enough coins.";

                return;

            }


            money -=
                packCost;


            const results =
                document.getElementById(
                    "packResults"
                );


            results.innerHTML =
                "";


            for (
                let i = 0;
                i < 3;
                i++
            ) {

                const card =
                    getRandomCard();


                collection.push(
                    card
                );


                displayCard(
                    card,
                    results
                );

            }


            updateCoins();


            document.getElementById(
                "message"
            ).textContent =
                "You opened a pack!";


            try {

                await savePlayerData(
                    currentUser
                );

            } catch (error) {

                console.error(
                    "PACK SAVE ERROR:",
                    error
                );


                document.getElementById(
                    "message"
                ).textContent =
                    "Pack opened, but saving failed.";

            }

        }


        /*
        ============================
        SELL CARD
        ============================
        */


        async function sellCard(card) {

            if (!currentUser)
                return;


            /*
            Favorite cards cannot be sold.
            */


            if (
                isFavorite(card)
            ) {

                document.getElementById(
                    "message"
                ).textContent =
                    "Favorite cards cannot be sold.";

                return;

            }


            const cardIndex =
                collection.indexOf(
                    card
                );


            if (
                cardIndex === -1
            )
                return;


            collection.splice(
                cardIndex,
                1
            );


            money +=
                card.sellPrice;


            updateCoins();


            document.getElementById(
                "message"
            ).textContent =
                "Sold " +
                card.name +
                " for " +
                card.sellPrice +
                " coins!";


            try {

                await savePlayerData(
                    currentUser
                );

            } catch (error) {

                console.error(
                    "SELL SAVE ERROR:",
                    error
                );

            }


            const search =
                document.getElementById(
                    "search"
                ).value;


            renderCollection(
                search
            );

        }


        /*
        ============================
        COLLECTION
        ============================
        */


        function renderCollection(
            searchText = ""
        ) {

            const grid =
                document.getElementById(
                    "collectionGrid"
                );


            grid.innerHTML =
                "";


            const search =
                searchText.toLowerCase();


            /*
            Official card order
            */


            for (
                const card of cards
            ) {


                if (
                    !collection.includes(
                        card
                    )
                ) {

                    continue;

                }


                if (
                    search &&
                    !card.name
                        .toLowerCase()
                        .includes(search)
                ) {

                    continue;

                }


                displaySellableCard(
                    card,
                    grid
                );

            }

        }


        function showCollection() {

            hideAllPages();


            document.getElementById(
                "collectionPage"
            ).style.display =
                "block";


            document.getElementById(
                "search"
            ).value =
                "";


            renderCollection();

        }


        function searchCollection() {

            const search =
                document.getElementById(
                    "search"
                ).value;


            renderCollection(
                search
            );

        }


        /*
        ============================
        DEX
        ============================
        */


        function renderDex(
            list
        ) {

            const grid =
                document.getElementById(
                    "dexGrid"
                );


            grid.innerHTML =
                "";


            for (
                const card of list
            ) {


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "dexCard";


                if (
                    card.comingSoon
                ) {


                    const text =
                        document.createElement(
                            "div"
                        );


                    text.className =
                        "comingSoon";


                    text.textContent =
                        "Coming Soon";


                    div.appendChild(
                        text
                    );


                } else {


                    /*
                    Favorite border in DEX
                    */


                    if (
                        isFavorite(card)
                    ) {

                        if (
                            card.rarity ===
                            "rare"
                        ) {

                            div.classList.add(
                                "rareFavoriteCard"
                            );

                        } else {

                            div.classList.add(
                                "favoriteCard"
                            );

                        }

                    }


                    const img =
                        document.createElement(
                            "img"
                        );


                    img.src =
                        card.image;


                    img.alt =
                        card.name;


                    img.style.width =
                        "100%";


                    img.style.maxHeight =
                        "180px";


                    img.style.objectFit =
                        "contain";


                    const name =
                        document.createElement(
                            "div"
                        );


                    name.className =
                        "cardName";


                    name.textContent =
                        card.name;


                    div.appendChild(
                        img
                    );


                    div.appendChild(
                        name
                    );

                }


                grid.appendChild(
                    div
                );

            }

        }


        function showDex() {

            hideAllPages();


            document.getElementById(
                "dexPage"
            ).style.display =
                "block";


            showDexDolls();

        }


        function showDexDolls() {

            renderDex(
                dexDolls
            );

        }


        function showDexRares() {

            renderDex(
                dexRares
            );

        }


        /*
        FAVORITES DEX TAB
        */


        function showDexFavorites() {

            const favoriteCards =
                cards.filter(
                    card =>
                    favorites.includes(
                        card.name
                    )
                    &&
                    collection.includes(
                        card
                    )
                );


            renderDex(
                favoriteCards
            );

        }


        /*
        ============================
        HOME
        ============================
        */


        function showHome() {

            hideAllPages();


            document.getElementById(
                "homePage"
            ).style.display =
                "block";

        }


        function hideAllPages() {

            document
                .querySelectorAll(
                    ".page"
                )
                .forEach(
                    page => {

                        page.style.display =
                            "none";

                    }
                );

        }


        /*
        ============================
        SETTINGS
        ============================
        */


        function toggleSettings() {

            const menu =
                document.getElementById(
                    "settingsMenu"
                );


            if (
                menu.style.display ===
                "block"
            ) {

                menu.style.display =
                    "none";

            } else {

                menu.style.display =
                    "block";

            }

        }


        /*
        ============================
        RESET ACCOUNT
        ============================
        */


        async function resetAccount() {

            if (!currentUser)
                return;


            const confirmed =
                confirm(
                    "Are you sure you want to reset your account?\n\nThis will permanently delete your coins, collection, and favorites."
                );


            if (!confirmed)
                return;


            const doubleConfirmed =
                confirm(
                    "This cannot be undone. Reset your account?"
                );


            if (!doubleConfirmed)
                return;


            try {


                const playerRef =
                    doc(
                        db,
                        "players",
                        currentUser.uid
                    );


                await deleteDoc(
                    playerRef
                );


                money = 50;

                collection = [];

                favorites = [];


                updateCoins();


                document.getElementById(
                    "settingsMenu"
                ).style.display =
                    "none";


                document.getElementById(
                    "message"
                ).textContent =
                    "Account reset successfully.";


                showHome();


                document.getElementById(
                    "packResults"
                ).innerHTML =
                    "";


            } catch (error) {

                console.error(
                    "RESET ERROR:",
                    error
                );


                document.getElementById(
                    "message"
                ).textContent =
                    "Could not reset account.";

            }

        }


        /*
        ============================
        FIREBASE AUTH STATE
        ============================
        */


        onAuthStateChanged(

            auth,

            async (user) => {


                if (user) {


                    currentUser =
                        user;


                    document.getElementById(
                        "loginScreen"
                    ).style.display =
                        "none";


                    document.getElementById(
                        "gameScreen"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "userInfo"
                    ).textContent =
                        "Signed in as " +
                        user.displayName;


                    try {

                        await loadPlayerData(
                            user
                        );

                    } catch (error) {

                        console.error(
                            "LOAD ERROR:",
                            error
                        );


                        document.getElementById(
                            "message"
                        ).textContent =
                            "Could not load your saved data.";

                    }


                    showHome();


                } else {


                    currentUser =
                        null;


                    document.getElementById(
                        "loginScreen"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "gameScreen"
                    ).style.display =
                        "none";

                }

            }

        );


        /*
        ============================
        INLINE FUNCTIONS
        ============================
        */


        window.login =
            login;


        window.logout =
            logout;


        window.openPack =
            openPack;


        window.showHome =
            showHome;


        window.showCollection =
            showCollection;


        window.showDex =
            showDex;


        window.showDexDolls =
            showDexDolls;


        window.showDexRares =
            showDexRares;


        window.showDexFavorites =
            showDexFavorites;


        window.searchCollection =
            searchCollection;


        window.toggleSettings =
            toggleSettings;


        window.resetAccount =
            resetAccount;


        window.toggleFavorite =
            toggleFavorite;


    </script>

</body>
</html>
