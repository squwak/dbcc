<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doll Ball Collector Cards</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-top: 20px;
        }

        button {
            font-size: 20px;
            padding: 15px 25px;
            cursor: pointer;
            margin: 5px;
            border-radius: 10px;
            border: 2px solid #333;
            background: white;
        }

        button:active {
            transform: scale(0.97);
        }

        /* =========================
           SCREENS
        ========================= */

        #loginScreen {
            display: block;
            margin-top: 80px;
        }

        #gameScreen {
            display: none;
        }

        #collectionScreen {
            display: none;
        }

        #dexScreen {
            display: none;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginMessage {
            font-size: 18px;
        }

        /* =========================
           USER
        ========================= */

        #userInfo {
            margin: 15px;
            font-size: 18px;
        }

        #userPhoto {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            vertical-align: middle;
            margin: 10px;
        }

        /* =========================
           MONEY
        ========================= */

        #money {
            font-size: 20px;
            margin: 20px;
        }

        #message {
            font-size: 20px;
            margin: 20px;
        }

        /* =========================
           NORMAL CARDS
        ========================= */

        .card {
            display: inline-block;
            vertical-align: top;

            background: white;

            border: 2px solid #333;
            border-radius: 15px;

            padding: 10px;
            margin: 10px;

            width: 180px;
        }

        .card img {
            width: 160px;
            height: 220px;
            object-fit: contain;
        }

        .card p {
            font-size: 18px;
            font-weight: bold;
        }

        /* =========================
           COLLECTION
        ========================= */

        #collectionCards {
            max-width: 1200px;
            margin: auto;
        }

        #collectionCount {
            font-size: 20px;
            font-weight: bold;
        }

        /* =========================
           DEX
        ========================= */

        #dexProgress {
            font-size: 20px;
            font-weight: bold;
            margin: 15px;
        }

        #dexCards {
            max-width: 1200px;
            margin: auto;
        }

        /*
           EVERY DEX CARD HAS THE SAME
           NORMAL BORDER.
        */

        .dexCard {
            display: inline-block;
            vertical-align: top;

            width: 180px;
            height: 285px;

            background: white;

            border: 2px solid #333;
            border-radius: 15px;

            margin: 8px;
            padding: 10px;

            box-sizing: border-box;
        }

        .dexNumber {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .dexCard img {
            width: 150px;
            height: 205px;
            object-fit: contain;
        }

        .dexName {
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* =========================
           LOCKED DEX CARD
        ========================= */

        .locked {
            background: #ddd;
            border: 2px solid #333;
        }

        .unknown {
            width: 150px;
            height: 205px;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 45px;
            font-weight: bold;

            color: #555;
        }

        /* =========================
           COMING SOON
        ========================= */

        .comingSoon {
            background: #e8e8e8;
            border: 2px solid #999;
        }

        .comingSoonText {
            height: 215px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;

            color: #666;
        }

    </style>

</head>


<body>


<!-- ==================================================
     LOGIN
================================================== -->

<div id="loginScreen">

    <h1>🎴 Doll Ball Collector Cards</h1>

    <h2>Welcome to DBCC!</h2>

    <p>Sign in to save your collection.</p>

    <button id="googleLoginButton">
        🔵 Sign in with Google
    </button>

    <p id="loginMessage"></p>

</div>



<!-- ==================================================
     MAIN GAME
================================================== -->

<div id="gameScreen">

    <h1>Doll Ball Collector Cards</h1>

    <div id="userInfo"></div>

    <div id="money">
        🪙 Coins:
        <span id="coins">50</span>
    </div>


    <button id="openPackButton">
        OPEN PACK - 10 COINS
    </button>


    <button id="collectionButton">
        🃏 COLLECTION
    </button>


    <button id="dexButton">
        📖 DEX
    </button>


    <button id="logoutButton">
        LOG OUT
    </button>


    <p id="message"></p>

    <div id="cards"></div>

</div>



<!-- ==================================================
     COLLECTION SCREEN
================================================== -->

<div id="collectionScreen">

    <h1>🃏 My DBCC Collection</h1>

    <p id="collectionCount">
        Cards collected: 0
    </p>


    <button id="collectionBackButton">
        ← BACK TO PACKS
    </button>


    <div id="collectionCards"></div>

</div>



<!-- ==================================================
     DEX SCREEN
================================================== -->

<div id="dexScreen">

    <h1>📖 Doll Ball Dex</h1>

    <p id="dexProgress">
        Collected: 0 / 12
    </p>


    <button id="dexBackButton">
        ← BACK TO PACKS
    </button>


    <div id="dexCards"></div>

</div>



<!-- ==================================================
     FIREBASE
================================================== -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyC-6paRzUxBv6DhZ5Vx_c8BG8vxcKe9xYw",

    authDomain:
        "dbcc-login.firebaseapp.com",

    projectId:
        "dbcc-login",

    storageBucket:
        "dbcc-login.firebasestorage.app",

    messagingSenderId:
        "878902780767",

    appId:
        "1:878902780767:web:4020d11730e5d9c0ee0cea",

    measurementId:
        "G-PT9S1K4E2K"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const provider =
    new GoogleAuthProvider();



/* ==================================================
   GAME VARIABLES
================================================== */

let money = 50;

let collection = [];



/* ==================================================
   CURRENT 12 DOLLS
================================================== */

const cards = [

    {
        id: 1,
        name: "Baby Pickels",
        image: "baby pikels.png",
        chance: 14
    },

    {
        id: 2,
        name: "Mr Pickels",
        image: "mr. pickels.png",
        chance: 9
    },

    {
        id: 3,
        name: "Wily",
        image: "wily.png",
        chance: 14
    },

    {
        id: 4,
        name: "Will",
        image: "will.png",
        chance: 9
    },

    {
        id: 5,
        name: "Waffle",
        image: "waffle.png",
        chance: 14
    },

    {
        id: 6,
        name: "Cute Cake",
        image: "cute cake.png",
        chance: 9
    },

    {
        id: 7,
        name: "Buttyr",
        image: "buttyr.png",
        chance: 20
    },

    {
        id: 8,
        name: "Blossem",
        image: "blossem.png",
        chance: 20
    },

    {
        id: 9,
        name: "Buzzy",
        image: "buzzy.png",
        chance: 5
    },

    {
        id: 10,
        name: "Nico",
        image: "nico.png",
        chance: 20
    },

    {
        id: 11,
        name: "Choper",
        image: "choper.png",
        chance: 10
    },

    {
        id: 12,
        name: "Bullet",
        image: "bullet.png",
        chance: 10
    }

];



/* ==================================================
   GOOGLE LOGIN
================================================== */

document
    .getElementById("googleLoginButton")
    .addEventListener(
        "click",
        async function () {

            try {

                await signInWithPopup(
                    auth,
                    provider
                );

            }

            catch (error) {

                console.error(error);

                document
                    .getElementById("loginMessage")
                    .textContent =
                    "❌ Login failed: " +
                    error.message;

            }

        }
    );



/* ==================================================
   LOGOUT
================================================== */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async function () {

            await signOut(auth);

        }
    );



/* ==================================================
   LOGIN STATE
================================================== */

onAuthStateChanged(
    auth,
    function (user) {

        if (user) {

            showOnly(
                "gameScreen"
            );


            const userInfo =
                document.getElementById(
                    "userInfo"
                );


            if (user.photoURL) {

                userInfo.innerHTML =

                    `<img
                        id="userPhoto"
                        src="${user.photoURL}"
                        alt="Profile">
                    Welcome, ${user.displayName}!`;

            }

            else {

                userInfo.textContent =
                    "Welcome, " +
                    user.displayName +
                    "!";

            }

        }

        else {

            showOnly(
                "loginScreen"
            );

        }

    }
);



/* ==================================================
   SHOW ONE SCREEN
================================================== */

function showOnly(screenId) {

    document
        .getElementById("loginScreen")
        .style.display = "none";

    document
        .getElementById("gameScreen")
        .style.display = "none";

    document
        .getElementById("collectionScreen")
        .style.display = "none";

    document
        .getElementById("dexScreen")
        .style.display = "none";


    document
        .getElementById(screenId)
        .style.display = "block";


    window.scrollTo(
        0,
        0
    );

}



/* ==================================================
   RANDOM CARD
================================================== */

function getRandomCard() {

    let total = 0;


    for (const card of cards) {

        total += card.chance;

    }


    let random =
        Math.random() * total;


    for (const card of cards) {

        random -= card.chance;


        if (random <= 0) {

            return card;

        }

    }

}



/* ==================================================
   OPEN PACK
================================================== */

document
    .getElementById("openPackButton")
    .addEventListener(
        "click",
        function () {

            if (money < 10) {

                document
                    .getElementById("message")
                    .textContent =
                    "❌ Not enough coins!";

                return;

            }


            money -= 10;


            document
                .getElementById("coins")
                .textContent =
                money;


            document
                .getElementById("cards")
                .innerHTML = "";


            const pack = [];


            for (
                let i = 0;
                i < 3;
                i++
            ) {

                const card =
                    getRandomCard();


                pack.push(card);


                collection.push(card);

            }


            document
                .getElementById("message")
                .textContent =
                "🎉 You got 3 cards!";


            for (const card of pack) {

                displayCard(
                    card,
                    document.getElementById(
                        "cards"
                    )
                );

            }

        }
    );



/* ==================================================
   DISPLAY CARD
================================================== */

function displayCard(
    card,
    container
) {

    const cardDiv =
        document.createElement(
            "div"
        );


    cardDiv.className =
        "card";


    const image =
        document.createElement(
            "img"
        );


    image.src =
        card.image;


    image.alt =
        card.name;


    const name =
        document.createElement(
            "p"
        );


    name.textContent =
        card.name;


    cardDiv.appendChild(
        image
    );


    cardDiv.appendChild(
        name
    );


    container.appendChild(
        cardDiv
    );

}



/* ==================================================
   OPEN COLLECTION
================================================== */

document
    .getElementById("collectionButton")
    .addEventListener(
        "click",
        function () {

            buildCollection();

            showOnly(
                "collectionScreen"
            );

        }
    );



/* ==================================================
   BUILD COLLECTION
================================================== */

function buildCollection() {

    const container =
        document.getElementById(
            "collectionCards"
        );


    container.innerHTML = "";


    document
        .getElementById(
            "collectionCount"
        )
        .textContent =
        "Cards collected: " +
        collection.length;


    if (
        collection.length === 0
    ) {

        container.innerHTML =
            "<h2>Your collection is empty!</h2>" +
            "<p>Open a pack to get your first cards.</p>";

        return;

    }


    /*
       Shows duplicates too.
    */

    for (const card of collection) {

        displayCard(
            card,
            container
        );

    }

}



/* ==================================================
   COLLECTION BACK BUTTON
================================================== */

document
    .getElementById(
        "collectionBackButton"
    )
    .addEventListener(
        "click",
        function () {

            showOnly(
                "gameScreen"
            );

        }
    );



/* ==================================================
   OPEN DEX
================================================== */

document
    .getElementById("dexButton")
    .addEventListener(
        "click",
        function () {

            buildDex();

            showOnly(
                "dexScreen"
            );

        }
    );



/* ==================================================
   BUILD DEX
================================================== */

function buildDex() {

    const container =
        document.getElementById(
            "dexCards"
        );


    container.innerHTML = "";


    let uniqueOwned = 0;



    /* ==============================================
       #001 - #012
       CURRENT 12 DOLLS
    ============================================== */

    for (const card of cards) {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "dexCard";


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "dexNumber";


        number.textContent =
            "#" +
            String(card.id)
                .padStart(3, "0");


        div.appendChild(
            number
        );



        const owned =
            collection.some(
                ownedCard =>
                    ownedCard.id ===
                    card.id
            );



        if (owned) {

            uniqueOwned++;


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                card.image;


            image.alt =
                card.name;


            div.appendChild(
                image
            );


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "dexName";


            name.textContent =
                card.name;


            div.appendChild(
                name
            );

        }

        else {

            div.classList.add(
                "locked"
            );


            const unknown =
                document.createElement(
                    "div"
                );


            unknown.className =
                "unknown";


            unknown.textContent =
                "???";


            div.appendChild(
                unknown
            );


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "dexName";


            name.textContent =
                "???";


            div.appendChild(
                name
            );

        }


        container.appendChild(
            div
        );

    }



    /* ==============================================
       #013 - #123
       111 COMING SOON
    ============================================== */

    for (
        let i = 13;
        i <= 123;
        i++
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "dexCard comingSoon";


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "dexNumber";


        number.textContent =
            "#" +
            String(i)
                .padStart(3, "0");


        div.appendChild(
            number
        );


        const text =
            document.createElement(
                "div"
            );


        text.className =
            "comingSoonText";


        text.textContent =
            "COMING SOON";


        div.appendChild(
            text
        );


        container.appendChild(
            div
        );

    }



    document
        .getElementById(
            "dexProgress"
        )
        .textContent =
        "Collected: " +
        uniqueOwned +
        " / 12";

}



/* ==================================================
   DEX BACK BUTTON
================================================== */

document
    .getElementById(
        "dexBackButton"
    )
    .addEventListener(
        "click",
        function () {

            showOnly(
                "gameScreen"
            );

        }
    );

</script>

</body>

</html>
