<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Battle System</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a2e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .battle-container {
      width: 90%;
      max-width: 800px;
      background-color: #16213e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .arena {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card-slot {
      flex: 1;
      background-color: #0f3460;
      border: 2px solid #e94560;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .card-slot h2 {
      margin-bottom: 10px;
      font-size: 1.4rem;
    }

    .stat-bar {
      background-color: #333;
      border-radius: 10px;
      height: 20px;
      overflow: hidden;
      margin: 10px 0;
    }

    .hp-fill {
      height: 100%;
      background-color: #4caf50;
      width: 100%;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .moves-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    button.move-btn {
      background-color: #e94560;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button.move-btn:hover:not(:disabled) {
      background-color: #ff6b81;
    }

    button:disabled {
      background-color: #555555;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .log-box {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      height: 120px;
      padding: 10px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .control-panel {
      text-align: center;
    }

    .reset-btn {
      background-color: #22c55e;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .reset-btn:hover {
      background-color: #16a34a;
    }
  </style>
</head>
<body>

  <div class="battle-container">
    <div class="arena">
      <!-- Player Card -->
      <div class="card-slot">
        <h2 id="player-name">Player Fighter</h2>
        <div>HP: <span id="player-hp-text">100 / 100</span></div>
        <div class="stat-bar">
          <div id="player-hp-bar" class="hp-fill"></div>
        </div>
      </div>

      <!-- Enemy Card -->
      <div class="card-slot">
        <h2 id="enemy-name">Opponent</h2>
        <div>HP: <span id="enemy-hp-text">100 / 100</span></div>
        <div class="stat-bar">
          <div id="enemy-hp-bar" class="hp-fill"></div>
        </div>
      </div>
    </div>

    <!-- Battle Actions -->
    <div class="moves-grid">
      <button class="move-btn" onclick="executeTurn('Quick Attack')">Quick Attack (10-15 DMG)</button>
      <button class="move-btn" onclick="executeTurn('Heavy Strike')">Heavy Strike (5-25 DMG)</button>
      <button class="move-btn" onclick="executeTurn('Power Blast')">Power Blast (18-22 DMG)</button>
      <button class="move-btn" onclick="executeTurn('Heal Spell')">Heal Spell (+15 HP)</button>
    </div>

    <!-- Battle Activity Log -->
    <div id="battle-log" class="log-box">
      <div>[Battle Ready] Select a move to begin your turn!</div>
    </div>

    <!-- Rematch / Reset -->
    <div class="control-panel">
      <button id="reset-btn" class="reset-btn" onclick="initializeBattle()">Start New Battle</button>
    </div>
  </div>

  <script>
    // Game Configuration & State
    const maxPlayerHp = 100;
    const maxEnemyHp = 100;

    let playerHp = maxPlayerHp;
    let enemyHp = maxEnemyHp;
    let isBattleActive = true;

    // DOM References
    const playerHpText = document.getElementById('player-hp-text');
    const enemyHpText = document.getElementById('enemy-hp-text');
    const playerHpBar = document.getElementById('player-hp-bar');
    const enemyHpBar = document.getElementById('enemy-hp-bar');
    const logBox = document.getElementById('battle-log');
    const resetBtn = document.getElementById('reset-btn');
    const moveButtons = document.querySelectorAll('.move-btn');

    // Initialize Game State
    function initializeBattle() {
      playerHp = maxPlayerHp;
      enemyHp = maxEnemyHp;
      isBattleActive = true;

      logBox.innerHTML = '<div>[Battle Ready] Select a move to begin your turn!</div>';
      resetBtn.style.display = 'none';

      moveButtons.forEach(btn => btn.disabled = false);

      updateDisplay();
    }

    // Update Health Displays & Bars
    function updateDisplay() {
      playerHpText.textContent = `${playerHp} / ${maxPlayerHp}`;
      enemyHpText.textContent = `${enemyHp} / ${maxEnemyHp}`;

      const playerPct = Math.max(0, (playerHp / maxPlayerHp) * 100);
      const enemyPct = Math.max(0, (enemyHp / maxEnemyHp) * 100);

      playerHpBar.style.width = `${playerPct}%`;
      enemyHpBar.style.width = `${enemyPct}%`;

      // Update Bar Colors based on HP
      playerHpBar.style.backgroundColor = playerPct < 30 ? '#ef4444' : '#22c55e';
      enemyHpBar.style.backgroundColor = enemyPct < 30 ? '#ef4444' : '#22c55e';
    }

    // Add entries to log
    function appendLog(message, color = '#ffffff') {
      const entry = document.createElement('div');
      entry.style.color = color;
      entry.textContent = message;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    // Core Turn Logic - ONLY triggered by player input
    function executeTurn(moveName) {
      if (!isBattleActive) return;

      // 1. Player Action
      let playerDamage = 0;
      let playerHeal = 0;

      switch (moveName) {
        case 'Quick Attack':
          playerDamage = Math.floor(Math.random() * 6) + 10; // 10-15
          break;
        case 'Heavy Strike':
          playerDamage = Math.floor(Math.random() * 21) + 5; // 5-25
          break;
        case 'Power Blast':
          playerDamage = Math.floor(Math.random() * 5) + 18; // 18-22
          break;
        case 'Heal Spell':
          playerHeal = 15;
          break;
      }

      if (playerDamage > 0) {
        enemyHp = Math.max(0, enemyHp - playerDamage);
        appendLog(`> You used ${moveName} dealing ${playerDamage} damage!`, '#60a5fa');
      } else if (playerHeal > 0) {
        playerHp = Math.min(maxPlayerHp, playerHp + playerHeal);
        appendLog(`> You used ${moveName} and restored ${playerHeal} HP!`, '#4ade80');
      }

      updateDisplay();

      // 2. Check Player Win Condition
      if (enemyHp <= 0) {
        appendLog(`🏆 VICTORY! Opponent was defeated!`, '#facc15');
        endBattle();
        return;
      }

      // 3. Enemy Action (Counter-attack)
      const enemyDamage = Math.floor(Math.random() * 11) + 8; // 8-18 DMG
      playerHp = Math.max(0, playerHp - enemyDamage);
      appendLog(`> Opponent counters and deals ${enemyDamage} damage to you!`, '#f87171');

      updateDisplay();

      // 4. Check Enemy Win Condition
      if (playerHp <= 0) {
        appendLog(`💀 DEFEAT! You were knocked out!`, '#ef4444');
        endBattle();
        return;
      }
    }

    // Disable buttons and reveal reset button on game end
    function endBattle() {
      isBattleActive = false;
      moveButtons.forEach(btn => btn.disabled = true);
      resetBtn.style.display = 'inline-block';
    }

    // Run setup on load
    window.onload = initializeBattle;
  </script>
</body>
</html>
