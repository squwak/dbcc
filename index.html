<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doll Ball Collector Cards</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            margin: 6px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #loginScreen {
            padding-top: 80px;
        }

        #gameScreen {
            display: none;
        }

        #topBar {
            background: white;
            padding: 15px;
            box-shadow: 0 2px 5px #aaa;
        }

        #coins {
            font-size: 22px;
            font-weight: bold;
        }

        .cardGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 2px 7px #aaa;
        }

        .card img {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 10px;
        }

        .cardName {
            font-weight: bold;
            font-size: 18px;
            margin-top: 8px;
        }

        .sellButton {
            background: #b3261e;
            width: 100%;
            margin-top: 8px;
        }

        .sellPrice {
            font-size: 14px;
            margin-top: 5px;
        }

        #search {
            width: 80%;
            max-width: 500px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #aaa;
            font-size: 16px;
            margin: 15px;
        }

        .page {
            display: none;
        }

        #homePage {
            display: block;
        }

        .dexButtons {
            margin-top: 15px;
        }

        .dexCard {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 2px 7px #aaa;
        }

        .comingSoon {
            color: #888;
            font-weight: bold;
            padding: 30px 5px;
        }

        #message {
            min-height: 25px;
            font-weight: bold;
            padding: 10px;
        }

        #userInfo {
            margin: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div id="loginScreen">
        <h1>Doll Ball Collector Cards</h1>
        <p>Sign in to save your collection and coins.</p>
        <button onclick="login()">Sign in with Google</button>
        <p id="loginMessage"></p>
    </div>


    <div id="gameScreen">

        <div id="topBar">
            <h1>Doll Ball Collector Cards</h1>

            <div id="coins">
                Coins: 50
            </div>

            <div id="userInfo"></div>

            <button onclick="showHome()">Home</button>
            <button onclick="showCollection()">Collection</button>
            <button onclick="showDex()">DEX</button>
            <button onclick="logout()">Log Out</button>
        </div>


        <div id="message"></div>


        <div id="homePage" class="page">

            <h2>Open Pack</h2>

            <p>3 cards per pack</p>
            <p>Cost: 10 coins</p>

            <button onclick="openPack()">Open Pack</button>

            <div id="packResults" class="cardGrid"></div>

        </div>


        <div id="collectionPage" class="page">

            <h2>Collection</h2>

            <input
                id="search"
                type="text"
                placeholder="Search cards..."
                oninput="searchCollection()"
            >

            <div id="collectionGrid" class="cardGrid"></div>

        </div>


        <div id="dexPage" class="page">

            <h2>DEX</h2>

            <div class="dexButtons">
                <button onclick="showDexDolls()">DOLLS</button>
                <button onclick="showDexRares()">RARES</button>
            </div>

            <div id="dexGrid" class="cardGrid"></div>

        </div>

    </div>


    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            signOut,
            onAuthStateChanged
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            setDoc
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


        const firebaseConfig = {
            apiKey: "AIzaSyC-6paRzUxBv6DhZ5Vx_c8BG8vxcKe9xYw",
            authDomain: "dbcc-login.firebaseapp.com",
            databaseURL: "https://dbcc-login-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dbcc-login",
            storageBucket: "dbcc-login.firebasestorage.app",
            messagingSenderId: "878902780767",
            appId: "1:878902780767:web:4020d11730e5d9c0ee0cea",
            measurementId: "G-PT9S1K4E2K"
        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);

        const provider = new GoogleAuthProvider();


        let money = 50;

        let collection = [];

        let currentUser = null;


        /*
        CARD LIST

        The order here is the official collection order.
        Sell prices are exactly the prices provided.
        */

        const cards = [

            {
                name: "Baby Pickels",
                image: "baby pikels.png",
                weight: 14,
                sellPrice: 5
            },

            {
                name: "Mr. Pickels",
                image: "mr. pickels.png",
                weight: 9,
                sellPrice: 7
            },

            {
                name: "Wily",
                image: "wily.png",
                weight: 14,
                sellPrice: 5
            },

            {
                name: "Will",
                image: "will.png",
                weight: 9,
                sellPrice: 7
            },

            {
                name: "Waffle",
                image: "waffle.png",
                weight: 14,
                sellPrice: 5
            },

            {
                name: "Cute Cake",
                image: "cute cake.png",
                weight: 9,
                sellPrice: 7
            },

            {
                name: "Buttyr",
                image: "buttyr.png",
                weight: 20,
                sellPrice: 7
            },

            {
                name: "Blossem",
                image: "blossem.png",
                weight: 20,
                sellPrice: 7
            },

            {
                name: "Buzzy",
                image: "buzzy.png",
                weight: 5,
                sellPrice: 12
            },

            {
                name: "Nico",
                image: "nico.png",
                weight: 20,
                sellPrice: 3
            },

            {
                name: "Choper",
                image: "choper.png",
                weight: 10,
                sellPrice: 5
            },

            {
                name: "Bullet",
                image: "bullet.png",
                weight: 10,
                sellPrice: 5
            }

        ];


        /*
        DEX
        */

        const dexDolls = [...cards];

        for (let i = 13; i <= 123; i++) {

            dexDolls.push({
                name: "Coming Soon",
                image: null,
                comingSoon: true
            });

        }


        const dexRares = [

            {
                name: "Coming Soon",
                image: null,
                comingSoon: true
            },

            {
                name: "Coming Soon",
                image: null,
                comingSoon: true
            },

            {
                name: "Coming Soon",
                image: null,
                comingSoon: true
            },

            {
                name: "Coming Soon",
                image: null,
                comingSoon: true
            },

            {
                name: "Coming Soon",
                image: null,
                comingSoon: true
            },

            {
                name: "Coming Soon",
                image: null,
                comingSoon: true
            }

        ];


        /*
        LOGIN
        */

        async function login() {

            try {

                await signInWithPopup(auth, provider);

            } catch (error) {

                console.error(error);

                document.getElementById("loginMessage").textContent =
                    "Login error: " + error.message;

            }

        }


        /*
        LOGOUT
        */

        async function logout() {

            try {

                await signOut(auth);

            } catch (error) {

                console.error(error);

            }

        }


        /*
        LOAD PLAYER DATA
        */

        async function loadPlayerData(user) {

            const playerRef = doc(db, "players", user.uid);

            const playerSnap = await getDoc(playerRef);


            if (playerSnap.exists()) {

                const data = playerSnap.data();


                if (typeof data.money === "number") {

                    money = data.money;

                } else {

                    money = 50;

                }


                collection = [];


                if (Array.isArray(data.collection)) {

                    for (const cardName of data.collection) {

                        const card = cards.find(
                            c => c.name === cardName
                        );

                        if (card) {

                            collection.push(card);

                        }

                    }

                }

            } else {

                money = 50;

                collection = [];


                await savePlayerData(user);

            }


            updateCoins();

        }


        /*
        SAVE PLAYER DATA
        */

        async function savePlayerData(user) {

            if (!user) return;


            const playerRef = doc(db, "players", user.uid);


            await setDoc(
                playerRef,
                {
                    money: money,

                    collection: collection.map(
                        card => card.name
                    )
                },
                {
                    merge: true
                }
            );

        }


        /*
        COINS
        */

        function updateCoins() {

            document.getElementById("coins").textContent =
                "Coins: " + money;

        }


        /*
        RANDOM CARD
        */

        function getRandomCard() {

            let totalWeight = 0;


            for (const card of cards) {

                totalWeight += card.weight;

            }


            let random =
                Math.random() * totalWeight;


            for (const card of cards) {

                random -= card.weight;


                if (random <= 0) {

                    return card;

                }

            }


            return cards[cards.length - 1];

        }


        /*
        DISPLAY CARD
        */

        function displayCard(card, container) {

            const div = document.createElement("div");

            div.className = "card";


            const img = document.createElement("img");

            img.src = card.image;

            img.alt = card.name;


            const name = document.createElement("div");

            name.className = "cardName";

            name.textContent = card.name;


            div.appendChild(img);

            div.appendChild(name);

            container.appendChild(div);

        }


        /*
        DISPLAY SELLABLE CARD
        */

        function displaySellableCard(card, container) {

            const div = document.createElement("div");

            div.className = "card";


            const img = document.createElement("img");

            img.src = card.image;

            img.alt = card.name;


            const name = document.createElement("div");

            name.className = "cardName";

            name.textContent = card.name;


            const price = document.createElement("div");

            price.className = "sellPrice";

            price.textContent =
                "Sell for " + card.sellPrice + " coins";


            const sellButton =
                document.createElement("button");

            sellButton.className = "sellButton";

            sellButton.textContent = "SELL";


            sellButton.onclick = function() {

                sellCard(card);

            };


            div.appendChild(img);

            div.appendChild(name);

            div.appendChild(price);

            div.appendChild(sellButton);


            container.appendChild(div);

        }


        /*
        OPEN PACK
        */

        async function openPack() {

            if (!currentUser) return;


            const packCost = 10;


            if (money < packCost) {

                document.getElementById("message").textContent =
                    "Not enough coins.";

                return;

            }


            money -= packCost;


            const results =
                document.getElementById("packResults");


            results.innerHTML = "";


            for (let i = 0; i < 3; i++) {

                const card = getRandomCard();

                collection.push(card);

                displayCard(card, results);

            }


            updateCoins();


            document.getElementById("message").textContent =
                "You opened a pack!";


            try {

                await savePlayerData(currentUser);

            } catch (error) {

                console.error(
                    "PACK SAVE ERROR:",
                    error
                );

                document.getElementById("message").textContent =
                    "Pack opened, but saving failed.";

            }

        }


        /*
        SELL ONE COPY
        */

        async function sellCard(card) {

            if (!currentUser) return;


            const cardIndex =
                collection.indexOf(card);


            if (cardIndex === -1) return;


            collection.splice(cardIndex, 1);


            money += card.sellPrice;


            updateCoins();


            document.getElementById("message").textContent =
                "Sold " +
                card.name +
                " for " +
                card.sellPrice +
                " coins!";


            try {

                await savePlayerData(currentUser);

            } catch (error) {

                console.error(
                    "SELL SAVE ERROR:",
                    error
                );

            }


            const search =
                document.getElementById("search").value;


            renderCollection(search);

        }


        /*
        COLLECTION
        */

        function renderCollection(searchText = "") {

            const grid =
                document.getElementById("collectionGrid");


            grid.innerHTML = "";


            const search =
                searchText.toLowerCase();


            /*
            Official card order.
            */

            for (const card of cards) {

                if (!collection.includes(card)) {

                    continue;

                }


                if (
                    search &&
                    !card.name
                        .toLowerCase()
                        .includes(search)
                ) {

                    continue;

                }


                displaySellableCard(card, grid);

            }

        }


        function showCollection() {

            hideAllPages();

            document.getElementById(
                "collectionPage"
            ).style.display = "block";


            document.getElementById(
                "search"
            ).value = "";


            renderCollection();

        }


        function searchCollection() {

            const search =
                document.getElementById("search").value;


            renderCollection(search);

        }


        /*
        DEX
        */

        function renderDex(list) {

            const grid =
                document.getElementById("dexGrid");


            grid.innerHTML = "";


            for (const card of list) {

                const div =
                    document.createElement("div");


                div.className = "dexCard";


                if (card.comingSoon) {

                    const text =
                        document.createElement("div");


                    text.className =
                        "comingSoon";


                    text.textContent =
                        "Coming Soon";


                    div.appendChild(text);

                } else {

                    const img =
                        document.createElement("img");


                    img.src = card.image;

                    img.alt = card.name;

                    img.style.width = "100%";

                    img.style.maxHeight = "180px";

                    img.style.objectFit = "contain";


                    const name =
                        document.createElement("div");


                    name.className =
                        "cardName";


                    name.textContent =
                        card.name;


                    div.appendChild(img);

                    div.appendChild(name);

                }


                grid.appendChild(div);

            }

        }


        function showDex() {

            hideAllPages();

            document.getElementById(
                "dexPage"
            ).style.display = "block";


            showDexDolls();

        }


        function showDexDolls() {

            renderDex(dexDolls);

        }


        function showDexRares() {

            renderDex(dexRares);

        }


        /*
        HOME
        */

        function showHome() {

            hideAllPages();

            document.getElementById(
                "homePage"
            ).style.display = "block";

        }


        function hideAllPages() {

            document.querySelectorAll(".page")
                .forEach(page => {

                    page.style.display = "none";

                });

        }


        /*
        FIREBASE AUTH STATE
        */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (user) {

                    currentUser = user;


                    document.getElementById(
                        "loginScreen"
                    ).style.display = "none";


                    document.getElementById(
                        "gameScreen"
                    ).style.display = "block";


                    document.getElementById(
                        "userInfo"
                    ).textContent =
                        "Signed in as " +
                        user.displayName;


                    try {

                        await loadPlayerData(user);

                    } catch (error) {

                        console.error(
                            "LOAD ERROR:",
                            error
                        );

                        document.getElementById(
                            "message"
                        ).textContent =
                            "Could not load your saved data.";

                    }


                    showHome();

                } else {

                    currentUser = null;


                    document.getElementById(
                        "loginScreen"
                    ).style.display = "block";


                    document.getElementById(
                        "gameScreen"
                    ).style.display = "none";

                }

            }
        );


        /*
        INLINE BUTTON FUNCTIONS
        */

        window.login = login;

        window.logout = logout;

        window.openPack = openPack;

        window.showHome = showHome;

        window.showCollection = showCollection;

        window.showDex = showDex;

        window.showDexDolls = showDexDolls;

        window.showDexRares = showDexRares;

        window.searchCollection = searchCollection;

    </script>

</body>
</html>
