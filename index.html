<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Doll Ball Collector Cards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    h1 { margin-bottom: 20px; color: #f39c12; text-shadow: 0 0 10px rgba(243, 156, 18, 0.5); }
    
    .container { width: 100%; max-width: 900px; background: #1e1e1e; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .profile-bar { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #f39c12; }
    .coins { background: #333; padding: 6px 12px; border-radius: 20px; color: #f1c40f; font-weight: bold; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
    .tab-btn { background: #2a2a2a; color: #ccc; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .tab-btn.active, .tab-btn:hover { background: #f39c12; color: #121212; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* Card Grid */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    .card { background: #2a2a2a; border-radius: 10px; border: 2px solid #444; padding: 12px; text-align: center; position: relative; overflow: hidden; transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card.legendary { border-color: #f1c40f; box-shadow: 0 0 10px rgba(241, 196, 15, 0.4); }
    .card.epic { border-color: #9b59b6; box-shadow: 0 0 10px rgba(155, 89, 182, 0.4); }
    .card.rare { border-color: #3498db; box-shadow: 0 0 10px rgba(52, 152, 219, 0.4); }
    .card img { width: 100%; height: 140px; object-fit: contain; border-radius: 6px; background: #1a1a1a; margin-bottom: 10px; }
    .card-name { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; }
    .card-stats { font-size: 0.85em; color: #aaa; margin-bottom: 10px; }
    
    /* Buttons */
    button.action-btn { background: #e67e22; color: white; border: none; padding: 8px 12px; border-radius: 4px; width: 100%; cursor: pointer; font-weight: bold; }
    button.action-btn:hover { background: #d35400; }
    
    /* Battle Arena */
    .arena { display: flex; flex-direction: column; align-items: center; gap: 20px; background: #151515; padding: 20px; border-radius: 8px; }
    .battleHeader { display: flex; justify-content: space-around; width: 100%; align-items: center; }
    .battleVs { font-size: 2em; font-weight: bold; color: #e74c3c; }
    .battleCard { text-align: center; width: 140px; }
    .hpBar { width: 100%; background: #444; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 5px; }
    .hpFill { height: 100%; background: #2ecc71; width: 100%; transition: width 0.3s; }
    .battleMove { text-align: center; background: #222; padding: 10px 20px; border-radius: 6px; width: 100%; }
    .battleLog { font-size: 0.9em; color: #bbb; text-align: center; min-height: 40px; }
    .battleResult { text-align: center; }
    .winText { font-size: 1.8em; font-weight: bold; margin-bottom: 5px; }
    .rewardText { color: #f1c40f; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h1>Doll Ball Collector Cards</h1>

  <div class="container">
    <div class="profile-bar">
      <div class="user-info">
        <img id="userAvatar" class="avatar" src="https://via.placeholder.com/45" alt="Profile" />
        <span id="userName">Collector</span>
      </div>
      <div class="coins">Coins: <span id="coinCount">100</span> 🪙</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('collection')">Collection</button>
      <button class="tab-btn" onclick="switchTab('shop')">Shop</button>
      <button class="tab-btn" onclick="switchTab('battle')">Battle Arena</button>
    </div>

    <!-- Collection Tab -->
    <div id="collection" class="tab-content active">
      <div id="collectionGrid" class="card-grid"></div>
    </div>

    <!-- Shop Tab -->
    <div id="shop" class="tab-content">
      <div style="text-align: center; margin-bottom: 20px;">
        <h3>Booster Packs</h3>
        <p>Buy packs to unlock rare and legendary cards!</p>
      </div>
      <div class="card-grid">
        <div class="card rare">
          <h4>Standard Pack</h4>
          <p style="margin: 10px 0;">3 Cards (Common to Rare)</p>
          <button class="action-btn" onclick="buyPack('standard', 50)">Buy (50 Coins)</button>
        </div>
        <div class="card legendary">
          <h4>Premium Pack</h4>
          <p style="margin: 10px 0;">3 Cards (Rare to Legendary)</p>
          <button class="action-btn" onclick="buyPack('premium', 120)">Buy (120 Coins)</button>
        </div>
      </div>
    </div>

    <!-- Battle Tab -->
    <div id="battle" class="tab-content">
      <div id="arena" class="arena">
        <h3>Ready for Battle?</h3>
        <p>Select your card and face an opponent!</p>
        <button class="action-btn" style="width: 200px; margin-top: 15px;" onclick="startPvPBattle()">Find Battle</button>
      </div>
    </div>
  </div>

  <script>
    // System Constants & State
    const BATTLE_WIN_REWARD = 30;
    let coins = 100;
    let username = "Collector";
    let profilePic = "https://via.placeholder.com/45";
    let battleOpponentUsername = "Rival Trainer";
    let battleOpponentPic = "https://via.placeholder.com/45/e74c3c/ffffff";
    let battleListener = null;

    // Card Database
    const CARD_DATABASE = [
      { id: 1, name: "Glimmer Doll", rarity: "common", hp: 50, move: "Sparkle Tackle", moveType: "Normal", power: 15, image: "https://via.placeholder.com/150/ff7675/ffffff?text=Glimmer" },
      { id: 2, name: "Aqua Ball", rarity: "rare", hp: 70, move: "Bubble Blast", moveType: "Water", power: 25, image: "https://via.placeholder.com/150/74b9ff/ffffff?text=Aqua" },
      { id: 3, name: "Shadow Doll", rarity: "epic", hp: 85, move: "Dark Strike", moveType: "Shadow", power: 35, image: "https://via.placeholder.com/150/a29bfe/ffffff?text=Shadow" },
      { id: 4, name: "Solar Queen", rarity: "legendary", hp: 110, move: "Supernova", moveType: "Fire", power: 50, image: "https://via.placeholder.com/150/ffeaa7/000000?text=Solar" }
    ];

    let myCollection = [CARD_DATABASE[0], CARD_DATABASE[1]];

    // UI Helper Functions
    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function updateProfileUI() {
      document.getElementById('coinCount').innerText = coins;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function renderCollection() {
      const grid = document.getElementById('collectionGrid');
      grid.innerHTML = '';
      myCollection.forEach(card => {
        grid.innerHTML += `
          <div class="card ${card.rarity}">
            <img src="${card.image}" alt="${escapeHtml(card.name)}">
            <div class="card-name">${escapeHtml(card.name)}</div>
            <div class="card-stats">HP: ${card.hp} | Move: ${escapeHtml(card.move)}</div>
            <button class="action-btn" onclick="selectCardForBattle(${card.id})">Use in Battle</button>
          </div>
        `;
      });
    }

    let selectedBattleCard = myCollection[0];

    function selectCardForBattle(cardId) {
      selectedBattleCard = myCollection.find(c => c.id === cardId);
      alert(`Selected ${selectedBattleCard.name} for battle!`);
      switchTab('battle');
    }

    // Pack Opening Logic
    function buyPack(type, cost) {
      if (coins < cost) {
        alert("Not enough coins!");
        return;
      }
      coins -= cost;
      updateProfileUI();

      let pulledCard;
      if (type === 'premium') {
        pulledCard = CARD_DATABASE[Math.floor(Math.random() * 2) + 2]; // Rare or Legendary
      } else {
        pulledCard = CARD_DATABASE[Math.floor(Math.random() * 2)]; // Common or Rare
      }

      myCollection.push(pulledCard);
      renderCollection();
      alert(`Pack opened! You got: ${pulledCard.name} (${pulledCard.rarity.toUpperCase()})`);
    }

    // Battle System Logic
    function battleEffectivenessText(effectiveness) {
      if (effectiveness > 1) return '<span style="color:#2ecc71; font-weight:bold;">Super Effective!</span>';
      if (effectiveness < 1) return '<span style="color:#e74c3c; font-weight:bold;">Not very effective...</span>';
      return '<span>Normal Hit</span>';
    }

    function battleCardHTML(card, currentHp, ownerName, ownerPic) {
      const hpPct = Math.max(0, (currentHp / card.hp) * 100);
      return `
        <div class="battleCard">
          <img class="avatar" src="${ownerPic}" alt="${escapeHtml(ownerName)}" style="margin-bottom: 5px;">
          <div style="font-size:0.85em; color:#aaa;">${escapeHtml(ownerName)}</div>
          <img src="${card.image}" style="width:100px; height:100px; object-fit:contain; border-radius:6px; margin:5px 0;">
          <div style="font-weight:bold; font-size:0.9em;">${escapeHtml(card.name)}</div>
          <div class="hpBar"><div class="hpFill" style="width:${hpPct}%;"></div></div>
          <div style="font-size:0.8em; margin-top:2px;">${currentHp}/${card.hp} HP</div>
        </div>
      `;
    }

    function startPvPBattle() {
      const arena = document.getElementById('arena');
      const pCard = selectedBattleCard || myCollection[0];
      const oCard = CARD_DATABASE[Math.floor(Math.random() * CARD_DATABASE.length)]; // Random opponent card

      let pHp = pCard.hp;
      let oHp = oCard.hp;

      // Simulated Turn
      const pDmg = { damage: pCard.power, effectiveness: 1.0 };
      const oDmg = { damage: oCard.power, effectiveness: 1.0 };

      oHp -= pDmg.damage;
      pHp -= oDmg.damage;

      const win = pHp >= oHp;
      if (win) {
        coins += BATTLE_WIN_REWARD;
        updateProfileUI();
      }

      renderPvPBattleResult(arena, pCard, oCard, pHp, oHp, pDmg, oDmg, win);
    }

    function renderPvPBattleResult(arena, pCard, oCard, pHp, oHp, pDmg, oDmg, win) {
      arena.innerHTML = `<div class="battleHeader">${battleCardHTML(pCard, Math.max(0,pHp), username, profilePic)}<div class="battleVs">VS</div>${battleCardHTML(oCard, Math.max(0,oHp), battleOpponentUsername, battleOpponentPic)}</div><div class="battleMove"><div class="moveName">${escapeHtml(pCard.move)}</div><div class="moveType">${pCard.moveType} Move</div>${battleEffectivenessText(pDmg.effectiveness)}</div><div class="battleLog">You dealt ${pDmg.damage} damage to ${escapeHtml(battleOpponentUsername)}!<br>${escapeHtml(battleOpponentUsername)} used ${escapeHtml(oCard.move)} and dealt ${oDmg.damage} damage!</div><div class="battleResult"><div class="winText" style="color:${win?"#25b864":"#9b2929"}">${win?"YOU WIN!":"YOU LOSE!"}</div>${win?`<div class="rewardText">+${BATTLE_WIN_REWARD} Coins!</div>`:""}<button class="battleStartButton action-btn" style="width:150px;" onclick="cancelBattleSetup()">FINISH BATTLE</button></div>`;
    }

    function cancelBattleSetup() {
      stopBattleListener();
      document.getElementById('arena').innerHTML = `
        <h3>Ready for Battle?</h3>
        <p>Select your card and face an opponent!</p>
        <button class="action-btn" style="width: 200px; margin-top: 15px;" onclick="startPvPBattle()">Find Battle</button>
      `;
    }

    function stopBattleListener() {
      if (battleListener) { 
        battleListener(); 
        battleListener = null; 
      }
    }

    // Initialize UI
    renderCollection();
    updateProfileUI();
  </script>
</body>
</html>
