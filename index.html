<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doll Ball Collector Cards</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            margin: 6px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }


        /* LOGIN */

        #loginScreen {
            padding-top: 80px;
        }

        #gameScreen {
            display: none;
        }


        /* TOP BAR */

        #topBar {
            background: white;
            padding: 15px;
            box-shadow: 0 2px 5px #aaa;
        }

        #coins {
            font-size: 22px;
            font-weight: bold;
        }

        #userInfo {
            margin: 10px;
            font-size: 14px;
        }


        /* SPECIAL TOP BUTTONS */

        .settingsTopButton {
            background: #102a56;
        }

        .logoutTopButton {
            background: #c62828;
        }


        /* PAGES */

        .page {
            display: none;
        }

        #homePage {
            display: block;
        }


        /* CARDS */

        .cardGrid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(150px, 1fr));

            gap: 15px;

            padding: 20px;

            max-width: 1000px;

            margin: auto;
        }

        .card {
            background: white;

            border-radius: 15px;

            padding: 12px;

            box-shadow: 0 2px 7px #aaa;

            position: relative;

            box-sizing: border-box;
        }

        .card img {
            width: 100%;

            max-height: 180px;

            object-fit: contain;

            border-radius: 10px;
        }

        .cardName {
            font-weight: bold;

            font-size: 18px;

            margin-top: 8px;
        }


        /* COUNT */

        .countBadge {
            position: absolute;

            top: 8px;
            right: 8px;

            z-index: 100;

            background: black;

            color: white;

            width: 30px;
            height: 30px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            font-weight: bold;

            font-size: 16px;
        }


        /* FAVORITE STAR */

        .favoriteButton {
            position: absolute;

            top: 8px;
            left: 8px;

            z-index: 101;

            width: 36px;
            height: 36px;

            padding: 0;
            margin: 0;

            border-radius: 50%;

            background: white;

            color: #999;

            border: 2px solid #ccc;

            font-size: 21px;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .favoriteButton.isFavorite {
            color: #ffd21f;

            border-color: #ffd21f;
        }


        /* FAVORITE NORMAL CARD */

        .favoriteCard {
            border: 4px solid #36b9ff;

            box-shadow:
                0 0 0 2px #8ee0ff,
                0 0 12px #36b9ff;
        }


        /* RARE FAVORITE */

        .rareFavoriteCard {
            border: 4px solid gold;

            box-shadow:
                0 0 0 2px #fff0a3,
                0 0 10px gold,
                0 0 22px #ffd700;
        }

        .rareFavoriteCard::before {
            content: "✦ ✧ ✦";

            position: absolute;

            top: -13px;

            left: 50%;

            transform: translateX(-50%);

            color: gold;

            font-size: 15px;

            white-space: nowrap;

            z-index: 102;
        }


        /* SELL */

        .sellButton {
            background: #b3261e;

            width: 100%;

            margin-top: 8px;
        }

        .sellPrice {
            font-size: 14px;

            margin-top: 5px;
        }


        /* SEARCH */

        #search {
            width: 80%;

            max-width: 500px;

            padding: 12px;

            border-radius: 10px;

            border: 1px solid #aaa;

            font-size: 16px;

            margin: 15px;
        }


        /* DEX */

        .dexButtons {
            margin-top: 15px;
        }

        .dexCard {
            background: white;

            border-radius: 15px;

            padding: 15px;

            box-shadow: 0 2px 7px #aaa;

            position: relative;
        }

        .comingSoon {
            color: #888;

            font-weight: bold;

            padding: 30px 5px;
        }


        /* MESSAGE */

        #message {
            min-height: 25px;

            font-weight: bold;

            padding: 10px;
        }


        /* SETTINGS FULL SCREEN */

        #settingsScreen {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            background: #102a56;

            color: white;

            z-index: 9999;

            overflow-y: auto;
        }

        #settingsContent {
            max-width: 700px;

            margin: auto;

            padding: 30px 20px;
        }

        #settingsScreen h1 {
            font-size: 32px;

            margin-top: 20px;
        }

        .settingsSection {
            background: white;

            color: #222;

            border-radius: 15px;

            padding: 20px;

            margin-top: 20px;
        }

        .resetButton {
            background: #c62828;

            width: 90%;

            max-width: 400px;
        }

        .closeSettings {
            background: #333;

            width: 90%;

            max-width: 400px;
        }

    </style>
</head>

<body>


    <!-- LOGIN SCREEN -->

    <div id="loginScreen">

        <h1>Doll Ball Collector Cards</h1>

        <p>
            Sign in to save your collection and coins.
        </p>

        <button onclick="login()">
            Sign in with Google
        </button>

        <p id="loginMessage"></p>

    </div>


    <!-- GAME SCREEN -->

    <div id="gameScreen">


        <!-- TOP BAR -->

        <div id="topBar">

            <h1>Doll Ball Collector Cards</h1>

            <div id="coins">
                Coins: 50
            </div>

            <div id="userInfo"></div>


            <button onclick="showHome()">
                Home
            </button>


            <button onclick="showCollection()">
                Collection
            </button>


            <button onclick="showDex()">
                DEX
            </button>


            <button
                class="settingsTopButton"
                onclick="openSettings()"
            >
                Settings
            </button>


            <button
                class="logoutTopButton"
                onclick="logout()"
            >
                Log Out
            </button>

        </div>


        <div id="message"></div>


        <!-- HOME -->

        <div id="homePage" class="page">

            <h2>Open Pack</h2>

            <p>
                3 cards per pack
            </p>

            <p>
                Cost: 10 coins
            </p>

            <button onclick="openPack()">
                Open Pack
            </button>

            <div
                id="packResults"
                class="cardGrid"
            ></div>

        </div>


        <!-- COLLECTION -->

        <div id="collectionPage" class="page">

            <h2>Collection</h2>


            <button onclick="showCollectionAll()">
                ALL
            </button>


            <button onclick="showCollectionFavorites()">
                FAVORITES
            </button>


            <br>


            <input
                id="search"
                type="text"
                placeholder="Search cards..."
                oninput="searchCollection()"
            >


            <div
                id="collectionGrid"
                class="cardGrid"
            ></div>

        </div>


        <!-- DEX -->

        <div id="dexPage" class="page">

            <h2>DEX</h2>


            <div class="dexButtons">

                <button onclick="showDexDolls()">
                    DOLLS
                </button>


                <button onclick="showDexRares()">
                    RARES
                </button>

            </div>


            <div
                id="dexGrid"
                class="cardGrid"
            ></div>

        </div>


    </div>


    <!-- FULL SCREEN SETTINGS -->

    <div id="settingsScreen">

        <div id="settingsContent">

            <h1>Settings</h1>

            <p>
                Account Settings
            </p>


            <div class="settingsSection">

                <h2>Reset Account</h2>

                <p>
                    This permanently deletes your
                    coins, collection, and favorites.
                </p>

                <button
                    class="resetButton"
                    onclick="resetAccount()"
                >
                    Reset Account
                </button>

            </div>


            <br>


            <button
                class="closeSettings"
                onclick="closeSettings()"
            >
                Back to Game
            </button>

        </div>

    </div>


    <script type="module">

            getDoc,

        from

        /* FIREBASE */

        const firebaseConfig = {

            apiKey:

            authDomain:
                "dbcc-login.firebaseapp.com",

            databaseURL:
                "https://dbcc-login-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId:
                "dbcc-login",

            storageBucket:
                "dbcc-login.firebasestorage.app",

            messagingSenderId:
                "878902780767",

            appId:
                "1:878902780767:web:4020d11730e5d9c0ee0cea",

            measurementId:
                "G-PT9S1K4E2K"

        };


        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);


        const provider =
            new GoogleAuthProvider();


        /* PLAYER DATA */

        let money = 50;

        let collection = [];

        let favorites = [];

        let currentUser = null;


        /* CARDS */

        const cards = [

            },


            {

            },


            {
                name: "Nico",
                image: "nico.png",
                weight: 20,
                sellPrice: 3,
                rarity: "doll"
            },


            {
                name: "Choper",
                image: "choper.png",
                weight: 10,
                sellPrice: 5,
                rarity: "doll"
            },


            {
                name: "Bullet",
                image: "bullet.png",
                weight: 10,
                sellPrice: 5,
                rarity: "doll"
            }

        ];


        /* DEX DOLLS */

        const dexDolls =
            [...cards];


        for (
            let i = 13;
            i <= 123;
            i++
        ) {

            dexDolls.push({

                name: "Coming Soon",

                image: null,

                comingSoon: true,

                rarity: "doll"

            });

        }


        /* DEX RARES */

        const dexRares = [


            {
                name: "Coming Soon",
                image: null,
                comingSoon: true,
                rarity: "rare"
            },


            {
                name: "Coming Soon",
                image: null,

            },

            },

            },


            {

            }

        ];


        /* LOGIN */

        async function login() {

            try {

                await signInWithPopup(
                    auth,
                    provider
                );

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "loginMessage"
                ).textContent =
                    "Login error: " +
                    error.message;

            }

        }


        /* LOGOUT */

        async function logout() {

            try {

                await signOut(auth);

            } catch (error) {

                console.error(error);

            }

        }


        /* LOAD DATA */

        async function loadPlayerData(user) {

            const playerRef =
                doc(
                    db,
                    "players",
                    user.uid
                );


            const playerSnap =
                await getDoc(playerRef);


            if (playerSnap.exists()) {

                const data =
                    playerSnap.data();


                if (
                    typeof data.money ===
                    "number"
                ) {

                    money =
                        data.money;

                } else {

                    money = 50;

                }


                collection = [];


                if (
                    Array.isArray(
                        data.collection
                    )
                ) {

                    for (
                        const cardName
                        of data.collection
                    ) {

                        const card =
                            cards.find(
                                c =>
                                c.name ===
                                cardName
                            );


                        if (card) {

                            collection.push(
                                card
                            );

                        }

                    }

                }


                favorites = [];


                if (
                    Array.isArray(
                        data.favorites
                    )
                ) {

                    favorites =
                        data.favorites.filter(
                            name =>
                            cards.some(
                                c =>
                                c.name ===
                                name
                            )
                        );

                }

            } else {

                money = 50;

                collection = [];

                favorites = [];

                await savePlayerData(user);

            }


            updateCoins();

        }


        /* SAVE DATA */

        async function savePlayerData(user) {

            if (!user) return;


            const playerRef =
                doc(
                    db,
                    "players",
                    user.uid
                );


            await setDoc(

                playerRef,

                {

                    money: money,

                    collection:
                        collection.map(
                            card =>
                            card.name
                        ),

                    favorites:
                        favorites

                },

                {
                    merge: true
                }

            );

        }


        /* COINS */

        function updateCoins() {

            document.getElementById(
                "coins"
            ).textContent =
                "Coins: " + money;

        }


        /* RANDOM CARD */

        function getRandomCard() {

            let totalWeight = 0;


            for (
                const card of cards
            ) {

                totalWeight +=
                    card.weight;

            }


            let random =
                Math.random() *
                totalWeight;


            for (
                const card of cards
            ) {

                random -=
                    card.weight;


                if (
                    random <= 0
                ) {

                    return card;

                }

            }


            return cards[
                cards.length - 1
            ];

        }


        /* FAVORITE CHECK */

        function isFavorite(card) {

            return favorites.includes(
                card.name
            );

        }


        /* TOGGLE FAVORITE */

        async function toggleFavorite(card) {

            if (!currentUser) return;


            const index =
                favorites.indexOf(
                    card.name
                );


            if (index === -1) {

                favorites.push(
                    card.name
                );


                document.getElementById(
                    "message"
                ).textContent =
                    card.name +
                    " is now a favorite!";

            } else {

                favorites.splice(
                    index,
                    1
                );


                document.getElementById(
                    "message"
                ).textContent =
                    card.name +
                    " is no longer a favorite.";

            }


            try {

                await savePlayerData(
                    currentUser
                );

            } catch (error) {

                console.error(
                    "FAVORITE SAVE ERROR:",
                    error
                );

            }


            const search =
                document.getElementById(
                    "search"
                ).value;


            const favoritesOnly =
                document.getElementById(
                    "collectionGrid"
                ).dataset.favorites ===
                "true";


            renderCollection(
                search,
                favoritesOnly
            );

        }


        /* NORMAL PACK CARD */

        function displayCard(
            card,
            container
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "card";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                card.image;


            img.alt =
                card.name;


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "cardName";


            name.textContent =
                card.name;


            div.appendChild(img);

            div.appendChild(name);

            container.appendChild(div);

        }


        /* COLLECTION CARD */

        function displaySellableCard(
            card,
            container
        ) {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "card";


            div.style.position =
                "relative";


            /* FAVORITE EDGE */

            if (
                isFavorite(card)
            ) {

                if (
                    card.rarity ===
                    "rare"
                ) {

                    div.classList.add(
                        "rareFavoriteCard"
                    );

                } else {

                    div.classList.add(
                        "favoriteCard"
                    );

                }

            }


            /* COUNT */

            const count =
                collection.filter(
                    c =>
                    c.name ===
                    card.name
                ).length;


            const countBadge =
                document.createElement(
                    "div"
                );


            countBadge.className =
                "countBadge";


            countBadge.textContent =
                count;


            /* STAR */

            const favoriteButton =
                document.createElement(
                    "button"
                );


            favoriteButton.className =
                "favoriteButton";


            if (
                isFavorite(card)
            ) {

                favoriteButton.classList.add(
                    "isFavorite"
                );

                favoriteButton.textContent =
                    "★";

            } else {

                favoriteButton.textContent =
                    "☆";

            }


            favoriteButton.onclick =
                function(event) {

                    event.stopPropagation();

                    toggleFavorite(
                        card
                    );

                };


            /* IMAGE */

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                card.image;


            img.alt =
                card.name;


            /* NAME */

            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "cardName";


            name.textContent =
                card.name;


            /* PRICE */

            const price =
                document.createElement(
                    "div"
                );


            price.className =
                "sellPrice";


            price.textContent =
                "Sell for " +
                card.sellPrice +
                " coins";


            /* SELL */

            const sellButton =
                document.createElement(
                    "button"
                );


            sellButton.className =
                "sellButton";


            sellButton.textContent =
                "SELL";


            if (
                isFavorite(card)
            ) {

                sellButton.disabled =
                    true;


                sellButton.textContent =
                    "FAVORITED";


                sellButton.style.background =
                    "#777";


                sellButton.style.cursor =
                    "not-allowed";

            } else {

                sellButton.onclick =
                    function() {

                        sellCard(card);

                    };

            }


            div.appendChild(
                countBadge
            );


            div.appendChild(
                favoriteButton
            );


            div.appendChild(
                img
            );


            div.appendChild(
                name
            );


            div.appendChild(
                price
            );


            div.appendChild(
                sellButton
            );


            container.appendChild(
                div
            );

        }


        /* OPEN PACK */

        async function openPack() {

            if (!currentUser)
                return;


            const packCost =
                10;


            if (
                money < packCost
            ) {

                document.getElementById(
                    "message"
                ).textContent =
                    "Not enough coins.";

                return;

            }


            money -=
                packCost;


            const results =
                document.getElementById(
                    "packResults"
                );


            results.innerHTML =
                "";


            for (
                let i = 0;
                i < 3;
                i++
            ) {

                const card =
                    getRandomCard();


                collection.push(
                    card
                );


                displayCard(
                    card,
                    results
                );

            }


            updateCoins();


            document.getElementById(
                "message"
            ).textContent =
                "You opened a pack!";


            try {

                await savePlayerData(
                    currentUser
                );

            } catch (error) {

                console.error(
                    "PACK SAVE ERROR:",
                    error
                );


                document.getElementById(
                    "message"
                ).textContent =
                    "Pack opened, but saving failed.";

            }

        }


        /* SELL */

        async function sellCard(card) {

            if (!currentUser)
                return;


            if (
                isFavorite(card)
            ) {

                document.getElementById(
                    "message"
                ).textContent =
                    "Favorite cards cannot be sold.";

                return;

            }


            const cardIndex =
                collection.indexOf(
                    card
                );


            if (
                cardIndex === -1
            )
                return;


            collection.splice(
                cardIndex,
                1
            );


            money +=
                card.sellPrice;


            updateCoins();


            document.getElementById(
                "message"
            ).textContent =
                "Sold " +
                card.name +
                " for " +
                card.sellPrice +
                " coins!";


            try {

                await savePlayerData(
                    currentUser
                );

            } catch (error) {

                console.error(
                    "SELL SAVE ERROR:",
                    error
                );

            }


            const search =
                document.getElementById(
                    "search"
                ).value;


            const favoritesOnly =
                document.getElementById(
                    "collectionGrid"
                ).dataset.favorites ===
                "true";


            renderCollection(
                search,
                favoritesOnly
            );

        }


        /* COLLECTION RENDER */

        function renderCollection(
            searchText = "",
            favoritesOnly = false
        ) {

            const grid =
                document.getElementById(
                    "collectionGrid"
                );


            grid.innerHTML =
                "";


            grid.dataset.favorites =
                favoritesOnly
                    ? "true"
                    : "false";


            const search =
                searchText.toLowerCase();


            for (
                const card of cards
            ) {


                if (
                    !collection.includes(
                        card
                    )
                ) {

                    continue;

                }


                if (
                    favoritesOnly &&
                    !favorites.includes(
                        card.name
                    )
                ) {

                    continue;

                }


                if (
                    search &&
                    !card.name
                        .toLowerCase()
                        .includes(search)
                ) {

                    continue;

                }


                displaySellableCard(
                    card,
                    grid
                );

            }

        }


        /* COLLECTION */

        function showCollection() {

            showCollectionAll();

        }


        function showCollectionAll() {

            hideAllPages();


            document.getElementById(
                "collectionPage"
            ).style.display =
                "block";


            document.getElementById(
                "search"
            ).value =
                "";


            document.getElementById(
                "collectionGrid"
            ).dataset.favorites =
                "false";


            renderCollection(
                "",
                false
            );

        }


        function showCollectionFavorites() {

            hideAllPages();


            document.getElementById(
                "collectionPage"
            ).style.display =
                "block";


            document.getElementById(
                "search"
            ).value =
                "";


            document.getElementById(
                "collectionGrid"
            ).dataset.favorites =
                "true";


            renderCollection(
                "",
                true
            );

        }


        /* SEARCH */

        function searchCollection() {

            const search =
                document.getElementById(
                    "search"
                ).value;


            const favoritesOnly =
                document.getElementById(
                    "collectionGrid"
                ).dataset.favorites ===
                "true";


            renderCollection(
                search,
                favoritesOnly
            );

        }


        /* DEX */

        function renderDex(list) {

            const grid =
                document.getElementById(
                    "dexGrid"
                );


            grid.innerHTML =
                "";


            for (
                const card of list
            ) {


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "dexCard";


                if (
                    card.comingSoon
                ) {


                    const text =
                        document.createElement(
                            "div"
                        );


                    text.className =
                        "comingSoon";


                    text.textContent =
                        "Coming Soon";


                    div.appendChild(
                        text
                    );


                } else {


                    if (
                        isFavorite(card)
                    ) {

                        if (
                            card.rarity ===
                            "rare"
                        ) {

                            div.classList.add(
                                "rareFavoriteCard"
                            );

                        } else {

                            div.classList.add(
                                "favoriteCard"
                            );

                        }

                    }


                    const img =
                        document.createElement(
                            "img"
                        );


                    img.src =
                        card.image;


                    img.alt =
                        card.name;


                    img.style.width =
                        "100%";


                    img.style.maxHeight =
                        "180px";


                    img.style.objectFit =
                        "contain";


                    const name =
                        document.createElement(
                            "div"
                        );


                    name.className =
                        "cardName";


                    name.textContent =
                        card.name;


                    div.appendChild(
                        img
                    );


                    div.appendChild(
                        name
                    );

                }


                grid.appendChild(
                    div
                );

            }

        }


        function showDex() {

            hideAllPages();


            document.getElementById(
                "dexPage"
            ).style.display =
                "block";


            showDexDolls();

        }


        function showDexDolls() {

            renderDex(
                dexDolls
            );

        }


        function showDexRares() {

            renderDex(
                dexRares
            );

        }


        /* HOME */

        function showHome() {

            hideAllPages();


            document.getElementById(
                "homePage"
            ).style.display =
                "block";

        }


        function hideAllPages() {

            document
                .querySelectorAll(
                    ".page"
                )
                .forEach(
                    page => {

                        page.style.display =
                            "none";

                    }
                );

        }


        /* SETTINGS */

        function openSettings() {

            document.getElementById(
                "settingsScreen"
            ).style.display =
                "block";

        }


        function closeSettings() {

            document.getElementById(
                "settingsScreen"
            ).style.display =
                "none";

        }


        /* RESET ACCOUNT */

        async function resetAccount() {

            if (!currentUser)
                return;


            const confirmed =
                confirm(
                    "Are you sure you want to reset your account?\n\nThis will permanently delete your coins, collection, and favorites."
                );


            if (!confirmed)
                return;


            const doubleConfirmed =
                confirm(
                    "This cannot be undone. Reset your account?"
                );


            if (!doubleConfirmed)
                return;


            try {


                const playerRef =
                    doc(
                        db,
                        "players",
                        currentUser.uid
                    );


                await deleteDoc(
                    playerRef
                );


                money = 50;

                collection = [];

                favorites = [];


                updateCoins();


                document.getElementById(
                    "packResults"
                ).innerHTML =
                    "";


                document.getElementById(
                    "message"
                ).textContent =
                    "Account reset successfully.";


                closeSettings();


                showHome();


            } catch (error) {

                console.error(
                    "RESET ERROR:",
                    error
                );


                document.getElementById(
                    "message"
                ).textContent =
                    "Could not reset account.";

            }

        }


        /* FIREBASE AUTH */

        onAuthStateChanged(

            auth,

            async (user) => {


                if (user) {


                    currentUser =
                        user;


                    document.getElementById(
                        "loginScreen"
                    ).style.display =
                        "none";


                    document.getElementById(
                        "gameScreen"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "userInfo"
                    ).textContent =
                        "Signed in as " +
                        user.displayName;


                    try {

                        await loadPlayerData(
                            user
                        );

                    } catch (error) {

                        console.error(
                            "LOAD ERROR:",
                            error
                        );


                        document.getElementById(
                            "message"
                        ).textContent =
                            "Could not load your saved data.";

                    }


                    showHome();


                } else {


                    currentUser =
                        null;


                    document.getElementById(
                        "loginScreen"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "gameScreen"
                    ).style.display =
                        "none";


                    closeSettings();

                }

            }

        );


        /* WINDOW FUNCTIONS */

        window.login =
            login;

        window.logout =
            logout;

        window.openPack =
            openPack;

        window.showHome =
            showHome;

        window.showCollection =
            showCollection;

        window.showCollectionAll =
            showCollectionAll;

        window.showCollectionFavorites =
            showCollectionFavorites;

        window.showDex =
            showDex;

        window.showDexDolls =
            showDexDolls;

        window.showDexRares =
            showDexRares;

        window.searchCollection =
            searchCollection;

        window.toggleFavorite =
            toggleFavorite;

        window.openSettings =
            openSettings;

        window.closeSettings =
            closeSettings;

        window.resetAccount =
            resetAccount;

    </script>

</body>
</html>
