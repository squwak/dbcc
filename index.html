<!DOCTYPE html><html><head>
    <title>Doll Ball Collector Cards</title><style>

    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
    }

    h1 {
        margin-top: 20px;
    }

    button {
        font-size: 20px;
        padding: 15px 25px;
        cursor: pointer;
        margin: 5px;
        border-radius: 10px;
        border: 2px solid #333;
    }

    /* SCREENS */

    #loginScreen {
        display: block;
        margin-top: 80px;
    }

    #gameScreen {
        display: none;
    }

    #dexScreen {
        display: none;
    }

    /* LOGIN */

    #loginMessage {
        font-size: 18px;
    }

    /* USER */

    #userInfo {
        margin: 15px;
        font-size: 18px;
    }

    #userPhoto {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        vertical-align: middle;
        margin: 10px;
    }

    /* COINS */

    #money {
        font-size: 20px;
        margin: 20px;
    }

    #message {
        font-size: 20px;
        margin: 20px;
    }

    /* NORMAL CARDS */

    .card {
        display: inline-block;
        vertical-align: top;
        background: white;
        border: 2px solid #333;
        border-radius: 15px;
        padding: 10px;
        margin: 10px;
        width: 180px;
    }

    .card img {
        width: 160px;
        height: 220px;
        object-fit: contain;
    }

    .card p {
        font-size: 18px;
        font-weight: bold;
    }

    /* DEX */

    #dexProgress {
        font-size: 20px;
        font-weight: bold;
    }

    #dexCards {
        max-width: 1200px;
        margin: auto;
    }

    .dexCard {
        display: inline-block;
        vertical-align: top;
        width: 180px;
        height: 280px;
        background: white;
        border: 3px solid #333;
        border-radius: 15px;
        margin: 8px;
        padding: 10px;
        box-sizing: border-box;
    }

    .dexNumber {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .dexCard img {
        width: 150px;
        height: 200px;
        object-fit: contain;
    }

    .dexName {
        font-size: 18px;
        font-weight: bold;
        margin-top: 5px;
    }

    .locked {
        background: #ddd;
        border-color: #888;
    }

    .unknown {
        width: 150px;
        height: 200px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 45px;
        font-weight: bold;
        color: #555;
    }

    .comingSoon {
        background: #e8e8e8;
        border-color: #aaa;
    }

    .comingSoonText {
        height: 210px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
    }

</style>

</head><body><!-- ========================= --><!-- LOGIN --><!-- ========================= --><div id="loginScreen"><h1>🎴 Doll Ball Collector Cards</h1>

<h2>Welcome to DBCC!</h2>

<p>Sign in to save your collection.</p>

<button id="googleLoginButton">
    🔵 Sign in with Google
</button>

<p id="loginMessage"></p>

</div><!-- ========================= --><!-- GAME --><!-- ========================= --><div id="gameScreen"><h1>Doll Ball Collector Cards</h1>

<div id="userInfo"></div>

<div id="money">
    🪙 Coins:
    <span id="coins">50</span>
</div>

<button id="openPackButton">
    OPEN PACK - 10 COINS
</button>

<button id="dexButton">
    📖 DEX
</button>

<button id="logoutButton">
    LOG OUT
</button>

<p id="message"></p>

<div id="cards"></div>

</div><!-- ========================= --><!-- DEX --><!-- ========================= --><div id="dexScreen"><h1>📖 Doll Ball Dex</h1>

<p id="dexProgress">
    Collected: 0 / 12
</p>

<button id="backButton">
    ← BACK TO PACKS
</button>

<div id="dexCards"></div>

</div><!-- ========================= --><!-- FIREBASE --><!-- ========================= --><script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
}
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey: "AIzaSyC-6paRzUxBv6DhZ5Vx_c8BG8vxcKe9xYw",

    authDomain: "dbcc-login.firebaseapp.com",

    projectId: "dbcc-login",

    storageBucket: "dbcc-login.firebasestorage.app",

    messagingSenderId: "878902780767",

    appId: "1:878902780767:web:4020d11730e5d9c0ee0cea",

    measurementId: "G-PT9S1K4E2K"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();



/* =========================
   GAME VARIABLES
========================= */

let money = 50;

let collection = [];



/* =========================
   12 MAIN CARDS
========================= */

const cards = [

    {
        id: 1,
        name: "Baby Pickels",
        image: "baby pikels.png",
        chance: 14
    },

    {
        id: 2,
        name: "Mr Pickels",
        image: "mr. pickels.png",
        chance: 9
    },

    {
        id: 3,
        name: "Wily",
        image: "wily.png",
        chance: 14
    },

    {
        id: 4,
        name: "Will",
        image: "will.png",
        chance: 9
    },

    {
        id: 5,
        name: "Waffle",
        image: "waffle.png",
        chance: 14
    },

    {
        id: 6,
        name: "Cute Cake",
        image: "cute cake.png",
        chance: 9
    },

    {
        id: 7,
        name: "Buttyr",
        image: "buttyr.png",
        chance: 20
    },

    {
        id: 8,
        name: "Blossem",
        image: "blossem.png",
        chance: 20
    },

    {
        id: 9,
        name: "Buzzy",
        image: "buzzy.png",
        chance: 5
    },

    {
        id: 10,
        name: "Nico",
        image: "nico.png",
        chance: 20
    },

    {
        id: 11,
        name: "Choper",
        image: "choper.png",
        chance: 10
    },

    {
        id: 12,
        name: "Bullet",
        image: "bullet.png",
        chance: 10
    }

];



/* =========================
   GOOGLE LOGIN
========================= */

document
    .getElementById("googleLoginButton")
    .addEventListener("click", async function() {

        try {

            await signInWithPopup(auth, provider);

        }

        catch(error) {

            console.error(error);

            document
                .getElementById("loginMessage")
                .textContent =
                "❌ Login failed: " + error.message;

        }

    });



/* =========================
   LOGOUT
========================= */

document
    .getElementById("logoutButton")
    .addEventListener("click", async function() {

        await signOut(auth);

    });



/* =========================
   LOGIN STATE
========================= */

onAuthStateChanged(auth, function(user) {

    if (user) {

        document
            .getElementById("loginScreen")
            .style.display = "none";

        document
            .getElementById("gameScreen")
            .style.display = "block";

        document
            .getElementById("dexScreen")
            .style.display = "none";


        const userInfo =
            document.getElementById("userInfo");


        if (user.photoURL) {

            userInfo.innerHTML =
                `<img id="userPhoto"
                src="${user.photoURL}"
                alt="Profile">
                Welcome, ${user.displayName}!`;

        }

        else {

            userInfo.textContent =
                "Welcome, " + user.displayName + "!";

        }

    }

    else {

        document
            .getElementById("loginScreen")
            .style.display = "block";

        document
            .getElementById("gameScreen")
            .style.display = "none";

        document
            .getElementById("dexScreen")
            .style.display = "none";

    }

});



/* =========================
   RANDOM CARD
========================= */

function getRandomCard() {

    let total = 0;

    for (const card of cards) {

        total += card.chance;

    }


    let random =
        Math.random() * total;


    for (const card of cards) {

        random -= card.chance;

        if (random <= 0) {

            return card;

        }

    }

}



/* =========================
   OPEN PACK
========================= */

document
    .getElementById("openPackButton")
    .addEventListener("click", function() {

        if (money < 10) {

            document
                .getElementById("message")
                .textContent =
                "❌ Not enough coins!";

            return;

        }


        money -= 10;


        document
            .getElementById("coins")
            .textContent = money;


        document
            .getElementById("cards")
            .innerHTML = "";


        const pack = [];


        for (let i = 0; i < 3; i++) {

            const card = getRandomCard();

            pack.push(card);

            collection.push(card);

        }


        document
            .getElementById("message")
            .textContent =
            "🎉 You got 3 cards!";


        for (const card of pack) {

            displayCard(
                card,
                document.getElementById("cards")
            );

        }

    });



/* =========================
   DISPLAY CARD
========================= */

function displayCard(card, container) {

    const cardDiv =
        document.createElement("div");

    cardDiv.className = "card";


    const image =
        document.createElement("img");

    image.src = card.image;

    image.alt = card.name;


    const name =
        document.createElement("p");

    name.textContent = card.name;


    cardDiv.appendChild(image);

    cardDiv.appendChild(name);

    container.appendChild(cardDiv);

}



/* =========================
   OPEN DEX
========================= */

document
    .getElementById("dexButton")
    .addEventListener("click", function() {

        document
            .getElementById("gameScreen")
            .style.display = "none";

        document
            .getElementById("dexScreen")
            .style.display = "block";


        buildDex();

        window.scrollTo(0, 0);

    });



/* =========================
   BUILD DEX
========================= */

function buildDex() {

    const container =
        document.getElementById("dexCards");

    container.innerHTML = "";


    let uniqueOwned = 0;


    /* =========================
       CARDS #001 - #012
    ========================= */

    for (const card of cards) {

        const div =
            document.createElement("div");

        div.className = "dexCard";


        const number =
            document.createElement("div");

        number.className = "dexNumber";

        number.textContent =
            "#" + String(card.id).padStart(3, "0");

        div.appendChild(number);


        const owned =
            collection.some(
                ownedCard => ownedCard.id === card.id
            );


        if (owned) {

            uniqueOwned++;


            const image =
                document.createElement("img");

            image.src = card.image;

            image.alt = card.name;

            div.appendChild(image);


            const name =
                document.createElement("div");

            name.className = "dexName";

            name.textContent = card.name;

            div.appendChild(name);

        }

        else {

            div.classList.add("locked");


            const unknown =
                document.createElement("div");

            unknown.className = "unknown";

            unknown.textContent = "???";

            div.appendChild(unknown);


            const name =
                document.createElement("div");

            name.className = "dexName";

            name.textContent = "???";

            div.appendChild(name);

        }


        container.appendChild(div);

    }



    /* =========================
       #013 - #123
       111 COMING SOON
    ========================= */

    for (let i = 13; i <= 123; i++) {

        const div =
            document.createElement("div");

        div.className =
            "dexCard comingSoon";


        const number =
            document.createElement("div");

        number.className =
            "dexNumber";

        number.textContent =
            "#" + String(i).padStart(3, "0");


        div.appendChild(number);


        const text =
            document.createElement("div");

        text.className =
            "comingSoonText";

        text.textContent =
            "COMING SOON";


        div.appendChild(text);


        container.appendChild(div);

    }


    document
        .getElementById("dexProgress")
        .textContent =
        "Collected: " +
        uniqueOwned +
        " / 12";

}



/* =========================
   BACK TO GAME
========================= */

document
    .getElementById("backButton")
    .addEventListener("click", function() {

        document
            .getElementById("dexScreen")
            .style.display = "none";

        document
            .getElementById("gameScreen")
            .style.display = "block";

        window.scrollTo(0, 0);

    });

</script></body></html>
