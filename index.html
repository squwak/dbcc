<!DOCTYPE html>
<html>
<head>
    <title>Doll Ball Collector Cards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-top: 20px;
        }

        #money {
            font-size: 20px;
            margin: 20px;
        }

        button {
            font-size: 20px;
            padding: 15px 25px;
            cursor: pointer;
            margin: 5px;
            border-radius: 10px;
            border: 2px solid #333;
            background: white;
        }

        button:hover {
            background: #eee;
        }

        #message {
            font-size: 20px;
            margin: 20px;
        }

        .card {
            display: inline-block;
            vertical-align: top;
            background: white;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 10px;
            margin: 10px;
            width: 180px;
        }

        .card img {
            width: 160px;
            height: 220px;
            object-fit: contain;
        }

        .card p {
            font-size: 18px;
            font-weight: bold;
        }

        #collection,
        #dex {
            display: none;
        }

        #collectionCards,
        #dexCards {
            margin-top: 20px;
        }

        #search {
            font-size: 18px;
            padding: 12px;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
            border: 2px solid #333;
            margin: 10px;
        }

        .dexCard {
            display: inline-block;
            vertical-align: top;
            background: white;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 10px;
            margin: 10px;
            width: 180px;
        }

        .dexCard img {
            width: 160px;
            height: 220px;
            object-fit: contain;
        }

        .comingSoon {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        #loginScreen {
            display: block;
        }

        #gameScreen {
            display: none;
        }

        #userInfo {
            margin: 15px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <!-- ========================= -->
    <!-- LOGIN SCREEN -->
    <!-- ========================= -->

    <div id="loginScreen">

        <h1>Doll Ball Collector Cards</h1>

        <h2>Login</h2>

        <button id="googleLoginButton">
            LOGIN WITH GOOGLE
        </button>

        <p id="loginMessage"></p>

    </div>


    <!-- ========================= -->
    <!-- GAME SCREEN -->
    <!-- ========================= -->

    <div id="gameScreen">

        <h1>Doll Ball Collector Cards</h1>

        <div id="userInfo">
            <span id="userName"></span>
            <br>
            <button id="logoutButton">
                LOG OUT
            </button>
        </div>


        <!-- ========================= -->
        <!-- PACK SCREEN -->
        <!-- ========================= -->

        <div id="packScreen">

            <div id="money">
                Coins: <span id="coins">50</span>
            </div>

            <button onclick="openPack()">
                OPEN PACK - 10 COINS
            </button>

            <button onclick="showCollection()">
                COLLECTION
            </button>

            <button onclick="showDex()">
                DEX
            </button>

            <p id="message"></p>

            <div id="cards"></div>

        </div>


        <!-- ========================= -->
        <!-- COLLECTION -->
        <!-- ========================= -->

        <div id="collection">

            <h2>My DBCC Collection</h2>

            <input
                id="search"
                type="text"
                placeholder="Search collection..."
                oninput="searchCollection()"
            >

            <div id="collectionCards"></div>

            <br>

            <button onclick="backToPacks()">
                BACK TO PACKS
            </button>

        </div>


        <!-- ========================= -->
        <!-- DEX -->
        <!-- ========================= -->

        <div id="dex">

            <h2>DBCC DEX</h2>

            <button onclick="showDollsDex()">
                DOLLS
            </button>

            <button onclick="showRaresDex()">
                RARES
            </button>

            <div id="dexCards"></div>

            <br>

            <button onclick="backToPacks()">
                BACK TO PACKS
            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- FIREBASE -->
    <!-- ========================= -->

    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            signOut,
            onAuthStateChanged
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            setDoc
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


        // =====================================
        // FIREBASE CONFIG
        // =====================================

        const firebaseConfig = {

            apiKey: "YOUR_API_KEY",

            authDomain: "YOUR_PROJECT.firebaseapp.com",

            projectId: "YOUR_PROJECT_ID",

            storageBucket: "YOUR_PROJECT.firebasestorage.app",

            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

            appId: "YOUR_APP_ID"

        };


        // =====================================
        // START FIREBASE
        // =====================================

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);

        const provider = new GoogleAuthProvider();


        // =====================================
        // GAME DATA
        // =====================================

        let money = 50;

        let collection = [];

        let currentUser = null;


        // =====================================
        // DBCC CARDS
        // =====================================

        const cards = [

            {
                name: "Baby Pickels",
                image: "baby pikels.png",
                chance: 14
            },

            {
                name: "Mr Pickels",
                image: "mr. pickels.png",
                chance: 9
            },

            {
                name: "Wily",
                image: "wily.png",
                chance: 14
            },

            {
                name: "Will",
                image: "will.png",
                chance: 9
            },

            {
                name: "Waffle",
                image: "waffle.png",
                chance: 14
            },

            {
                name: "Cute Cake",
                image: "cute cake.png",
                chance: 9
            },

            {
                name: "Buttyr",
                image: "buttyr.png",
                chance: 20
            },

            {
                name: "Blossem",
                image: "blossem.png",
                chance: 20
            },

            {
                name: "Buzzy",
                image: "buzzy.png",
                chance: 5
            },

            {
                name: "Nico",
                image: "nico.png",
                chance: 20
            },

            {
                name: "Choper",
                image: "choper.png",
                chance: 10
            },

            {
                name: "Bullet",
                image: "bullet.png",
                chance: 10
            }

        ];


        // =====================================
        // DEX DOLLS
        // =====================================

        const dexDolls = [...cards];


        for (let i = 13; i <= 123; i++) {

            dexDolls.push({

                name: "Coming Soon",

                image: "",

                chance: 0

            });

        }


        // =====================================
        // DEX RARES
        // =====================================

        const dexRares = [

            {
                name: "Coming Soon",
                image: ""
            },

            {
                name: "Coming Soon",
                image: ""
            },

            {
                name: "Coming Soon",
                image: ""
            },

            {
                name: "Coming Soon",
                image: ""
            },

            {
                name: "Coming Soon",
                image: ""
            },

            {
                name: "Coming Soon",
                image: ""
            }

        ];


        // =====================================
        // RANDOM CARD
        // =====================================

        function getRandomCard() {

            let total = 0;

            for (let card of cards) {

                total += card.chance;

            }


            let random = Math.random() * total;


            for (let card of cards) {

                random -= card.chance;

                if (random <= 0) {

                    return card;

                }

            }

        }


        // =====================================
        // GOOGLE LOGIN
        // =====================================

        document
            .getElementById("googleLoginButton")
            .addEventListener("click", async function () {

                try {

                    document
                        .getElementById("loginMessage")
                        .textContent = "Logging in...";


                    await signInWithPopup(
                        auth,
                        provider
                    );

                }

                catch (error) {

                    console.error(error);

                    document
                        .getElementById("loginMessage")
                        .textContent =
                        "Login failed: " + error.message;

                }

            });


        // =====================================
        // LOGOUT
        // =====================================

        document
            .getElementById("logoutButton")
            .addEventListener("click", async function () {

                await signOut(auth);

            });


        // =====================================
        // AUTH STATE
        // =====================================

        onAuthStateChanged(
            auth,
            async function (user) {

                if (user) {

                    currentUser = user;


                    document
                        .getElementById("loginScreen")
                        .style.display = "none";


                    document
                        .getElementById("gameScreen")
                        .style.display = "block";


                    document
                        .getElementById("userName")
                        .textContent =
                        "Logged in as: " +
                        (user.displayName || user.email);


                    await loadPlayerData(user);

                }

                else {

                    currentUser = null;


                    document
                        .getElementById("loginScreen")
                        .style.display = "block";


                    document
                        .getElementById("gameScreen")
                        .style.display = "none";

                }

            }
        );


        // =====================================
        // LOAD PLAYER DATA
        // =====================================

        async function loadPlayerData(user) {

            try {

                const playerRef =
                    doc(
                        db,
                        "players",
                        user.uid
                    );


                const playerSnap =
                    await getDoc(playerRef);


                if (playerSnap.exists()) {

                    const data =
                        playerSnap.data();


                    money =
                        Number(data.money ?? 50);


                    collection = [];


                    const savedCollection =
                        data.collection ?? [];


                    for (
                        let cardName
                        of savedCollection
                    ) {

                        const card =
                            cards.find(
                                c =>
                                c.name === cardName
                            );


                        if (card) {

                            collection.push(card);

                        }

                    }

                }

                else {

                    money = 50;

                    collection = [];


                    await savePlayerData(user);

                }


                updateCoins();

                showPackScreen();

            }

            catch (error) {

                console.error(
                    "LOAD ERROR:",
                    error
                );

                document
                    .getElementById("message")
                    .textContent =
                    "Could not load your save.";

            }

        }


        // =====================================
        // SAVE PLAYER DATA
        // =====================================

        async function savePlayerData(user) {

            if (!user) return;


            const playerRef =
                doc(
                    db,
                    "players",
                    user.uid
                );


            await setDoc(
                playerRef,
                {

                    money: money,

                    collection:
                        collection.map(
                            card => card.name
                        )

                }
            );

        }


        // =====================================
        // UPDATE COINS
        // =====================================

        function updateCoins() {

            document
                .getElementById("coins")
                .textContent = money;

        }


        // =====================================
        // OPEN PACK
        // =====================================

        window.openPack = async function () {

            if (!currentUser) {

                return;

            }


            if (money < 10) {

                document
                    .getElementById("message")
                    .textContent =
                    "Not enough coins!";

                return;

            }


            money -= 10;


            updateCoins();


            document
                .getElementById("cards")
                .innerHTML = "";


            let pack = [];


            for (let i = 0; i < 3; i++) {

                const card =
                    getRandomCard();


                pack.push(card);


                collection.push(card);

            }


            document
                .getElementById("message")
                .textContent =
                "You got 3 cards!";


            for (let card of pack) {

                displayCard(
                    card,
                    document.getElementById("cards")
                );

            }


            // SAVE AFTER PACK OPEN
            try {

                await savePlayerData(
                    currentUser
                );

            }

            catch (error) {

                console.error(
                    "SAVE ERROR:",
                    error
                );

                document
                    .getElementById("message")
                    .textContent =
                    "Cards opened, but save failed.";

            }

        };


        // =====================================
        // DISPLAY CARD
        // =====================================

        function displayCard(
            card,
            container
        ) {

            const cardDiv =
                document.createElement("div");


            cardDiv.className =
                "card";


            const image =
                document.createElement("img");


            image.src =
                card.image;


            image.alt =
                card.name;


            const name =
                document.createElement("p");


            name.textContent =
                card.name;


            cardDiv.appendChild(image);

            cardDiv.appendChild(name);


            container.appendChild(
                cardDiv
            );

        }


        // =====================================
        // SHOW COLLECTION
        // =====================================

        window.showCollection =
            function () {

                document
                    .getElementById("packScreen")
                    .style.display = "none";


                document
                    .getElementById("dex")
                    .style.display = "none";


                document
                    .getElementById("collection")
                    .style.display = "block";


                document
                    .getElementById("search")
                    .value = "";


                renderCollection("");

            };


        // =====================================
        // RENDER COLLECTION
        // OFFICIAL CARD ORDER
        // =====================================

        function renderCollection(
            searchText
        ) {

            const container =
                document.getElementById(
                    "collectionCards"
                );


            container.innerHTML = "";


            const search =
                searchText
                    .toLowerCase()
                    .trim();


            let found = false;


            // Uses official card order
            for (
                let card of cards
            ) {

                const owned =
                    collection.includes(
                        card
                    );


                if (!owned) {

                    continue;

                }


                if (
                    search &&
                    !card.name
                        .toLowerCase()
                        .includes(search)
                ) {

                    continue;

                }


                found = true;


                displayCard(
                    card,
                    container
                );

            }


            if (!found) {

                const message =
                    document.createElement(
                        "p"
                    );


                if (search) {

                    message.textContent =
                        "No cards found.";

                }

                else {

                    message.textContent =
                        "You don't have any cards yet! Open a pack first.";

                }


                container.appendChild(
                    message
                );

            }

        }


        // =====================================
        // SEARCH COLLECTION
        // =====================================

        window.searchCollection =
            function () {

                const search =
                    document.getElementById(
                        "search"
                    ).value;


                renderCollection(
                    search
                );

            };


        // =====================================
        // SHOW DEX
        // =====================================

        window.showDex =
            function () {

                document
                    .getElementById("packScreen")
                    .style.display = "none";


                document
                    .getElementById("collection")
                    .style.display = "none";


                document
                    .getElementById("dex")
                    .style.display = "block";


                showDollsDex();

            };


        // =====================================
        // DOLLS DEX
        // =====================================

        window.showDollsDex =
            function () {

                const container =
                    document.getElementById(
                        "dexCards"
                    );


                container.innerHTML = "";


                for (
                    let i = 0;
                    i < dexDolls.length;
                    i++
                ) {

                    const card =
                        dexDolls[i];


                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "dexCard";


                    if (
                        card.name ===
                        "Coming Soon"
                    ) {

                        const coming =
                            document.createElement(
                                "div"
                            );


                        coming.className =
                            "comingSoon";


                        coming.textContent =
                            "Coming Soon";


                        div.appendChild(
                            coming
                        );

                    }

                    else {

                        const image =
                            document.createElement(
                                "img"
                            );


                        image.src =
                            card.image;


                        image.alt =
                            card.name;


                        const name =
                            document.createElement(
                                "p"
                            );


                        name.textContent =
                            card.name;


                        div.appendChild(
                            image
                        );


                        div.appendChild(
                            name
                        );

                    }


                    container.appendChild(
                        div
                    );

                }

            };


        // =====================================
        // RARES DEX
        // =====================================

        window.showRaresDex =
            function () {

                const container =
                    document.getElementById(
                        "dexCards"
                    );


                container.innerHTML = "";


                for (
                    let card of dexRares
                ) {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "dexCard";


                    const coming =
                        document.createElement(
                            "div"
                        );


                    coming.className =
                        "comingSoon";


                    coming.textContent =
                        "Coming Soon";


                    div.appendChild(
                        coming
                    );


                    container.appendChild(
                        div
                    );

                }

            };


        // =====================================
        // BACK TO PACKS
        // =====================================

        window.backToPacks =
            function () {

                showPackScreen();

            };


        // =====================================
        // SHOW PACK SCREEN
        // =====================================

        function showPackScreen() {

            document
                .getElementById("collection")
                .style.display = "none";


            document
                .getElementById("dex")
                .style.display = "none";


            document
                .getElementById("packScreen")
                .style.display = "block";


            updateCoins();

        }

    </script>

</body>
</html>
