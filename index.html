<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Battle Arena</title>
  <style>
    :root {
      --bg: #121216;
      --panel: #1e1e24;
      --accent: #ffcb05;
      --accent-blue: #3b4cca;
      --text: #ffffff;
      --text-dim: #a0a0b0;
      --danger: #e74c3c;
      --success: #2ecc71;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }

    .app-container { width: 100%; max-width: 800px; background: var(--panel); border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2a2a35; padding-bottom: 15px; margin-bottom: 20px; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-blue); display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .coins { background: #2a2a35; padding: 6px 12px; border-radius: 20px; color: var(--accent); font-weight: bold; }

    /* Battle Select Screen */
    .section-title { margin-bottom: 15px; font-size: 1.2rem; color: var(--accent); }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
    
    .card-item { background: #2a2a35; border: 2px solid transparent; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .card-item:hover { transform: translateY(-2px); }
    .card-item.selected { border-color: var(--accent); background: #353545; }
    
    .card-type { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-top: 4px; }
    .type-Fire { color: #ff6b6b; }
    .type-Water { color: #4dabf7; }
    .type-Grass { color: #51cf66; }

    .btn { background: var(--accent); color: #000; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; transition: opacity 0.2s; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:hover:not(:disabled) { opacity: 0.9; }

    /* Battle Arena Screen */
    .hidden { display: none !important; }
    .battle-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #18181f; padding: 15px; border-radius: 8px; }
    .combatant { text-align: center; flex: 1; }
    .vs { font-size: 1.5rem; font-weight: 900; color: var(--danger); font-style: italic; }

    .hp-bar-container { background: #333; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 6px; }
    .hp-bar-fill { background: var(--success); height: 100%; width: 100%; transition: width 0.3s ease; }

    .battle-move { background: #252530; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; border-left: 4px solid var(--accent); }
    .move-name { font-size: 1.1rem; font-weight: bold; }
    .move-type { font-size: 0.85rem; color: var(--text-dim); }

    .battle-log { background: #121216; padding: 12px; border-radius: 6px; min-height: 80px; font-size: 0.9rem; line-height: 1.4; color: var(--text-dim); margin-bottom: 15px; }

    .win-text { font-size: 1.8rem; font-weight: bold; text-align: center; margin-bottom: 5px; }
    .reward-text { text-align: center; color: var(--accent); font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <div class="header">
    <div class="user-info">
      <div class="avatar" id="userAvatar">P</div>
      <span id="userNameDisplay">Player 1</span>
    </div>
    <div class="coins">🪙 <span id="coinDisplay">100</span></div>
  </div>

  <!-- Screen 1: Card Selection -->
  <div id="battleSetupScreen">
    <div class="section-title">Select Your Card for Battle</div>
    <div class="card-grid" id="cardChoiceGrid"></div>
    <button id="confirmCardBtn" class="btn" disabled onclick="confirmBattleCard()">CONFIRM CARD</button>
  </div>

  <!-- Screen 2: Interactive Battle Arena -->
  <div id="battleArena" class="hidden"></div>
</div>

<script>
  // --- DATABASE & STATE ---
  const CARD_DATABASE = [
    { name: "Charmander", type: "Fire", move: "Ember", power: 25 },
    { name: "Squirtle", type: "Water", move: "Water Gun", power: 25 },
    { name: "Bulbasaur", type: "Grass", move: "Vine Whip", power: 25 }
  ];

  const BATTLE_HP = 100;
  const BATTLE_WIN_REWARD = 50;

  let playerCollection = [
    { id: 1, name: "Charmander" },
    { id: 2, name: "Squirtle" },
    { id: 3, name: "Bulbasaur" }
  ];

  let money = 100;
  let username = "Trainer";
  let profilePic = "T";

  let battleSelectedCardId = null;
  let battleOpponentUsername = "Bot Trainer";
  let battleOpponentPic = "B";
  let battleRewardGiven = false;

  // --- HELPER FUNCTIONS ---
  function getCard(name) {
    return CARD_DATABASE.find(c => c.name === name);
  }

  function getBattleCardById(id) {
    return playerCollection.find(c => c.id === id);
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function getUniqueCollectionCards() {
    const seen = new Set();
    const result = [];
    for (const copy of playerCollection) {
      if (seen.has(copy.name)) continue;
      const card = getCard(copy.name);
      if (!card) continue;
      seen.add(copy.name);
      result.push(copy);
    }
    return result;
  }

  function calculateBattleDamage(attacker, defender) {
    let multiplier = 1.0;
    let effectiveness = "normal";

    if (attacker.type === "Fire" && defender.type === "Grass") { multiplier = 1.5; effectiveness = "super"; }
    else if (attacker.type === "Water" && defender.type === "Fire") { multiplier = 1.5; effectiveness = "super"; }
    else if (attacker.type === "Grass" && defender.type === "Water") { multiplier = 1.5; effectiveness = "super"; }
    else if (attacker.type === "Fire" && defender.type === "Water") { multiplier = 0.7; effectiveness = "weak"; }
    else if (attacker.type === "Water" && defender.type === "Grass") { multiplier = 0.7; effectiveness = "weak"; }
    else if (attacker.type === "Grass" && defender.type === "Fire") { multiplier = 0.7; effectiveness = "weak"; }

    const damage = Math.round(attacker.power * multiplier);
    return { damage, effectiveness };
  }

  function battleEffectivenessText(eff) {
    if (eff === "super") return "<span style='color:#2ecc71;'>It's super effective!</span>";
    if (eff === "weak") return "<span style='color:#e74c3c;'>It's not very effective...</span>";
    return "";
  }

  // --- RENDERING CARD SELECTION ---
  function renderBattleChoice() {
    const grid = document.getElementById("cardChoiceGrid");
    grid.innerHTML = "";
    const available = getUniqueCollectionCards();

    available.forEach(copy => {
      const card = getCard(copy.name);
      const div = document.createElement("div");
      div.className = "card-item" + (battleSelectedCardId === copy.id ? " selected" : "");
      
      div.onclick = () => {
        battleSelectedCardId = copy.id;
        document.getElementById("confirmCardBtn").disabled = false;
        renderBattleChoice();
      };

      div.innerHTML = `
        <div style="font-weight:bold;">${escapeHtml(card.name)}</div>
        <div class="card-type type-${card.type}">${card.type}</div>
        <div style="font-size:0.75rem; color:#888; margin-top:5px;">Power: ${card.power}</div>
      `;
      grid.appendChild(div);
    });
  }

  function confirmBattleCard() {
    if (!battleSelectedCardId) return;
    document.getElementById("battleSetupScreen").classList.add("hidden");
    startBotBattleArena();
  }

  // --- INTERACTIVE BATTLE ARENA ---
  function startBotBattleArena() {
    battleRewardGiven = false;
    const pCopy = getBattleCardById(battleSelectedCardId);
    if (!pCopy) return;
    
    const pCard = getCard(pCopy.name);
    
    // Choose opponent card
    const randomOpponentCard = CARD_DATABASE[Math.floor(Math.random() * CARD_DATABASE.length)];
    const oCard = randomOpponentCard;

    let pHp = BATTLE_HP;
    let oHp = BATTLE_HP;

    const arena = document.getElementById("battleArena");
    arena.classList.remove("hidden");

    function renderCardHTML(card, hp, name, pic) {
      const hpPercent = Math.max(0, (hp / BATTLE_HP) * 100);
      return `
        <div class="combatant">
          <div class="avatar" style="margin: 0 auto 6px auto;">${pic}</div>
          <div style="font-weight:bold; font-size:0.9rem;">${escapeHtml(name)}</div>
          <div style="color:var(--accent); font-size:0.85rem;">${escapeHtml(card.name)}</div>
          <div class="hp-bar-container">
            <div class="hp-bar-fill" style="width: ${hpPercent}%;"></div>
          </div>
          <div style="font-size:0.75rem; margin-top:3px;">${hp} / ${BATTLE_HP} HP</div>
        </div>
      `;
    }

    function renderArenaState(logText = "Press ATTACK to perform your turn!") {
      arena.innerHTML = `
        <div class="battle-header">
          ${renderCardHTML(pCard, pHp, username, profilePic)}
          <div class="vs">VS</div>
          ${renderCardHTML(oCard, oHp, battleOpponentUsername, battleOpponentPic)}
        </div>
        <div class="battle-move">
          <div class="move-name">${escapeHtml(pCard.move)}</div>
          <div class="move-type">${pCard.moveType || pCard.type} Move (Power: ${pCard.power})</div>
        </div>
        <div class="battle-log">${logText}</div>
        <div>
          ${pHp > 0 && oHp > 0 
            ? `<button id="attackBtn" class="btn">ATTACK WITH ${escapeHtml(pCard.move).toUpperCase()}</button>`
            : `
               <div class="win-text" style="color:${pHp >= oHp ? "var(--success)" : "var(--danger)"}">
                 ${pHp >= oHp ? "YOU WIN!" : "YOU LOSE!"}
               </div>
               ${pHp >= oHp ? `<div class="reward-text">+${BATTLE_WIN_REWARD} Coins Earned!</div>` : ""}
               <button class="btn" onclick="resetBattle()">FINISH BATTLE</button>
              `
          }
        </div>
      `;

      const attackBtn = document.getElementById("attackBtn");
      if (attackBtn) {
        attackBtn.onclick = () => executeTurn();
      }
    }

    function executeTurn() {
      const pDmg = calculateBattleDamage(pCard, oCard);
      const oDmg = calculateBattleDamage(oCard, pCard);

      oHp = Math.max(0, oHp - pDmg.damage);
      pHp = Math.max(0, pHp - oDmg.damage);

      const win = pHp >= oHp;
      if ((pHp <= 0 || oHp <= 0) && win && !battleRewardGiven) {
        money += BATTLE_WIN_REWARD;
        battleRewardGiven = true;
        document.getElementById("coinDisplay").textContent = money;
      }

      const log = `You used <b>${escapeHtml(pCard.move)}</b> and dealt <b>${pDmg.damage}</b> damage! ${battleEffectivenessText(pDmg.effectiveness)}<br>` +
                  `${battleOpponentUsername} used <b>${escapeHtml(oCard.move)}</b> and dealt <b>${oDmg.damage}</b> damage! ${battleEffectivenessText(oDmg.effectiveness)}`;

      renderArenaState(log);
    }

    renderArenaState();
  }

  function resetBattle() {
    battleSelectedCardId = null;
    document.getElementById("confirmCardBtn").disabled = true;
    document.getElementById("battleArena").classList.add("hidden");
    document.getElementById("battleSetupScreen").classList.remove("hidden");
    renderBattleChoice();
  }

  // --- INITIALIZATION ---
  renderBattleChoice();
</script>

</body>
</html>
