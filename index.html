<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doll Ball Collector Cards</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #071525;
    color: white;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.loginBox {
    background: #10243d;
    padding: 35px;
    border-radius: 20px;
    width: min(90%, 420px);
}

.loginBox h1 {
    margin-top: 0;
}

.googleButton {
    background: white;
    color: #222;
    width: 100%;
    font-size: 16px;
}

/* GAME */

#gameScreen {
    min-height: 100vh;
}

.topBar {
    background: #10243d;
    padding: 10px;
    display: flex;
    gap: 7px;
    overflow-x: auto;
    align-items: center;
}

.topBar button {
    background: #183653;
    color: white;
    white-space: nowrap;
}

.topBar button:hover {
    background: #234b70;
}

.moneyBox {
    margin-left: auto;
    background: #183653;
    padding: 10px 14px;
    border-radius: 10px;
    white-space: nowrap;
}

.page {
    padding: 20px;
    max-width: 1200px;
    margin: auto;
}

h1, h2, h3 {
    margin-top: 0;
}

/* HOME */

.homeBox {
    background: #10243d;
    padding: 25px;
    border-radius: 18px;
}

.username {
    font-size: 20px;
    font-weight: bold;
}

/* PACK */

.packButton {
    background: #2674d9;
    color: white;
    font-size: 18px;
    margin-top: 15px;
}

/* TABS */

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}

.tabs button {
    background: #183653;
    color: white;
}

.tabs button.active {
    background: #2674d9;
}

/* SEARCH */

.searchBox {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    margin-bottom: 20px;
    font-size: 16px;
}

/* CARDS */

.cardGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 18px;
}

.card {
    background: #10243d;
    border-radius: 15px;
    padding: 10px;
    position: relative;
    text-align: center;
    border: 3px solid transparent;
}

.card img {
    width: 100%;
    aspect-ratio: 1 / 1.35;
    object-fit: contain;
    border-radius: 10px;
    background: #091a2d;
}

.cardName {
    font-weight: bold;
    margin-top: 8px;
}

.cardCount {
    position: absolute;
    top: 7px;
    right: 7px;
    background: #2674d9;
    min-width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.starButton {
    position: absolute;
    top: 7px;
    left: 7px;
    width: 31px;
    height: 31px;
    padding: 0;
    border-radius: 50%;
    background: #172b43;
    color: white;
    font-size: 17px;
    z-index: 10;
}

.starButton.favorite {
    color: #36b9ff;
}

.favoriteCard {
    border: 4px solid #36b9ff;
    box-shadow:
        0 0 0 2px #8ee0ff,
        0 0 12px #36b9ff;
}

.tradedFavoriteCard {
    border: 4px solid #36b9ff;
    box-shadow:
        0 0 0 2px #8ee0ff,
        0 0 8px #36b9ff,
        0 0 18px white;
}

.tradedFavoriteCard::before {
    content: "✦ ✧ ✦";
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    color: #36b9ff;
    font-size: 17px;
    white-space: nowrap;
    z-index: 102;
}

.rareFavoriteCard {
    border: 4px solid gold;
    box-shadow:
        0 0 0 2px #fff0a3,
        0 0 10px gold,
        0 0 22px #ffd700;
}

.rareTradedFavoriteCard {
    border: 4px solid gold;
    box-shadow:
        0 0 0 2px #fff0a3,
        0 0 10px gold,
        0 0 22px #ffd700,
        0 0 32px white;
}

.rareTradedFavoriteCard::before {
    content: "✦ ◆ ✧ ◆ ✦";
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    color: gold;
    font-size: 17px;
    white-space: nowrap;
    z-index: 102;
}

/* SELL */

.sellButton {
    width: 100%;
    margin-top: 8px;
    background: #176f46;
    color: white;
}

.sellButton.favoriteLocked {
    background: #555;
}

/* DEX */

.dexCard {
    background: #10243d;
    border-radius: 15px;
    padding: 10px;
    text-align: center;
}

.dexCard img {
    width: 100%;
    aspect-ratio: 1 / 1.35;
    object-fit: contain;
    background: #091a2d;
    border-radius: 10px;
}

.comingSoon {
    opacity: 0.5;
}

/* TRADE */

.tradeNotice {
    background: #10243d;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 18px;
}

.tradeSearchArea {
    display: flex;
    gap: 8px;
}

.tradeSearchArea input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.tradeSearchButton {
    background: #2674d9;
    color: white;
}

.tradePlayerResult {
    margin-top: 15px;
}

.tradeRequest {
    background: #183653;
    padding: 15px;
    border-radius: 12px;
    margin-top: 10px;
}

.tradeArea {
    background: #10243d;
    padding: 18px;
    border-radius: 18px;
    margin-top: 20px;
}

.tradeColumns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.tradeSide {
    background: #091a2d;
    padding: 15px;
    border-radius: 15px;
}

.tradeSide h3 {
    text-align: center;
}

.tradeCardGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.tradeCard {
    background: #10243d;
    border-radius: 10px;
    padding: 7px;
    text-align: center;
    border: 2px solid transparent;
    cursor: pointer;
}

.tradeCard.selected {
    border-color: #36b9ff;
    box-shadow: 0 0 10px #36b9ff;
}

.tradeCard img {
    width: 100%;
    aspect-ratio: 1 / 1.25;
    object-fit: contain;
}

.tradeStatus {
    text-align: center;
    margin: 15px 0;
    font-size: 18px;
    font-weight: bold;
}

.confirmButton {
    background: #198754;
    color: white;
    width: 100%;
}

.cancelButton {
    background: #9b2929;
    color: white;
    width: 100%;
    margin-top: 8px;
}

.changeOfferButton {
    background: #2674d9;
    color: white;
    width: 100%;
    margin-top: 8px;
}

/* SETTINGS */

.settingsOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
}

.settingsBox {
    background: #10243d;
    padding: 25px;
    width: min(90%, 450px);
    border-radius: 20px;
}

.settingsButton {
    width: 100%;
    background: #183653;
    color: white;
    margin-top: 10px;
}

.resetButton {
    background: #8d2525;
}

.logoutButton {
    background: #c62828 !important;
}

/* MESSAGE */

#message {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #183653;
    padding: 13px 18px;
    border-radius: 12px;
    z-index: 2000;
    display: none;
    text-align: center;
}

@media (max-width: 650px) {
    .tradeColumns {
        grid-template-columns: 1fr;
    }

    .topBar {
        flex-wrap: nowrap;
    }

    .moneyBox {
        margin-left: 0;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">
    <div class="loginBox">
        <h1>Doll Ball Collector Cards</h1>
        <p>Log in to play.</p>
        <button class="googleButton" onclick="loginGoogle()">
            Sign in with Google
        </button>
    </div>
</div>


<!-- GAME -->

<div id="gameScreen" class="hidden">

    <div class="topBar">
        <button onclick="showPage('home')">HOME</button>
        <button onclick="showPage('collection')">COLLECTION</button>
        <button onclick="showPage('dex')">DEX</button>
        <button onclick="showPage('trade')">TRADE</button>
        <button onclick="openSettings()">SETTINGS</button>
        <button class="logoutButton" onclick="logout()">LOG OUT</button>

        <div class="moneyBox">
            Coins: <span id="money">0</span>
        </div>
    </div>


    <!-- HOME -->

    <div id="homePage" class="page">

        <div class="homeBox">
            <h1>Welcome!</h1>

            <p>
                Google Account:
                <span id="accountEmail"></span>
            </p>

            <p>
                Username:
                <span class="username" id="usernameDisplay"></span>
            </p>

            <hr>

            <h2>Open a Pack</h2>

            <p>
                Cost: 10 coins<br>
                Cards: 3
            </p>

            <button class="packButton" onclick="openPack()">
                OPEN PACK
            </button>
        </div>

    </div>


    <!-- COLLECTION -->

    <div id="collectionPage" class="page hidden">

        <h1>Collection</h1>

        <div class="tabs">
            <button id="collectionAllButton"
                    class="active"
                    onclick="setCollectionTab('all')">
                ALL
            </button>

            <button id="collectionFavoritesButton"
                    onclick="setCollectionTab('favorites')">
                FAVORITES
            </button>
        </div>

        <input
            id="collectionSearch"
            class="searchBox"
            placeholder="Search cards..."
            oninput="renderCollection()"
        >

        <div id="collectionGrid" class="cardGrid"></div>

    </div>


    <!-- DEX -->

    <div id="dexPage" class="page hidden">

        <h1>DEX</h1>

        <div class="tabs">
            <button id="dexDollsButton"
                    class="active"
                    onclick="setDexTab('dolls')">
                DOLLS
            </button>

            <button id="dexRaresButton"
                    onclick="setDexTab('rares')">
                RARES
            </button>
        </div>

        <div id="dexGrid" class="cardGrid"></div>

    </div>


    <!-- TRADE -->

    <div id="tradePage" class="page hidden">

        <h1>Trading</h1>

        <div id="tradeSearchBox">

            <div class="tradeNotice">
                <b>Find a player</b>
                <p>
                    Search using their username.
                </p>

                <div class="tradeSearchArea">
                    <input
                        id="tradePlayerInput"
                        placeholder="Username"
                    >

                    <button
                        class="tradeSearchButton"
                        onclick="findPlayer()">
                        SEARCH
                    </button>
                </div>

                <div id="tradePlayerResult"
                     class="tradePlayerResult">
                </div>
            </div>

        </div>

        <div id="incomingTrades"></div>

        <div id="activeTrade"></div>

    </div>

</div>


<!-- SETTINGS -->

<div id="settingsOverlay"
     class="settingsOverlay hidden">

    <div class="settingsBox">

        <h2>Settings</h2>

        <p>
            Username:
            <b id="settingsUsername"></b>
        </p>

        <button
            class="settingsButton resetButton"
            onclick="resetAccount()">
            RESET ACCOUNT
        </button>

        <button
            class="settingsButton"
            onclick="closeSettings()">
            CLOSE
        </button>

    </div>

</div>


<div id="message"></div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    deleteDoc,
    onSnapshot,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {
    apiKey: "AIzaSyC-6paRzUxBv6DhZ5Vx_c8BG8vxcKe9xYw",
    authDomain: "dbcc-login.firebaseapp.com",
    databaseURL: "https://dbcc-login-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dbcc-login",
    storageBucket: "dbcc-login.firebasestorage.app",
    messagingSenderId: "878902780767",
    appId: "1:878902780767:web:4020d11730e5d9c0ee0cea",
    measurementId: "G-PT9S1K4E2K"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* CARDS */

const cards = [

    {
        name: "Baby Pickels",
        image: "baby pikels.png",
        weight: 14,
        price: 5,
        rarity: "doll"
    },

    {
        name: "Mr. Pickels",
        image: "mr. pickels.png",
        weight: 9,
        price: 7,
        rarity: "doll"
    },

    {
        name: "Wily",
        image: "wily.png",
        weight: 14,
        price: 5,
        rarity: "doll"
    },

    {
        name: "Will",
        image: "will.png",
        weight: 9,
        price: 7,
        rarity: "doll"
    },

    {
        name: "Waffle",
        image: "waffle.png",
        weight: 14,
        price: 5,
        rarity: "doll"
    },

    {
        name: "Cute Cake",
        image: "cute cake.png",
        weight: 9,
        price: 7,
        rarity: "doll"
    },

    {
        name: "Buttyr",
        image: "buttyr.png",
        weight: 20,
        price: 7,
        rarity: "doll"
    },

    {
        name: "Blossem",
        image: "blossem.png",
        weight: 20,
        price: 7,
        rarity: "doll"
    },

    {
        name: "Buzzy",
        image: "buzzy.png",
        weight: 5,
        price: 12,
        rarity: "doll"
    },

    {
        name: "Nico",
        image: "nico.png",
        weight: 20,
        price: 3,
        rarity: "doll"
    },

    {
        name: "Choper",
        image: "choper.png",
        weight: 10,
        price: 5,
        rarity: "doll"
    },

    {
        name: "Bullet",
        image: "bullet.png",
        weight: 10,
        price: 5,
        rarity: "doll"
    }

];


/* STATE */

let currentUser = null;

let money = 50;

let username = "";

let collection = [];

let favorites = [];

let collectionTab = "all";

let dexTab = "dolls";

let activeTrade = null;

let tradeListener = null;

let incomingTradeListeners = [];

let applyingTradeIds = new Set();


/* HELPERS */

function createCardId() {

    return Date.now().toString(36)
        + Math.random().toString(36).slice(2);

}


function createCardCopy(name, traded = false) {

    return {
        id: createCardId(),
        name: name,
        traded: traded
    };

}


function getCard(name) {

    return cards.find(card => card.name === name);

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function showMessage(text) {

    const el = document.getElementById("message");

    el.textContent = text;

    el.style.display = "block";

    setTimeout(() => {
        el.style.display = "none";
    }, 2500);

}


/* AUTH */

window.loginGoogle = async function() {

    try {

        const provider = new GoogleAuthProvider();

        await signInWithPopup(auth, provider);

    } catch (error) {

        console.error(error);

        showMessage(error.message);

    }

};


window.logout = async function() {

    try {

        await signOut(auth);

    } catch (error) {

        console.error(error);

    }

};


/* USERNAME */

async function askForUsername() {

    while (!username) {

        let chosen = prompt(
            "Choose your unique username:"
        );

        if (chosen === null) {
            chosen = "";
        }

        chosen = chosen.trim();

        if (chosen.length < 3) {

            alert(
                "Username must be at least 3 characters."
            );

            continue;

        }

        if (chosen.length > 20) {

            alert(
                "Username must be 20 characters or less."
            );

            continue;

        }

        if (!/^[a-zA-Z0-9_]+$/.test(chosen)) {

            alert(
                "Only letters, numbers and _ are allowed."
            );

            continue;

        }

        const normalized = chosen.toLowerCase();

        const usernameRef =
            doc(db, "usernames", normalized);

        const usernameSnap =
            await getDoc(usernameRef);

        if (
            usernameSnap.exists() &&
            usernameSnap.data().uid !== currentUser.uid
        ) {

            alert("That username is already taken.");

            continue;

        }

        await setDoc(
            usernameRef,
            {
                uid: currentUser.uid,
                username: chosen
            }
        );

        username = chosen;

        break;

    }

}


async function ensureUsernameDocument() {

    if (!currentUser || !username) {
        return;
    }

    await setDoc(
        doc(
            db,
            "usernames",
            username.toLowerCase()
        ),
        {
            uid: currentUser.uid,
            username: username
        },
        {
            merge: true
        }
    );

}


/* PLAYER DATA */

function normalizeCollection(data) {

    if (!Array.isArray(data)) {
        return [];
    }

    return data.map(item => {

        if (typeof item === "string") {

            return createCardCopy(item);

        }

        return {
            id: item.id || createCardId(),
            name: item.name,
            traded: item.traded === true
        };

    });

}


async function loadPlayerData() {

    const ref =
        doc(db, "players", currentUser.uid);

    const snap =
        await getDoc(ref);

    if (!snap.exists()) {

        money = 50;

        collection = [];

        favorites = [];

        username = "";

        await setDoc(ref, {
            money: money,
            collection: collection,
            favorites: favorites,
            username: ""
        });

    } else {

        const data = snap.data();

        money =
            typeof data.money === "number"
                ? data.money
                : 50;

        collection =
            normalizeCollection(data.collection);

        favorites =
            Array.isArray(data.favorites)
                ? data.favorites
                : [];

        username =
            data.username || "";

    }

    if (!username) {

        await askForUsername();

    }

    await ensureUsernameDocument();

    await savePlayerData();

}


async function savePlayerData() {

    if (!currentUser) {
        return;
    }

    await setDoc(
        doc(db, "players", currentUser.uid),
        {
            money: money,
            collection: collection,
            favorites: favorites,
            username: username
        },
        {
            merge: true
        }
    );

}


/* AUTH STATE */

onAuthStateChanged(auth, async user => {

    if (!user) {

        currentUser = null;

        document
            .getElementById("loginScreen")
            .classList.remove("hidden");

        document
            .getElementById("gameScreen")
            .classList.add("hidden");

        return;

    }

    currentUser = user;

    try {

        await loadPlayerData();

        document
            .getElementById("loginScreen")
            .classList.add("hidden");

        document
            .getElementById("gameScreen")
            .classList.remove("hidden");

        document
            .getElementById("accountEmail")
            .textContent = user.email || "";

        updateUI();

        startTradeListeners();

    } catch (error) {

        console.error(error);

        alert(
            "Could not load your account:\n" +
            error.message
        );

    }

});


/* UI */

function updateUI() {

    document
        .getElementById("money")
        .textContent = money;

    document
        .getElementById("usernameDisplay")
        .textContent = username;

    document
        .getElementById("settingsUsername")
        .textContent = username;

    renderCollection();

    renderDex();

}


window.showPage = function(page) {

    document
        .querySelectorAll(".page")
        .forEach(el => el.classList.add("hidden"));

    const target =
        document.getElementById(page + "Page");

    if (target) {
        target.classList.remove("hidden");
    }

    if (page === "collection") {
        renderCollection();
    }

    if (page === "dex") {
        renderDex();
    }

    if (page === "trade") {
        renderIncomingTrades();
        renderActiveTrade();
    }

};


/* PACK */

function weightedRandomCard() {

    const totalWeight =
        cards.reduce(
            (sum, card) => sum + card.weight,
            0
        );

    let random =
        Math.random() * totalWeight;

    for (const card of cards) {

        random -= card.weight;

        if (random <= 0) {
            return card;
        }

    }

    return cards[cards.length - 1];

}


window.openPack = async function() {

    if (money < 10) {

        showMessage("Not enough coins.");

        return;

    }

    money -= 10;

    const newCards = [];

    for (let i = 0; i < 3; i++) {

        const card = weightedRandomCard();

        const copy = createCardCopy(card.name);

        collection.push(copy);

        newCards.push(card.name);

    }

    await savePlayerData();

    updateUI();

    alert(
        "You got:\n\n" +
        newCards.join("\n")
    );

};


/* COLLECTION */

window.setCollectionTab = function(tab) {

    collectionTab = tab;

    document
        .getElementById("collectionAllButton")
        .classList.toggle(
            "active",
            tab === "all"
        );

    document
        .getElementById("collectionFavoritesButton")
        .classList.toggle(
            "active",
            tab === "favorites"
        );

    renderCollection();

};


function getCollectionCounts() {

    const counts = {};

    for (const copy of collection) {

        counts[copy.name] =
            (counts[copy.name] || 0) + 1;

    }

    return counts;

}


function getFirstCopy(name) {

    return collection.find(
        copy => copy.name === name
    );

}


function renderCollection() {

    const grid =
        document.getElementById("collectionGrid");

    if (!grid) {
        return;
    }

    const search =
        (
            document
                .getElementById("collectionSearch")
                ?.value || ""
        )
        .toLowerCase();

    const counts =
        getCollectionCounts();

    let names = cards
        .filter(card => counts[card.name])
        .map(card => card.name);

    if (collectionTab === "favorites") {

        names =
            names.filter(
                name => favorites.includes(name)
            );

    }

    if (search) {

        names =
            names.filter(
                name =>
                    name.toLowerCase()
                        .includes(search)
            );

    }

    grid.innerHTML = "";

    if (names.length === 0) {

        grid.innerHTML =
            "<p>You don't have any cards here.</p>";

        return;

    }

    for (const name of names) {

        const card = getCard(name);

        const copy = getFirstCopy(name);

        const isFavorite =
            favorites.includes(name);

        const traded =
            copy?.traded === true;

        let borderClass = "";

        if (isFavorite && traded) {

            borderClass =
                card.rarity === "rare"
                    ? "rareTradedFavoriteCard"
                    : "tradedFavoriteCard";

        } else if (isFavorite) {

            borderClass =
                card.rarity === "rare"
                    ? "rareFavoriteCard"
                    : "favoriteCard";

        }

        const div =
            document.createElement("div");

        div.className =
            "card " + borderClass;

        div.innerHTML = `

            <button
                class="starButton ${isFavorite ? "favorite" : ""}"
                onclick="toggleFavorite('${escapeHtml(name)}')">
                ${isFavorite ? "★" : "☆"}
            </button>

            <div class="cardCount">
                ${counts[name]}
            </div>

            <img
                src="${escapeHtml(card.image)}"
                alt="${escapeHtml(name)}"
            >

            <div class="cardName">
                ${escapeHtml(name)}
            </div>

            <div>
                Sell: ${card.price}
            </div>

            <button
                class="sellButton ${isFavorite ? "favoriteLocked" : ""}"
                ${isFavorite ? "disabled" : ""}
                onclick="sellCard('${escapeHtml(name)}')">

                ${isFavorite ? "FAVORITED" : "SELL"}

            </button>
        `;

        grid.appendChild(div);

    }

}


window.toggleFavorite = async function(name) {

    if (favorites.includes(name)) {

        favorites =
            favorites.filter(
                item => item !== name
            );

        showMessage(
            name + " is no longer a favorite."
        );

    } else {

        favorites.push(name);

        showMessage(
            name + " is now a favorite!"
        );

    }

    await savePlayerData();

    updateUI();

};


window.sellCard = async function(name) {

    if (favorites.includes(name)) {

        showMessage(
            "Favorite cards cannot be sold."
        );

        return;

    }

    const index =
        collection.findIndex(
            copy => copy.name === name
        );

    if (index === -1) {
        return;
    }

    const card = getCard(name);

    collection.splice(index, 1);

    money += card.price;

    await savePlayerData();

    updateUI();

    showMessage(
        name + " sold for " + card.price + " coins."
    );

};

function listenToTrade(tradeId) {

    if (!tradeId) {
        return;
    }

    const unsubscribe =
        onSnapshot(
            doc(
                db,
                "tradeRequests",
                tradeId
            ),
            snap => {

                if (!snap.exists()) {
                    return;
                }

                const trade =
                    {
                        id: tradeId,
                        ...snap.data()
                    };

                if (
                    trade.senderUid ===
                    currentUser.uid
                    ||
                    trade.receiverUid ===
                    currentUser.uid
                ) {

                    activeTrade = trade;

                    renderIncomingTrades();

                    renderActiveTrade();

                    handleCompletedTrade(trade);

                }

            },
            error => {

                console.error(
                    "Trade listener error:",
                    error
                );

            }
        );

    incomingTradeListeners.push(
        unsubscribe
    );

}

/* SUBMIT OFFER */

window.submitTradeOffer = async function() {

    if (!activeTrade) {
        return;
    }

    if (
        activeTrade.status !==
        "pending"
    ) {
        return;
    }

    /*
       Make sure every selected card still exists.
    */

    const validCards =
        selectedTradeCards.filter(
            id =>
                collection.some(
                    copy => copy.id === id
                )
        );

    selectedTradeCards = validCards;

    const isSender =
        activeTrade.senderUid ===
        currentUser.uid;

    const fieldCards =
        isSender
            ? "senderCards"
            : "receiverCards";

    const fieldNames =
        isSender
            ? "senderCardNames"
            : "receiverCardNames";

    const fieldConfirmed =
        isSender
            ? "senderConfirmed"
            : "receiverConfirmed";

    const names =
        selectedTradeCards.map(id => {

            const copy =
                collection.find(
                    card => card.id === id
                );

            return copy
                ? copy.name
                : "";

        });

    try {

        await updateDoc(
            doc(
                db,
                "tradeRequests",
                activeTrade.id
            ),
            {

                [fieldCards]:
                    selectedTradeCards,

                [fieldNames]:
                    names,

                /*
                   IMPORTANT:
                   Changing an offer automatically
                   unconfirms BOTH players.
                */

                senderConfirmed: false,

                receiverConfirmed: false

            }
        );

        showMessage(
            "Offer updated. Both players must confirm again."
        );

    } catch (error) {

        console.error(error);

        showMessage(
            "Could not update offer."
        );

    }

};


/* CONFIRM */

window.confirmTrade = async function() {

    if (!activeTrade) {
        return;
    }

    if (
        activeTrade.status !==
        "pending"
    ) {
        return;
    }

    const isSender =
        activeTrade.senderUid ===
        currentUser.uid;

    const field =
        isSender
            ? "senderConfirmed"
            : "receiverConfirmed";

    try {

        /*
           Re-read the trade first so we don't confirm
           an old version of it.
        */

        const tradeSnap =
            await getDoc(
                doc(
                    db,
                    "tradeRequests",
                    activeTrade.id
                )
            );

        if (!tradeSnap.exists()) {
            return;
        }

        const fresh =
            tradeSnap.data();

        if (
            fresh.status !==
            "pending"
        ) {
            return;
        }

        await updateDoc(
            doc(
                db,
                "tradeRequests",
                activeTrade.id
            ),
            {
                [field]: true
            }
        );

        showMessage(
            "Confirmed. Waiting for the other player."
        );

    } catch (error) {

        console.error(error);

        showMessage(
            "Could not confirm trade."
        );

    }

};


/* COMPLETE TRADE */

async function handleCompletedTrade(trade) {

    if (
        trade.status !==
        "pending"
    ) {
        if (
            trade.status === "completed"
        ) {
            await applyCompletedTrade(trade);
        }

        return;
    }

    if (
        !trade.senderConfirmed ||
        !trade.receiverConfirmed
    ) {
        return;
    }

    /*
       Both sides confirmed the exact same offers.
       Mark the trade completed.

       Both clients then apply the transfer to their
       own player account.
    */

    try {

        await updateDoc(
            doc(
                db,
                "tradeRequests",
                trade.id
            ),
            {
                status: "completed",
                completedAt:
                    serverTimestamp()
            }
        );

    } catch (error) {

        /*
           Another client may have completed it first.
           That's okay.
        */

        console.error(
            "Completion update:",
            error
        );

    }

}


async function applyCompletedTrade(trade) {

    if (
        applyingTradeIds.has(trade.id)
    ) {
        return;
    }

    applyingTradeIds.add(trade.id);

    try {

        const isSender =
            trade.senderUid ===
            currentUser.uid;

        const myOffer =
            isSender
                ? trade.senderCards || []
                : trade.receiverCards || [];

        const theirOffer =
            isSender
                ? trade.receiverCards || []
                : trade.senderCards || [];

        /*
           Check whether we already applied it.
        */

        const playerRef =
            doc(
                db,
                "players",
                currentUser.uid
            );

        const playerSnap =
            await getDoc(playerRef);

        if (!playerSnap.exists()) {
            return;
        }

        const playerData =
            playerSnap.data();

        let currentCollection =
            normalizeCollection(
                playerData.collection
            );

        const alreadyHasIncoming =
            theirOffer.every(
                id =>
                    currentCollection.some(
                        card => card.id === id
                    )
            );

        const stillHasOutgoing =
            myOffer.some(
                id =>
                    currentCollection.some(
                        card => card.id === id
                    )
            );

        /*
           If incoming cards are already there and
           outgoing cards aren't, this trade was already
           applied.
        */

        if (
            alreadyHasIncoming &&
            !stillHasOutgoing
        ) {

            return;

        }

        /*
           Make sure we still own every card we promised.
        */

        const ownedOutgoing =
            myOffer.every(
                id =>
                    currentCollection.some(
                        card => card.id === id
                    )
            );

        if (!ownedOutgoing) {

            showMessage(
                "Trade failed: a card is missing."
            );

            return;

        }

        /*
           Remove exact physical copies.
        */

        currentCollection =
            currentCollection.filter(
                card =>
                    !myOffer.includes(
                        card.id
                    )
            );

        /*
           Add exact incoming physical copies.

           IMPORTANT:
           We preserve the traded property from the
           original card by using the trade's card data
           if available.
        */

        const incomingNames =
            isSender
                ? trade.receiverCardNames || []
                : trade.senderCardNames || [];

        const incomingIds =
            theirOffer;

        for (
            let i = 0;
            i < incomingIds.length;
            i++
        ) {

            const id =
                incomingIds[i];

            const name =
                incomingNames[i];

            if (!name) {
                continue;
            }

            /*
               A card that has been traded keeps
               traded:true after being traded again.
            */

            const incomingCard =
                createCardCopy(
                    name,
                    true
                );

            incomingCard.id = id;

            currentCollection.push(
                incomingCard
            );

            /*
               If the incoming card is favorited by
               the previous owner, preserve favorite
               protection by adding its name here.
            */

            if (
                !favorites.includes(name)
            ) {

                /*
                   We cannot safely know another player's
                   private favorites under basic rules,
                   so traded cards are not automatically
                   added here unless the trade explicitly
                   carries favorite information.
                */

            }

        }

        collection =
            currentCollection;

        /*
           Save the updated collection.
        */

        await setDoc(
            playerRef,
            {
                collection:
                    collection
            },
            {
                merge: true
            }
        );

        updateUI();

        showMessage(
            "Trade completed!"
        );

    } catch (error) {

        console.error(
            "Apply trade error:",
            error
        );

        showMessage(
            "Could not finish the trade."
        );

    } finally {

        setTimeout(() => {

            applyingTradeIds.delete(
                trade.id
            );

        }, 5000);

    }

}


/* CANCEL */

window.cancelTrade = async function(tradeId) {

    if (!tradeId) {
        return;
    }

    try {

        await updateDoc(
            doc(
                db,
                "tradeRequests",
                tradeId
            ),
            {
                status: "cancelled"
            }
        );

        activeTrade = null;

        selectedTradeCards = [];

        renderActiveTrade();

        showMessage(
            "Trade cancelled."
        );

    } catch (error) {

        console.error(error);

        showMessage(
            "Could not cancel trade."
        );

    }

};


/* SETTINGS */

window.openSettings = function() {

    document
        .getElementById("settingsOverlay")
        .classList.remove("hidden");

};


window.closeSettings = function() {

    document
        .getElementById("settingsOverlay")
        .classList.add("hidden");

};


/* RESET */

window.resetAccount = async function() {

    const yes =
        confirm(
            "Are you sure you want to reset your account? This deletes your coins and collection."
        );

    if (!yes) {
        return;
    }

    money = 50;

    collection = [];

    favorites = [];

    await savePlayerData();

    updateUI();

    closeSettings();

    showMessage(
        "Account reset."
    );

};
