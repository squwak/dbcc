<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doll Ball Collector Cards</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #071525;
    color: white;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.loginBox {
    background: #10243d;
    padding: 35px;
    border-radius: 20px;
    width: min(90%, 420px);
}

.loginBox h1 {
    margin-top: 0;
}

.googleButton {
    background: white;
    color: #222;
    width: 100%;
    font-size: 16px;
}

/* GAME */

#gameScreen {
    min-height: 100vh;
}

.topBar {
    background: #10243d;
    padding: 10px;
    display: flex;
    gap: 7px;
    overflow-x: auto;
    align-items: center;
}

.topBar button {
    background: #183653;
    color: white;
    white-space: nowrap;
}

.topBar button:hover {
    background: #234b70;
}

.moneyBox {
    background: #183653;
    padding: 10px 14px;
    border-radius: 10px;
    white-space: nowrap;
    order: -1;
}

.page {
    padding: 20px;
    max-width: 1200px;
    margin: auto;
}

h1, h2, h3 {
    margin-top: 0;
}

/* HOME */

.homeBox {
    background: #10243d;
    padding: 25px;
    border-radius: 18px;
}

.username {
    font-size: 20px;
    font-weight: bold;
}

/* PACK */

.packButton {
    background: #2674d9;
    color: white;
    font-size: 18px;
    margin-top: 15px;
}

/* TABS */

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}

.tabs button {
    background: #183653;
    color: white;
}

.tabs button.active {
    background: #2674d9;
}

/* SEARCH */

.searchBox {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    margin-bottom: 20px;
    font-size: 16px;
}

/* CARDS */

.cardGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 18px;
}

.card {
    background: #10243d;
    border-radius: 15px;
    padding: 10px;
    position: relative;
    text-align: center;
    border: 3px solid transparent;
}

.card img {
    width: 100%;
    aspect-ratio: 1 / 1.35;
    object-fit: contain;
    border-radius: 10px;
    background: #091a2d;
    cursor: pointer;
}

.cardName {
    font-weight: bold;
    margin-top: 8px;
}

.cardCount {
    position: absolute;
    top: 7px;
    right: 7px;
    background: #2674d9;
    min-width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.starButton {
    position: absolute;
    top: 7px;
    left: 7px;
    width: 31px;
    height: 31px;
    padding: 0;
    border-radius: 50%;
    background: #172b43;
    color: white;
    font-size: 17px;
    z-index: 10;
}

.starButton.favorite {
    color: #36b9ff;
}

.favoriteCard {
    border: 4px solid #36b9ff;
    box-shadow:
        0 0 0 2px #8ee0ff,
        0 0 12px #36b9ff;
}

.tradedFavoriteCard {
    border: 4px solid #36b9ff;
    box-shadow:
        0 0 0 2px #8ee0ff,
        0 0 8px #36b9ff,
        0 0 18px white;
}

.tradedFavoriteCard::before {
    content: "✦ ✧ ✦";
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    color: #36b9ff;
    font-size: 17px;
    white-space: nowrap;
    z-index: 102;
}

.rareFavoriteCard {
    border: 4px solid gold;
    box-shadow:
        0 0 0 2px #fff0a3,
        0 0 10px gold,
        0 0 22px #ffd700;
}

.rareTradedFavoriteCard {
    border: 4px solid gold;
    box-shadow:
        0 0 0 2px #fff0a3,
        0 0 10px gold,
        0 0 22px #ffd700,
        0 0 32px white;
}

.rareTradedFavoriteCard::before {
    content: "✦ ◆ ✧ ◆ ✦";
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    color: gold;
    font-size: 17px;
    white-space: nowrap;
    z-index: 102;
}

/* SELL */

.sellButton {
    width: 100%;
    margin-top: 8px;
    background: #176f46;
    color: white;
}

.sellButton.favoriteLocked {
    background: #555;
}

/* DEX */

.dexCard {
    background: #10243d;
    border-radius: 15px;
    padding: 10px;
    text-align: center;
}

.dexCard img {
    width: 100%;
    aspect-ratio: 1 / 1.35;
    object-fit: contain;
    background: #091a2d;
    border-radius: 10px;
    cursor: pointer;
}

.comingSoon {
    opacity: 0.5;
}

/* TRADE */

.tradeNotice {
    background: #10243d;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 18px;
}

.tradeSearchArea {
    display: flex;
    gap: 8px;
}

.tradeSearchArea input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.tradeSearchButton {
    background: #2674d9;
    color: white;
}

.tradePlayerResult {
    margin-top: 15px;
}

.tradeRequest {
    background: #183653;
    padding: 15px;
    border-radius: 12px;
    margin-top: 10px;
}

.tradeArea {
    background: #10243d;
    padding: 18px;
    border-radius: 18px;
    margin-top: 20px;
}

.tradeColumns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.tradeSide {
    background: #091a2d;
    padding: 15px;
    border-radius: 15px;
}

.tradeSide h3 {
    text-align: center;
}

.tradeCardGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.tradeCard {
    background: #10243d;
    border-radius: 10px;
    padding: 7px;
    text-align: center;
    border: 2px solid transparent;
    cursor: pointer;
}

.tradeCard.selected {
    border-color: #36b9ff;
    box-shadow: 0 0 10px #36b9ff;
}

.tradeCard img {
    width: 100%;
    aspect-ratio: 1 / 1.25;
    object-fit: contain;
}

.tradeStatus {
    text-align: center;
    margin: 15px 0;
    font-size: 18px;
    font-weight: bold;
}

.confirmButton {
    background: #198754;
    color: white;
    width: 100%;
}

.cancelButton {
    background: #9b2929;
    color: white;
    width: 100%;
    margin-top: 8px;
}

.changeOfferButton {
    background: #2674d9;
    color: white;
    width: 100%;
    margin-top: 8px;
}

/* SETTINGS */

.settingsOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
}

.settingsBox {
    background: #10243d;
    padding: 25px;
    width: min(90%, 450px);
    border-radius: 20px;
}

.settingsButton {
    width: 100%;
    background: #183653;
    color: white;
    margin-top: 10px;
}

.resetButton {
    background: #8d2525;
}

.logoutButton {
    background: #c62828 !important;
}

/* MESSAGE */

#message {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #183653;
    padding: 13px 18px;
    border-radius: 12px;
    z-index: 2000;
    display: none;
    text-align: center;
}

/* FULL SCREEN CARD VIEW */

.cardViewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.94);
    z-index: 5000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.cardViewerImage {
    max-width: 95vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 12px;
}

.cardViewerClose {
    position: fixed;
    top: 15px;
    right: 15px;
    background: #183653;
    color: white;
    font-size: 24px;
    width: 48px;
    height: 48px;
    padding: 0;
    z-index: 5001;
}

@media (max-width: 650px) {
    .tradeColumns {
        grid-template-columns: 1fr;
    }

    .topBar {
        flex-wrap: nowrap;
    }

    .moneyBox {
        margin-left: 0;
    }
}
</style>
</head>

<body>

<div id="loginScreen">
    <div class="loginBox">
        <h1>Doll Ball Collector Cards</h1>
        <p>Log in to play.</p>
        <button class="googleButton" onclick="loginGoogle()">
            Sign in with Google
        </button>
    </div>
</div>

<div id="gameScreen" class="hidden">

    <div class="topBar">

        <div class="moneyBox">
            Coins: <span id="money">0</span>
        </div>

        <button onclick="showPage('home')">HOME</button>

        <button onclick="showPage('collection')">
            COLLECTION
        </button>

        <button onclick="showPage('dex')">
            DEX
        </button>

        <button onclick="showPage('trade')">
            TRADE
        </button>

        <button onclick="openSettings()">
            SETTINGS
        </button>

        <button class="logoutButton" onclick="logout()">
            LOG OUT
        </button>

    </div>

    <div id="homePage" class="page">

        <div class="homeBox">

            <h1>Welcome!</h1>

            <p>
                Google Account:
                <span id="accountEmail"></span>
            </p>

            <p>
                Username:
                <span class="username" id="usernameDisplay"></span>
            </p>

            <hr>

            <h2>Open a Pack</h2>

            <p>
                Cost: 10 coins<br>
                Cards: 3
            </p>

            <button class="packButton" onclick="openPack()">
                OPEN PACK
            </button>

        </div>

    </div>

    <div id="collectionPage" class="page hidden">

        <h1>Collection</h1>

        <div class="tabs">

            <button
                id="collectionAllButton"
                class="active"
                onclick="setCollectionTab('all')">
                ALL
            </button>

            <button
                id="collectionFavoritesButton"
                onclick="setCollectionTab('favorites')">
                FAVORITES
            </button>

        </div>

        <input
            id="collectionSearch"
            class="searchBox"
            placeholder="Search cards..."
            oninput="renderCollection()"
        >

        <div
            id="collectionGrid"
            class="cardGrid">
        </div>

    </div>

    <div id="dexPage" class="page hidden">

        <h1>DEX</h1>

        <div class="tabs">

            <button
                id="dexDollsButton"
                class="active"
                onclick="setDexTab('dolls')">
                DOLLS
            </button>

            <button
                id="dexRaresButton"
                onclick="setDexTab('rares')">
                RARES
            </button>

        </div>

        <div id="dexGrid" class="cardGrid"></div>

    </div>

    <div id="tradePage" class="page hidden">

        <h1>Trading</h1>

        <div id="tradeSearchBox">

            <div class="tradeNotice">

                <b>Find a player</b>

                <p>
                    Search using their username.
                </p>

                <div class="tradeSearchArea">

                    <input
                        id="tradePlayerInput"
                        placeholder="Username"
                    >

                    <button
                        class="tradeSearchButton"
                        onclick="findPlayer()">
                        SEARCH
                    </button>

                </div>

                <div
                    id="tradePlayerResult"
                    class="tradePlayerResult">
                </div>

            </div>

        </div>

        <div id="incomingTrades"></div>

        <div id="activeTrade"></div>

    </div>

</div>

<div
    id="settingsOverlay"
    class="settingsOverlay hidden">

    <div class="settingsBox">

        <h2>Settings</h2>

        <p>
            Username:
            <b id="settingsUsername"></b>
        </p>

        <button
            class="settingsButton resetButton"
            onclick="resetAccount()">
            RESET ACCOUNT
        </button>

        <button
            class="settingsButton"
            onclick="closeSettings()">
            CLOSE
        </button>

    </div>

</div>

<div
    id="cardViewer"
    class="cardViewer hidden"
    onclick="closeCardViewer()">

    <button
        class="cardViewerClose"
        onclick="closeCardViewer(event)">
        X
    </button>

    <img
        id="cardViewerImage"
        class="cardViewerImage"
        src=""
        alt=""
        onclick="event.stopPropagation()"
    >

</div>

<div id="message"></div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    onSnapshot,
    collection as firestoreCollection,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyC-6paRzUxBv6DhZ5Vx_c8BG8vxcKe9xYw",
    authDomain: "dbcc-login.firebaseapp.com",
    databaseURL: "https://dbcc-login-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dbcc-login",
    storageBucket: "dbcc-login.firebasestorage.app",
    messagingSenderId: "878902780767",
    appId: "1:878902780767:web:4020d11730e5d9c0ee0cea",
    measurementId: "G-PT9S1K4E2K"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* CARDS */

const cards = [

    {
        name: "Baby Pickels",
        image: "baby pikels.png",
        weight: 14,
        price: 5,
        rarity: "doll"
    },

    {
        name: "Mr. Pickels",
        image: "mr. pickels.png",
        weight: 9,
        price: 7,
        rarity: "doll"
    },

    {
        name: "Wily",
        image: "wily.png",
        weight: 14,
        price: 5,
        rarity: "doll"
    },

    {
        name: "Will",
        image: "will.png",
        weight: 9,
        price: 7,
        rarity: "doll"
    },

    {
        name: "Waffle",
        image: "waffle.png",
        weight: 14,
        price: 5,
        rarity: "doll"
    },

    {
        name: "Cute Cake",
        image: "cute cake.png",
        weight: 9,
        price: 7,
        rarity: "doll"
    },

    {
        name: "Buttyr",
        image: "buttyr.png",
        weight: 20,
        price: 7,
        rarity: "doll"
    },

    {
        name: "Blossem",
        image: "blossem.png",
        weight: 20,
        price: 7,
        rarity: "doll"
    },

    {
        name: "Buzzy",
        image: "buzzy.png",
        weight: 5,
        price: 12,
        rarity: "doll"
    },

    {
        name: "Nico",
        image: "nico.png",
        weight: 20,
        price: 3,
        rarity: "doll"
    },

    {
        name: "Choper",
        image: "choper.png",
        weight: 10,
        price: 5,
        rarity: "doll"
    },

    {
        name: "Bullet",
        image: "bullet.png",
        weight: 10,
        price: 5,
        rarity: "doll"
    }

];


/* STATE */

let currentUser = null;

let money = 50;

let username = "";

let collection = [];

let favorites = [];

let completedTradeIds = [];

let collectionTab = "all";

let dexTab = "dolls";

let activeTrade = null;

let selectedTradeCards = [];

let tradeRequests = [];

let tradeListener = null;

let applyingTradeIds = new Set();


/* HELPERS */

function createCardId() {

    return Date.now().toString(36) +
        Math.random().toString(36).slice(2);

}


function createCardCopy(
    name,
    traded = false
) {

    return {
        id: createCardId(),
        name: name,
        traded: traded
    };

}


function getCard(name) {

    return cards.find(
        card => card.name === name
    );

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function encoded(value) {

    return encodeURIComponent(
        String(value)
    );

}


window.openEncodedCardViewer =
function(image, name) {

    openCardViewer(
        decodeURIComponent(image),
        decodeURIComponent(name)
    );

};


function showMessage(text) {

    const el =
        document.getElementById("message");

    el.textContent = text;

    el.style.display = "block";

    setTimeout(() => {

        el.style.display = "none";

    }, 2500);

}


/* FULL SCREEN CARD VIEW */

window.openCardViewer =
function(image, name) {

    const viewer =
        document.getElementById(
            "cardViewer"
        );

    const viewerImage =
        document.getElementById(
            "cardViewerImage"
        );

    viewerImage.src = image;

    viewerImage.alt = name;

    viewer.classList.remove(
        "hidden"
    );

};


window.closeCardViewer =
function(event) {

    if (event) {
        event.stopPropagation();
    }

    document
        .getElementById(
            "cardViewer"
        )
        .classList.add("hidden");

};


/* AUTH */

window.loginGoogle =
async function() {

    try {

        const provider =
            new GoogleAuthProvider();

        await signInWithPopup(
            auth,
            provider
        );

    } catch (error) {

        console.error(error);

        showMessage(
            error.message
        );

    }

};


window.logout =
async function() {

    try {

        await signOut(auth);

    } catch (error) {

        console.error(error);

    }

};


/* USERNAME */

async function askForUsername() {

    while (!username) {

        let chosen =
            prompt(
                "Choose your unique username:"
            );

        if (chosen === null) {
            chosen = "";
        }

        chosen =
            chosen.trim();

        if (chosen.length < 3) {

            alert(
                "Username must be at least 3 characters."
            );

            continue;

        }

        if (chosen.length > 20) {

            alert(
                "Username must be 20 characters or less."
            );

            continue;

        }

        if (
            !/^[a-zA-Z0-9_]+$/.test(
                chosen
            )
        ) {

            alert(
                "Only letters, numbers and _ are allowed."
            );

            continue;

        }

        const normalized =
            chosen.toLowerCase();

        const usernameRef =
            doc(
                db,
                "usernames",
                normalized
            );

        const usernameSnap =
            await getDoc(
                usernameRef
            );

        if (
            usernameSnap.exists() &&
            usernameSnap.data().uid !==
            currentUser.uid
        ) {

            alert(
                "That username is already taken."
            );

            continue;

        }

        await setDoc(
            usernameRef,
            {
                uid:
                    currentUser.uid,

                username:
                    chosen
            },
            {
                merge: true
            }
        );

        username =
            chosen;

        break;

    }

}


async function ensureUsernameDocument() {

    if (
        !currentUser ||
        !username
    ) {

        return;

    }

    await setDoc(
        doc(
            db,
            "usernames",
            username.toLowerCase()
        ),
        {
            uid:
                currentUser.uid,

            username:
                username
        },
        {
            merge: true
        }
    );

}


/* PLAYER DATA */

function normalizeCollection(data) {

    if (!Array.isArray(data)) {
        return [];
    }

    return data.map(item => {

        if (
            typeof item ===
            "string"
        ) {

            return createCardCopy(
                item
            );

        }

        return {

            id:
                item.id ||
                createCardId(),

            name:
                item.name,

            traded:
                item.traded === true

        };

    }).filter(
        item =>
            getCard(item.name)
    );

}


async function loadPlayerData() {

    const ref =
        doc(
            db,
            "players",
            currentUser.uid
        );

    const snap =
        await getDoc(ref);

    if (!snap.exists()) {

        money = 50;

        collection = [];

        favorites = [];

        completedTradeIds = [];

        username = "";

        await setDoc(
            ref,
            {
                money:
                    money,

                collection:
                    collection,

                favorites:
                    favorites,

                completedTradeIds:
                    completedTradeIds,

                username:
                    username
            }
        );

    } else {

        const data =
            snap.data();

        money =
            typeof data.money ===
            "number"
                ? data.money
                : 50;

        collection =
            normalizeCollection(
                data.collection
            );

        favorites =
            Array.isArray(
                data.favorites
            )
                ? data.favorites
                : [];

        completedTradeIds =
            Array.isArray(
                data.completedTradeIds
            )
                ? data.completedTradeIds
                : [];

        username =
            data.username ||
            "";

    }

    if (!username) {

        await askForUsername();

    }

    await ensureUsernameDocument();

    await savePlayerData();

}


async function savePlayerData() {

    if (!currentUser) {
        return;
    }

    await setDoc(
        doc(
            db,
            "players",
            currentUser.uid
        ),
        {

            money:
                money,

            collection:
                collection,

            favorites:
                favorites,

            completedTradeIds:
                completedTradeIds,

            username:
                username

        },
        {
            merge: true
        }
    );

}


/* AUTH STATE */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            currentUser = null;

            stopTradeListener();

            activeTrade = null;

            tradeRequests = [];

            document
                .getElementById(
                    "loginScreen"

function weightedRandomCard() {

    const totalWeight =
        cards.reduce(
            (
                sum,
                card
            ) =>
                sum +
                card.weight,
            0
        );

    let random =
        Math.random() *
        totalWeight;

    for (
        const card
        of cards
    ) {

        random -=
            card.weight;

        if (
            random <=
            0
        ) {

            return card;

        }

    }

    return cards[
        cards.length - 1
    ];

}


window.openPack =
async function() {

    if (
        money < 10
    ) {

        showMessage(
            "Not enough coins."
        );

        return;

    }

    money -= 10;

    const newCards = [];

    for (

        const card =
            weightedRandomCard();

        collection.push(
            createCardCopy(

        newCards.push(

    await savePlayerData();

};

function getCollectionCounts() {

    const counts = {};

    for (
        const copy
        of collection
    ) {

        counts[
            copy.name
        ] =
            (
                counts[
                    copy.name
                ] || 0
            ) + 1;

    }

    return counts;

}


function getFirstCopy(name) {

    return collection.find(
        copy =>
            copy.name ===
            name
    );

}


function renderCollection() {

    const grid =
        document.getElementById(
            "collectionGrid"
        );

    if (!grid) {
        return;
    }

    const search =
        (
            document
                .getElementById(
                    "collectionSearch"
                )
                ?.value ||
            ""
        ).toLowerCase();

    const counts =
        getCollectionCounts();

    let names =
        cards
            .filter(
                card =>
                    counts[
                        card.name
                    ]
            )
            .map(
                card =>
                    card.name
            );

    if (
        collectionTab ===
        "favorites"
    ) {

        names =
            names.filter(
                name =>
                    favorites.includes(
                        name
                    )
            );

    }

    if (search) {

        names =
            names.filter(
                name =>
                    name
                        .toLowerCase()
                        .includes(
                            search
                        )
            );

    }

    grid.innerHTML = "";

    if (!names.length) {

        grid.innerHTML =
            "<p>You don't have any cards here.</p>";

        return;

    }

    for (
        const name
        of names
    ) {

        const card =
            getCard(name);

        const copy =
            getFirstCopy(name);

        if (!card) {
            continue;
        }

        const isFavorite =
            favorites.includes(
                name
            );

        const traded =
            copy?.traded === true;

        let borderClass =
            "";

        if (
            isFavorite &&
            traded
        ) {

            borderClass =
                card.rarity === "rare"
                    ? "rareTradedFavoriteCard"
                    : "tradedFavoriteCard";

        } else if (
            isFavorite
        ) {

            borderClass =
                card.rarity === "rare"
                    ? "rareFavoriteCard"
                    : "favoriteCard";

        }

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "card " +
            borderClass;

        div.innerHTML = `

            <button
                class="starButton ${
                    isFavorite
                        ? "favorite"
                        : ""
                }"
                onclick="toggleFavorite('${escapeHtml(name)}')">
                ${
                    isFavorite
                        ? "★"
                        : "☆"
                }
            </button>

            <div class="cardCount">
                ${counts[name]}
            </div>

            <img
                src="${escapeHtml(card.image)}"
                alt="${escapeHtml(name)}"
                onclick="openEncodedCardViewer('${encoded(card.image)}','${encoded(name)}')"
            >

            <div class="cardName">
                ${escapeHtml(name)}
            </div>

            <div>
                Sell: ${card.price}
            </div>

            <button
                class="sellButton ${
                    isFavorite
                        ? "favoriteLocked"
                        : ""
                }"
                ${
                    isFavorite
                        ? "disabled"
                        : ""
                }
                onclick="sellCard('${escapeHtml(name)}')">

                ${
                    isFavorite
                        ? "FAVORITED"
                        : "SELL"
                }

            </button>

        `;

        grid.appendChild(div);

    }

}


window.toggleFavorite =
async function(name) {

    if (
        favorites.includes(
            name
        )
    ) {

        favorites =
            favorites.filter(
                item =>
                    item !==
                    name
            );

        showMessage(
            name +
            " is no longer a favorite."
        );

    } else {

        favorites.push(
            name
        );

        showMessage(
            name +
            " is now a favorite!"
        );

    }

    await savePlayerData();

    updateUI();

};


window.sellCard =
async function(name) {

    if (
        favorites.includes(
            name
        )
    ) {

        showMessage(
            "Favorite cards cannot be sold."
        );

        return;

    }

    const index =
        collection.findIndex(
            copy =>
                copy.name ===
                name
        );

    if (
        index ===
        -1
    ) {

        return;

    }

    const card =
        getCard(name);

    if (!card) {
        return;
    }

    collection.splice(
        index,
        1
    );

    money +=
        card.price;

    await savePlayerData();

    updateUI();

    showMessage(
        name +
        " sold for " +
        card.price +
        " coins."
    );

};

/* SEND TRADE */

window.sendTradeRequest =
async function(receiverUid) {

    if (!currentUser) {
        return;
    }

    if (
        receiverUid ===
        currentUser.uid
    ) {

        showMessage(
            "You cannot trade with yourself."
        );

        return;

    }

    try {

        const alreadyPending =
            tradeRequests.some(
                trade =>
                    trade.status ===
                    "pending" &&
                    (
                        (
                            trade.senderUid ===
                            currentUser.uid &&
                            trade.receiverUid ===
                            receiverUid
                        ) ||
                        (
                            trade.receiverUid ===
                            currentUser.uid &&
                            trade.senderUid ===
                            receiverUid
                        )
                    )
            );

        if (alreadyPending) {

            showMessage(
                "You already have a pending trade with this player."
            );

            return;

        }

        const tradeId =
            createCardId();

        const tradeRef =
            doc(
                db,
                "tradeRequests",
                tradeId
            );

        await setDoc(
            tradeRef,
            {

                participants: [
                    currentUser.uid,
                    receiverUid
                ],

                senderUid:
                    currentUser.uid,

                receiverUid:
                    receiverUid,

                senderUsername:
                    username,

                receiverUsername:
                    "",

                senderOffer:
                    [],

                receiverOffer:
                    [],

                senderConfirmed:
                    false,

                receiverConfirmed:
                    false,

                status:
                    "pending",

                createdAt:
                    serverTimestamp()

            }
        );

        showPage("trade");

        showMessage(
            "Trade request sent."
        );

    } catch (error) {

        console.error(
            "SEND TRADE ERROR:",
            error
        );

        showMessage(
            "Could not send trade request: " +
            error.message
        );

    }

};


/* TRADE LISTENER */

function stopTradeListener() {

    if (tradeListener) {

        tradeListener();

        tradeListener =
            null;

    }

}


function startTradeListener() {

    stopTradeListener();

    if (!currentUser) {
        return;
    }

    try {

        const tradeCollection =
            firestoreCollection(
                db,
                "tradeRequests"
            );

        const tradeQuery =
            query(
                tradeCollection,
                where(
                    "participants",
                    "array-contains",
                    currentUser.uid
                )
            );

        tradeListener =
            onSnapshot(
                tradeQuery,
                snapshot => {

                    tradeRequests =
                        snapshot.docs.map(
                            snap => ({
                                id:
                                    snap.id,

                                ...snap.data()
                            })
                        );

                    /*
                     Automatically try to finish
                     trades where both players
                     have confirmed.
                    */

                    for (
                        const trade
                        of tradeRequests
                    ) {

                        if (
                            trade.status ===
                            "pending" &&
                            trade.senderConfirmed ===
                            true &&
                            trade.receiverConfirmed ===
                            true
                        ) {

                            tryFinalizeTrade(
                                trade
                            );

                        }

                    }

                    /*
                     Apply trades that have
                     already been completed.
                    */

                    for (
                        const trade
                        of tradeRequests
                    ) {

                        if (
                            trade.status ===
                            "completed"
                        ) {

                            applyCompletedTrade(
                                trade
                            );

                        }

                    }

                    /*
                     Keep active trade updated.
                    */

                    if (activeTrade) {

                        const fresh =
                            tradeRequests.find(
                                trade =>
                                    trade.id ===
                                    activeTrade.id
                            );

                        if (fresh) {

                            activeTrade =
                                fresh;

                            /*
                             Keep local selection
                             synchronized with the
                             saved offer.
                            */

                            const savedOffer =
                                getMyOffer(
                                    fresh
                                );

                            if (
                                savedOffer.length > 0 &&
                                selectedTradeCards.length === 0
                            ) {

                                selectedTradeCards =
                                    savedOffer.map(
                                        card =>
                                            card.id
                                    );

                            }

                        }

                    }

                    renderIncomingTrades();

                    renderActiveTrade();

                },
                error => {

                    console.error(
                        "TRADE LISTENER ERROR:",
                        error
                    );

                    showMessage(
                        "Trade connection error: " +
                        error.message
                    );

                }
            );

    } catch (error) {

        console.error(error);

    }

}

/* ACCEPT TRADE */

window.acceptTrade =
function(tradeId) {

    const trade =
        tradeRequests.find(
            item =>
                item.id ===
                tradeId
        );

    if (!trade) {

        showMessage(
            "Trade request not found."
        );

        return;

    }

    if (
        trade.receiverUid !==
        currentUser.uid
    ) {

        showMessage(
            "You cannot accept this trade."
        );

        return;

    }

    if (
        trade.status !==
        "pending"
    ) {

        showMessage(
            "This trade is no longer pending."
        );

        return;

    }

    activeTrade =
        trade;

    selectedTradeCards =
        getMyOffer(
            trade
        ).map(
            card =>
                card.id
        );

    showPage("trade");

    renderIncomingTrades();

    renderActiveTrade();

};


/* OPEN OUTGOING TRADE */

function openOutgoingTradeIfNeeded() {

    if (activeTrade) {
        return;
    }

    const outgoing =
        tradeRequests.find(
            trade =>
                trade.senderUid ===
                currentUser?.uid &&
                trade.status ===
                "pending"
        );

    if (outgoing) {

        activeTrade =
            outgoing;

        selectedTradeCards =
            getMyOffer(
                outgoing
            ).map(
                card =>
                    card.id
            );

    }

}


window.openTrade =
function(tradeId) {

    const trade =
        tradeRequests.find(
            item =>
                item.id ===
                tradeId
        );

    if (!trade) {
        return;
    }

    activeTrade =
        trade;

    selectedTradeCards =
        getMyOffer(
            trade
        ).map(
            card =>
                card.id
        );

    renderIncomingTrades();

    renderActiveTrade();

};


/* TRADE DATA */

function getMyOffer(trade) {

    if (
        trade.senderUid ===
        currentUser.uid
    ) {

        return Array.isArray(
            trade.senderOffer
        )
            ? trade.senderOffer
            : [];

    }

    return Array.isArray(
        trade.receiverOffer
    )
        ? trade.receiverOffer
        : [];

}


function getTheirOffer(trade) {

    if (
        trade.senderUid ===
        currentUser.uid
    ) {

        return Array.isArray(
            trade.receiverOffer
        )
            ? trade.receiverOffer
            : [];

    }

    return Array.isArray(
        trade.senderOffer
    )
        ? trade.senderOffer
        : [];

}


function sameIds(a, b) {

    if (
        !Array.isArray(a) ||
        !Array.isArray(b)
    ) {

        return false;

    }

    if (
        a.length !==
        b.length
    ) {

        return false;

    }

    for (
        let i = 0;
        i < a.length;
        i++
    ) {

        if (
            a[i] !==
            b[i]
        ) {

            return false;

        }

    }

    return true;

}


/* RENDER OFFER CARDS */

function renderOfferCards(
    offer,
    selectable = false
) {

    if (
        !Array.isArray(offer) ||
        !offer.length
    ) {

        return `
            <p style="text-align:center">
                No cards offered yet.
            </p>
        `;

    }

    return `

        <div class="tradeCardGrid">

            ${
                offer.map(
                    copy => {

                        const card =
                            getCard(
                                copy.name
                            );

                        if (!card) {
                            return "";
                        }

                        const selected =
                            selectable &&
                            selectedTradeCards.includes(
                                copy.id
                            );

                        return `

                            <div
                                class="tradeCard ${
                                    selected
                                        ? "selected"
                                        : ""
                                }"
                                ${
                                    selectable
                                        ? `onclick="toggleTradeCard('${escapeHtml(copy.id)}')"`
                                        : ""
                                }
                            >

                                <img
                                    src="${escapeHtml(card.image)}"
                                    alt="${escapeHtml(card.name)}"
                                    onclick="event.stopPropagation(); openEncodedCardViewer('${encoded(card.image)}','${encoded(card.name)}')"
                                >

                                <div>
                                    ${escapeHtml(card.name)}
                                </div>

                                ${
                                    copy.traded
                                        ? "<small>Traded</small>"
                                        : ""
                                }

                            </div>

                        `;

                    }
                ).join("")
            }

        </div>

    `;

}


/* SELECTABLE OWN COLLECTION */

function renderSelectableTradeCards() {

    if (!collection.length) {

        return `
            <p style="text-align:center">
                You have no cards.
            </p>
        `;

    }

    return `

        <div class="tradeCardGrid">

            ${
                collection.map(
                    copy => {

                        const card =
                            getCard(
                                copy.name
                            );

                        if (!card) {
                            return "";
                        }

                        const selected =
                            selectedTradeCards.includes(
                                copy.id
                            );

                        return `

                            <div
                                class="tradeCard ${
                                    selected
                                        ? "selected"
                                        : ""
                                }"
                                onclick="toggleTradeCard('${escapeHtml(copy.id)}')"
                            >

                                <img
                                    src="${escapeHtml(card.image)}"
                                    alt="${escapeHtml(card.name)}"
                                    onclick="event.stopPropagation(); openEncodedCardViewer('${encoded(card.image)}','${encoded(card.name)}')"
                                >

                                <div>
                                    ${escapeHtml(card.name)}
                                </div>

                                ${
                                    copy.traded
                                        ? "<small>Traded</small>"
                                        : ""
                                }

                            </div>

                        `;

                    }
                ).join("")
            }

        </div>

    `;

}


/* ACTIVE TRADE */

function renderActiveTrade() {

    const container =
        document.getElementById(
            "activeTrade"
        );

    if (!container) {
        return;
    }

    openOutgoingTradeIfNeeded();

    if (
        !activeTrade
    ) {

        container.innerHTML = "";

        return;

    }

    if (
        activeTrade.status !==
        "pending"
    ) {

        if (
            activeTrade.status ===
            "completed"
        ) {

            container.innerHTML = `

                <div class="tradeArea">

                    <h2>
                        Trade Completed
                    </h2>

                    <p style="text-align:center">
                        The cards were successfully swapped.
                    </p>

                </div>

            `;

        } else {

            container.innerHTML = "";

        }

        return;

    }

    const isSender =
        activeTrade.senderUid ===
        currentUser.uid;

    const myOffer =
        getMyOffer(
            activeTrade
        );

    const theirOffer =
        getTheirOffer(
            activeTrade
        );

    const myConfirmed =
        isSender
            ? activeTrade.senderConfirmed === true
            : activeTrade.receiverConfirmed === true;

    const theirConfirmed =
        isSender
            ? activeTrade.receiverConfirmed === true
            : activeTrade.senderConfirmed === true;

    const offerMatches =
        sameIds(
            myOffer.map(
                card =>
                    card.id
            ),
            selectedTradeCards
        );

    container.innerHTML = `

        <div class="tradeArea">

            <h2>
                Trading
            </h2>

            <div class="tradeColumns">

                <div class="tradeSide">

                    <h3>
                        Your Offer
                    </h3>

                    ${
                        renderOfferCards(
                            myOffer
                        )
                    }

                    <p style="text-align:center">
                        Current offer:
                        ${myOffer.length}
                        card(s)
                    </p>

                    <hr>

                    <h3>
                        Choose Cards
                    </h3>

                    ${
                        renderSelectableTradeCards()
                    }

                    <p style="text-align:center">

                        ${
                            selectedTradeCards.length
                        }

                        card(s) selected

                    </p>

                    <button
                        class="changeOfferButton"
                        onclick="submitTradeOffer()">

                        UPDATE MY OFFER

                    </button>

                </div>


                <div class="tradeSide">

                    <h3>
                        Their Offer
                    </h3>

                    ${
                        renderOfferCards(
                            theirOffer
                        )
                    }

                    <p style="text-align:center">
                        Their offer:
                        ${theirOffer.length}
                        card(s)
                    </p>

                </div>

            </div>


            <div class="tradeStatus">

                ${
                    myConfirmed
                        ? "You confirmed this trade."
                        : "You have not confirmed."
                }

                <br>

                ${
                    theirConfirmed
                        ? "They confirmed this trade."
                        : "They have not confirmed."
                }

            </div>


            ${
                !offerMatches
                    ? `
                        <p style="
                            text-align:center;
                            color:#36b9ff;
                        ">
                            Update your offer before confirming.
                        </p>
                    `
                    : ""
            }


            ${
                myOffer.length === 0
                    ? `
                        <p style="
                            text-align:center;
                            color:#36b9ff;
                        ">
                            You must offer at least one card.
                        </p>
                    `
                    : ""
            }


            ${
                theirOffer.length === 0
                    ? `
                        <p style="
                            text-align:center;
                            color:#36b9ff;
                        ">
                            Waiting for them to offer a card.
                        </p>
                    `
                    : ""
            }


            <button
                class="confirmButton"
                onclick="confirmTrade()"
                ${
                    myConfirmed ||
                    !offerMatches ||
                    myOffer.length === 0 ||
                    theirOffer.length === 0
                        ? "disabled"
                        : ""
                }>

                ${
                    myConfirmed
                        ? "CONFIRMED"
                        : "CONFIRM TRADE"
                }

            </button>


            <button
                class="cancelButton"
                onclick="cancelTrade('${escapeHtml(activeTrade.id)}')">

                CANCEL TRADE

            </button>

        </div>

    `;

}


/* SELECT CARDS */

window.toggleTradeCard =
function(cardId) {

    if (
        !activeTrade ||
        activeTrade.status !==
        "pending"
    ) {

        return;

    }

    const copy =
        collection.find(
            card =>
                card.id ===
                cardId
        );

    if (!copy) {
        return;
    }

    if (
        selectedTradeCards.includes(
            cardId
        )
    ) {

        selectedTradeCards =
            selectedTradeCards.filter(
                id =>
                    id !==
                    cardId
            );

    } else {

        selectedTradeCards.push(
            cardId
        );

    }

    renderActiveTrade();

};


/* UPDATE OFFER */

window.submitTradeOffer =
async function() {

    if (
        !activeTrade ||
        activeTrade.status !==
        "pending"
    ) {

        return;

    }

    const validIds =
        selectedTradeCards.filter(
            id =>
                collection.some(
                    copy =>
                        copy.id ===
                        id
                )
        );

    selectedTradeCards =
        validIds;

    const offer =
        selectedTradeCards.map(
            id => {

                const copy =
                    collection.find(
                        item =>
                            item.id ===
                            id
                    );

                if (!copy) {
                    return null;
                }

                return {

                    id:
                        copy.id,

                    name:
                        copy.name,

                    traded:
                        copy.traded === true,

                    favorite:
                        favorites.includes(
                            copy.name
                        )

                };

            }
        ).filter(Boolean);

    const ids =
        offer.map(
            card =>
                card.id
        );

    if (
        new Set(ids).size !==
        ids.length
    ) {

        showMessage(
            "Invalid card selection."
        );

        return;

    }

    const isSender =
        activeTrade.senderUid ===
        currentUser.uid;

    const field =
        isSender
            ? "senderOffer"
            : "receiverOffer";

    try {

        await updateDoc(
            doc(
                db,
                "tradeRequests",
                activeTrade.id
            ),
            {

                [field]:
                    offer,

                senderConfirmed:
                    false,

                receiverConfirmed:
                    false

            }
        );

        /*
         Keep the selected cards.
         Do not clear them.
        */

        showMessage(
            "Offer updated. Both players must confirm again."
        );

    } catch (error) {

        console.error(
            "OFFER UPDATE ERROR:",
            error
        );

        showMessage(
            "Could not update offer: " +
            error.message
        );

    }

};


/* CONFIRM */

window.confirmTrade =
async function() {

    if (
        !activeTrade ||
        activeTrade.status !==
        "pending"
    ) {

        return;

    }

    /*
     Get the newest trade document.
     */

    try {

        const tradeRef =
            doc(
                db,
                "tradeRequests",
                activeTrade.id
            );

        const tradeSnap =
            await getDoc(
                tradeRef
            );

        if (!tradeSnap.exists()) {

            showMessage(
                "Trade no longer exists."
            );

            return;

        }

        const trade = {

            id:
                tradeSnap.id,

            ...tradeSnap.data()

        };

        if (
            trade.status !==
            "pending"
        ) {

            return;

        }

        const myOffer =
            getMyOffer(
                trade
            );

        const theirOffer =
            getTheirOffer(
                trade
            );

        const currentIds =
            myOffer.map(
                card =>
                    card.id
            );

        if (
            myOffer.length ===
            0
        ) {

            showMessage(
                "You must offer at least one card."
            );

            return;

        }

        if (
            theirOffer.length ===
            0
        ) {

            showMessage(
                "Wait for the other player to offer a card."
            );

            return;

        }

        if (
            !sameIds(
                currentIds,
                selectedTradeCards
            )
        ) {

            showMessage(
                "Update your offer before confirming."
            );

            return;

        }

        const stillOwns =
            myOffer.every(
                offered =>
                    collection.some(
                        copy =>
                            copy.id ===
                            offered.id
                    )
            );

        if (!stillOwns) {

            showMessage(
                "One of your offered cards is no longer in your collection."
            );

            return;

        }

        const isSender =
            trade.senderUid ===
            currentUser.uid;

        const field =
            isSender
                ? "senderConfirmed"
                : "receiverConfirmed";

        await updateDoc(
            tradeRef,
            {

                [field]:
                    true

            }
        );

        /*
         Update local state immediately.
        */

        activeTrade = {

            ...trade,

            [field]:
                true

        };

        renderActiveTrade();

        showMessage(
            "Confirmed. Waiting for the other player."
        );

        /*
         Immediately check whether the
         other player had already confirmed.
        */

        await tryFinalizeTrade({

            ...trade,

            [field]:
                true

        });

    } catch (error) {

        console.error(
            "CONFIRM ERROR:",
            error
        );

        showMessage(
            "Could not confirm trade: " +
            error.message
        );

    }

};


/* FINALIZE */

async function tryFinalizeTrade(
    trade
) {

    if (
        !trade ||
        trade.status !==
        "pending"
    ) {

        return;

    }

    if (
        trade.senderConfirmed !==
        true ||
        trade.receiverConfirmed !==
        true
    ) {

        return;

    }

    const senderOffer =
        Array.isArray(
            trade.senderOffer
        )
            ? trade.senderOffer
            : [];

    const receiverOffer =
        Array.isArray(
            trade.receiverOffer
        )
            ? trade.receiverOffer
            : [];

    if (
        senderOffer.length ===
        0 ||
        receiverOffer.length ===
        0
    ) {

        return;

    }

    try {

        const tradeRef =
            doc(
                db,
                "tradeRequests",
                trade.id
            );

        /*
         Read the newest version again so
         neither player can finalize using
         stale confirmation data.
        */

        const snap =
            await getDoc(
                tradeRef
            );

        if (!snap.exists()) {
            return;
        }

        const freshTrade = {

            id:
                snap.id,

            ...snap.data()

        };

        if (
            freshTrade.status !==
            "pending"
        ) {

            /*
             Someone else already finalized it.
             */

            return;

        }

        if (
            freshTrade.senderConfirmed !==
            true ||
            freshTrade.receiverConfirmed !==
            true
        ) {

            return;

        }

        const freshSenderOffer =
            Array.isArray(
                freshTrade.senderOffer
            )
                ? freshTrade.senderOffer
                : [];

        const freshReceiverOffer =
            Array.isArray(
                freshTrade.receiverOffer
            )
                ? freshTrade.receiverOffer
                : [];

        if (
            freshSenderOffer.length ===
            0 ||
            freshReceiverOffer.length ===
            0
        ) {

            return;

        }

        /*
         Mark the trade completed.
        */

        await updateDoc(
            tradeRef,
            {

                status:
                    "completed",

                completedAt:
                    serverTimestamp()

            }
        );

        /*
         Apply it immediately for this player.
         The other player will receive the same
         completed trade through their listener.
        */

        await applyCompletedTrade({

            ...freshTrade,

            status:
                "completed"

        });

    } catch (error) {

        console.error(
            "FINALIZE TRADE ERROR:",
            error
        );

    }

}


/* APPLY COMPLETED TRADE */

async function applyCompletedTrade(
    trade
) {

    if (
        !currentUser ||
        trade.status !==
        "completed"
    ) {

        return;

    }

    if (
        completedTradeIds.includes(
            trade.id
        )
    ) {

        return;

    }

    if (
        applyingTradeIds.has(
            trade.id
        )
    ) {

        return;

    }

    applyingTradeIds.add(
        trade.id
    );

    try {

        const isSender =
            trade.senderUid ===
            currentUser.uid;

        const myOffer =
            isSender
                ? (
                    Array.isArray(
                        trade.senderOffer
                    )
                        ? trade.senderOffer
                        : []
                )
                : (
                    Array.isArray(
                        trade.receiverOffer
                    )
                        ? trade.receiverOffer
                        : []
                );

        const incomingOffer =
            isSender
                ? (
                    Array.isArray(
                        trade.receiverOffer
                    )
                        ? trade.receiverOffer
                        : []
                )
                : (
                    Array.isArray(
                        trade.senderOffer
                    )
                        ? trade.senderOffer
                        : []
                );

        if (
            myOffer.length ===
            0 ||
            incomingOffer.length ===
            0
        ) {

            return;

        }

        const playerRef =
            doc(
                db,
                "players",
                currentUser.uid
            );

        const playerSnap =
            await getDoc(
                playerRef
            );

        if (!playerSnap.exists()) {

            return;

        }

        const data =
            playerSnap.data();

        let currentCollection =
            normalizeCollection(
                data.collection
            );

        let currentFavorites =
            Array.isArray(
                data.favorites
            )
                ? [...data.favorites]
                : [];

        let currentCompleted =
            Array.isArray(
                data.completedTradeIds
            )
                ? [...data.completedTradeIds]
                : [];

        if (
            currentCompleted.includes(
                trade.id
            )
        ) {

            completedTradeIds =
                currentCompleted;

            return;

        }

        /*
         Make sure every outgoing physical
         card still exists.
        */

        const ownsAll =
            myOffer.every(
                offered =>
                    currentCollection.some(
                        copy =>
                            copy.id ===
                            offered.id
                    )
            );

        if (!ownsAll) {

            /*
             If the cards are already gone and
             incoming cards are already present,
             treat the trade as already applied.
            */

            const incomingAlreadyThere =
                incomingOffer.every(
                    offered =>
                        currentCollection.some(
                            copy =>
                                copy.id ===
                                offered.id
                        )
                );

            if (
                incomingAlreadyThere
            ) {

                currentCompleted.push(
                    trade.id
                );

                await setDoc(
                    playerRef,
                    {
                        completedTradeIds:
                            currentCompleted
                    },
                    {
                        merge: true
                    }
                );

                completedTradeIds =
                    currentCompleted;

            }

            return;

        }

        /*
         Remove the exact physical cards.
        */

        const outgoingIds =
            new Set(
                myOffer.map(
                    card =>
                        card.id
                )
            );

        currentCollection =
            currentCollection.filter(
                copy =>
                    !outgoingIds.has(
                        copy.id
                    )
            );

        /*
         Add the exact incoming physical cards.
        */

        for (
            const offered
            of incomingOffer
        ) {

            const alreadyExists =
                currentCollection.some(
                    copy =>
                        copy.id ===
                        offered.id
                );

            if (
                alreadyExists
            ) {

                continue;

            }

            currentCollection.push({

                id:
                    offered.id,

                name:
                    offered.name,

                traded:
                    true

            });

            /*
             Favorite status travels with
             the physical card.
            */

            if (
                offered.favorite ===
                true &&
                !currentFavorites.includes(
                    offered.name
                )
            ) {

                currentFavorites.push(
                    offered.name
                );

            }

        }

        /*
         Record completion only after the
         collection has been successfully
         prepared.
        */

        currentCompleted.push(
            trade.id
        );

        await setDoc(
            playerRef,
            {

                collection:
                    currentCollection,

                favorites:
                    currentFavorites,

                completedTradeIds:
                    currentCompleted

            },
            {
                merge: true
            }
        );

        /*
         Update local game state.
        */

        collection =
            currentCollection;

        favorites =
            currentFavorites;

        completedTradeIds =
            currentCompleted;

        /*
         Only now is the trade considered
         applied locally.
        */

        updateUI();

        showMessage(
            "Trade completed! Cards swapped."
        );

    } catch (error) {

        console.error(
            "APPLY TRADE ERROR:",
            error
        );

        showMessage(
            "Could not finish the trade: " +
            error.message
        );

    } finally {

        /*
         If anything failed, this is removed
         so the listener can retry later.
        */

        applyingTradeIds.delete(
            trade.id
        );

    }

}


/* CANCEL */

window.cancelTrade =
async function(tradeId) {

    if (!tradeId) {
        return;
    }

    try {

        await updateDoc(
            doc(
                db,
                "tradeRequests",
                tradeId
            ),
            {

                status:
                    "cancelled"

            }
        );

        if (
            activeTrade &&
            activeTrade.id ===
            tradeId
        ) {

            activeTrade =
                null;

        }

        selectedTradeCards = [];

        renderActiveTrade();

        renderIncomingTrades();

        showMessage(
            "Trade cancelled."
        );

    } catch (error) {

        console.error(
            error
        );

        showMessage(
            "Could not cancel trade: " +
            error.message
        );

    }

};


/* SETTINGS */

window.openSettings =
function() {

    document
        .getElementById(
            "settingsOverlay"
        )
        .classList.remove(
            "hidden"
        );

};


window.closeSettings =
function() {

    document
        .getElementById(
            "settingsOverlay"
        )
        .classList.add(
            "hidden"
        );

};


/* RESET */

window.resetAccount =
async function() {

    const yes =
        confirm(
            "Are you sure you want to reset your account? This deletes your coins and collection."
        );

    if (!yes) {
        return;
    }

    money = 50;

    collection = [];

    favorites = [];

    completedTradeIds = [];

    await savePlayerData();

    updateUI();

    closeSettings();

    showMessage(
        "Account reset."
    );

};
