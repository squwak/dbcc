<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doll Battle & Trading Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    .hidden { display: none !important; }
    .friendBox, .battleChoiceCard, .rankBox, .battleRequestBox {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .profilePicSmall { width: 40px; height: 40px; border-radius: 50%; }
    .battleChoiceCard { border: 2px solid transparent; cursor: pointer; display: inline-block; width: 120px; text-align: center; margin: 5px; }
    .battleChoiceCard.selected { border-color: #25b864; }
    .favoriteBattleCard { border-color: #f1c40f; }
    .hpBar { background: #444; height: 16px; border-radius: 8px; overflow: hidden; margin: 8px 0; }
    .hpFill { background: #25b864; height: 100%; transition: width 0.3s ease; }
    .battleVs { font-size: 24px; font-weight: bold; text-align: center; margin: 10px 0; }
    .battleResult { text-align: center; margin-top: 20px; padding: 20px; background: #222; border-radius: 8px; }
    .winText { font-size: 28px; font-weight: bold; }
    .rankProgressBar { background: #444; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
    .rankProgressFill { background: #f1c40f; height: 100%; }
    .packButton, .tradeSearchButton, .friendBattleButton, .friendAcceptButton, .friendDeclineButton {
      background: #3498db;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .friendBattleButton { background: #e67e22; }
    .friendAcceptButton { background: #2ecc71; }
    .friendDeclineButton { background: #e74c3c; }
  </style>
</head>
<body>

  <!-- Main Battle View -->
  <div id="battleMain">
    <h2>Battle Arena</h2>
    <div id="battleRankInfo"></div>
    <div id="battleRequests"></div>
    <div style="margin-top: 15px;">
      <button class="packButton" onclick="startBotBattle('easy')">Fight Easy Bot</button>
      <button class="packButton" onclick="startBotBattle('hard')">Fight Hard Bot</button>
    </div>
  </div>

  <!-- Card Selection View -->
  <div id="battleChoice" class="hidden">
    <h3>Choose Your Battle Doll</h3>
    <div id="battleChoiceGrid"></div>
    <div style="margin-top: 15px;">
      <button id="battleStartButton" class="packButton" disabled onclick="confirmBattleCard()">START BATTLE</button>
      <button class="packButton" style="background:#7f8c8d" onclick="cancelBattleSetup()">CANCEL</button>
    </div>
  </div>

  <!-- Active Battle View -->
  <div id="battleArena" class="hidden"></div>

  <!-- Friends Overlay / Container -->
  <div id="friendsList"></div>

  <!-- Settings Overlay -->
  <div id="settingsOverlay" class="hidden">
    <div style="background:#222; padding:20px; border-radius:8px; max-width:400px; margin: auto;">
      <h3>Settings</h3>
      <button class="packButton" style="background:#e74c3c; width:100%" onclick="resetAccount()">RESET ACCOUNT</button>
      <button class="packButton" style="width:100%; margin-top:10px" onclick="closeSettings()">CLOSE</button>
    </div>
  </div>

  <!-- Firebase & App Script -->
  <script type="module">
    // Mock variables and utilities (Replace or connect to your Firebase instance)
    const DEFAULT_PROFILE_PIC = "https://via.placeholder.com/40";
    const STARTING_COINS = 100;
    const STARTING_DOLB = 10;
    const BATTLE_HP = 100;
    const NORMAL_RANK_COINS = 50;
    const NORMAL_RANK_DOLB = 5;
    const LEVEL_15_BONUS_COINS = 200;
    const LEVEL_20_BONUS_DOLB = 50;

    // State Variables
    let money = STARTING_COINS;
    let dolb = STARTING_DOLB;
    let collection = [];
    let favorites = [];
    let completedTradeIds = [];
    let friends = [];
    let friendRequests = [];
    let ownedProfilePics = [DEFAULT_PROFILE_PIC];
    let profilePic = DEFAULT_PROFILE_PIC;
    let username = "Player";
    let playerLevel = 0;
    let playerLevelWins = 0;
    let easyBotLevel = 0;
    let easyBotWins = 0;
    let hardBotLevel = 0;
    let hardBotWins = 0;
    let currentUser = { uid: "user_123" };

    let battleMode = null;
    let battleDifficulty = null;
    let battleOpponentUid = null;
    let battleOpponentUsername = "";
    let battleOpponentPic = DEFAULT_PROFILE_PIC;
    let battleSelectedCardId = null;
    let battleRoomId = null;
    let battleRewardGiven = false;
    let battleListener = null;

    // Mock Cards Database
    const cards = [
      { name: "Fire Doll", type: ["Fire"], power: 20, move: "Flame Blast", moveType: "Fire", image: "https://via.placeholder.com/100/ff5555/ffffff?text=Fire+Doll" },
      { name: "Water Doll", type: ["Water"], power: 18, move: "Hydro Splash", moveType: "Water", image: "https://via.placeholder.com/100/5555ff/ffffff?text=Water+Doll" },
      { name: "Grass Doll", type: ["Grass"], power: 15, move: "Vine Whip", moveType: "Grass", image: "https://via.placeholder.com/100/55ff55/ffffff?text=Grass+Doll" }
    ];

    // Helper Functions
    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function showMessage(msg) {
      alert(msg);
    }

    function createCardId() {
      return "card_" + Math.random().toString(36).substr(2, 9);
    }

    function winsNeededForLevel(lvl) {
      return (lvl + 1) * 2;
    }

    function getCopyLevel(copy) {
      return copy ? (copy.level || 0) : 0;
    }

    function getCard(cardName) {
      return cards.find(c => c.name === cardName) || cards[0];
    }

    function updateUI() {
      renderBattleHome();
      renderBattleRequests();
    }

    async function savePlayerData() {
      console.log("Player data saved.");
    }

    // Mock Firestore References
    const db = {};
    const doc = (db, col, id) => ({ col, id });
    const updateDoc = async () => {};
    const setDoc = async () => {};
    const getDoc = async () => ({ exists: () => false });
    const serverTimestamp = () => new Date();

    /* =========================
       FRIENDS MANAGEMENT
    ========================= */
    window.declineFriendRequest = async (id) => {
      try {
        await updateDoc(doc(db, "friendRequests", id), { status: "declined" });
        showMessage("Friend request declined.");
      } catch (e) {
        console.error(e);
        showMessage("Could not decline friend request: " + e.message);
      }
    };

    async function renderFriends() {
      const c = document.getElementById("friendsList");
      if (!c) return;

      if (!friends.length) {
        c.innerHTML = '<div class="friendEmpty"><p>You have no friends added yet.</p></div>';
        return;
      }

      c.innerHTML = "<p>Loading friends...</p>";
      const list = [];

      for (const uid of friends) {
        try {
          const snap = await getDoc(doc(db, "players", uid));
          if (snap.exists()) {
            const data = snap.data();
            list.push({
              uid,
              username: data.username || "Unknown",
              profilePic: data.profilePic || DEFAULT_PROFILE_PIC,
              playerLevel: data.playerLevel || 0
            });
          }
        } catch (e) {
          console.error(e);
        }
      }

      if (!list.length) {
        c.innerHTML = '<div class="friendEmpty"><p>No friend details could be loaded.</p></div>';
        return;
      }

      c.innerHTML = "";
      list.forEach(f => {
        const div = document.createElement("div");
        div.className = "friendBox";
        div.innerHTML = `
          <img class="profilePicSmall" src="${escapeHtml(f.profilePic)}">
          <div class="friendInfo">
            <div class="friendName">${escapeHtml(f.username)}</div>
            <div style="font-size:13px;opacity:.8">Rank ${f.playerLevel}</div>
          </div>
          <button class="tradeSearchButton" onclick="sendTradeRequest('${escapeHtml(f.uid)}')">TRADE</button>
          <button class="friendBattleButton" onclick="challengeFriend('${escapeHtml(f.uid)}', '${escapeHtml(f.username)}', '${escapeHtml(f.profilePic)}')">BATTLE</button>
        `;
        c.appendChild(div);
      });
    }

    /* =========================
       SETTINGS
    ========================= */
    window.openSettings = () => {
      const el = document.getElementById("settingsOverlay");
      if (el) el.classList.remove("hidden");
    };

    window.closeSettings = () => {
      const el = document.getElementById("settingsOverlay");
      if (el) el.classList.add("hidden");
    };

    window.resetAccount = async () => {
      if (!confirm("Are you sure you want to reset your account? All progress will be lost!")) return;
      try {
        money = STARTING_COINS;
        dolb = STARTING_DOLB;
        collection = [];
        favorites = [];
        completedTradeIds = [];
        friends = [];
        ownedProfilePics = [DEFAULT_PROFILE_PIC];
        profilePic = DEFAULT_PROFILE_PIC;
        playerLevel = 0;
        playerLevelWins = 0;
        easyBotLevel = 0;
        easyBotWins = 0;
        hardBotLevel = 0;
        hardBotWins = 0;

        await savePlayerData();
        closeSettings();
        updateUI();
        showMessage("Account reset successfully.");
      } catch (e) {
        console.error(e);
        showMessage("Could not reset account: " + e.message);
      }
    };

    /* =========================
       BATTLE
    ========================= */
    function renderBattleHome() {
      const rankInfo = document.getElementById("battleRankInfo");
      if (!rankInfo) return;

      const currentWins = playerLevelWins;
      const neededWins = winsNeededForLevel(playerLevel);
      const progressPercent = Math.min(100, Math.floor((currentWins / neededWins) * 100));

      rankInfo.innerHTML = `
        <div class="rankBox">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-size:14px;opacity:.8">YOUR RANK</div>
              <div class="rankNumber" style="font-size:22px;font-weight:bold">Rank ${playerLevel}</div>
            </div>
            <div style="text-align:right">
              <div>Wins: ${currentWins} / ${neededWins}</div>
              <div style="font-size:12px;opacity:.7">to Rank ${playerLevel + 1}</div>
            </div>
          </div>
          <div class="rankProgressBar">
            <div class="rankProgressFill" style="width:${progressPercent}%"></div>
          </div>
        </div>
      `;
    }

    function renderBattleRequests() {
      const c = document.getElementById("battleRequests");
      if (!c) return;

      const incoming = friendRequests.filter(
        r => r.receiverUid === currentUser?.uid && r.status === "pending" && r.type === "battle"
      );

      if (!incoming.length) {
        c.innerHTML = "";
        return;
      }

      c.innerHTML = "<h3>Battle Challenges</h3>";
      incoming.forEach(r => {
        const d = document.createElement("div");
        d.className = "battleRequestBox";
        d.innerHTML = `
          <div>
            <b>${escapeHtml(r.senderUsername || "A friend")}</b> challenged you to a battle!
          </div>
          <div class="battleRequestButtons" style="margin-top:8px">
            <button class="friendAcceptButton" onclick="acceptBattleChallenge('${escapeHtml(r.id)}')">ACCEPT</button>
            <button class="friendDeclineButton" onclick="declineFriendRequest('${escapeHtml(r.id)}')">DECLINE</button>
          </div>
        `;
        c.appendChild(d);
      });
    }

    window.startBotBattle = (difficulty) => {
      if (!collection.length) {
        // Adding a default doll if user has none for testing
        collection.push({ id: createCardId(), name: "Fire Doll", level: 0, levelWins: 0 });
      }

      battleMode = "bot";
      battleDifficulty = difficulty;
      battleOpponentUid = "bot_" + difficulty;
      battleOpponentUsername = difficulty === "easy" ? "Easy Bot" : "Hard Bot";
      battleOpponentPic = DEFAULT_PROFILE_PIC;
      showBattleChoice();
    };

    window.challengeFriend = async (uid, username, pic) => {
      if (!collection.length) {
        showMessage("You need at least one doll in your collection to battle.");
        return;
      }
      try {
        const reqId = createCardId();
        await setDoc(doc(db, "friendRequests", reqId), {
          participants: [currentUser.uid, uid],
          senderUid: currentUser.uid,
          receiverUid: uid,
          senderUsername: username,
          type: "battle",
          status: "pending",
          createdAt: serverTimestamp()
        });
        showMessage("Battle challenge sent to " + username + "!");
      } catch (e) {
        console.error(e);
        showMessage("Could not send challenge: " + e.message);
      }
    };

    window.acceptBattleChallenge = async (requestId) => {
      const r = friendRequests.find(x => x.id === requestId);
      if (!r) return;
      if (!collection.length) {
        showMessage("You need at least one doll in your collection to battle.");
        return;
      }

      battleMode = "friend";
      battleOpponentUid = r.senderUid;
      battleOpponentUsername = r.senderUsername || "Friend";
      battleOpponentPic = DEFAULT_PROFILE_PIC;
      battleRoomId = requestId;
      showBattleChoice();
    };

    function showBattleChoice() {
      document.getElementById("battleMain").classList.add("hidden");
      document.getElementById("battleChoice").classList.remove("hidden");
      document.getElementById("battleArena").classList.add("hidden");

      battleSelectedCardId = null;
      const grid = document.getElementById("battleChoiceGrid");
      grid.innerHTML = "";

      collection.forEach(copy => {
        const card = getCard(copy.name);
        if (!card) return;

        const level = getCopyLevel(copy);
        const fav = favorites.includes(copy.name);
        const div = document.createElement("div");
        div.className = "battleChoiceCard " + (fav ? "favoriteBattleCard" : "");
        div.onclick = () => selectBattleCard(copy.id, div);
        div.innerHTML = `
          ${fav ? '<div class="battleFavoriteBadge">★</div>' : ""}
          <img src="${escapeHtml(card.image)}" style="width:80px;height:80px">
          <div style="font-weight:bold;margin-top:5px">${escapeHtml(card.name)}</div>
          <div class="battleLevelBadge">Lv. ${level}</div>
          <div class="typeBadge">${card.type.join("/")}</div>
          <div class="battleStats">Power: ${card.power}</div>
        `;
        grid.appendChild(div);
      });

      document.getElementById("battleStartButton").disabled = true;
    }

    function selectBattleCard(copyId, element) {
      battleSelectedCardId = copyId;
      document.querySelectorAll(".battleChoiceCard").forEach(e => e.classList.remove("selected"));
      element.classList.add("selected");
      document.getElementById("battleStartButton").disabled = false;
    }

    window.cancelBattleSetup = () => {
      document.getElementById("battleMain").classList.remove("hidden");
      document.getElementById("battleChoice").classList.add("hidden");
      document.getElementById("battleArena").classList.add("hidden");
    };

    window.confirmBattleCard = () => {
      if (!battleSelectedCardId) return;
      document.getElementById("battleChoice").classList.add("hidden");
      document.getElementById("battleArena").classList.remove("hidden");
      initiateBattleArena();
    };

    /* =========================
       BATTLE ARENA EXECUTION
    ========================= */
    let p1Hp = BATTLE_HP;
    let p2Hp = BATTLE_HP;
    let p1Copy = null;
    let p1Card = null;
    let p2Card = null;
    let p2Level = 0;

    function initiateBattleArena() {
      p1Hp = BATTLE_HP;
      p2Hp = BATTLE_HP;
      battleRewardGiven = false;

      p1Copy = collection.find(c => c.id === battleSelectedCardId);
      p1Card = getCard(p1Copy.name);

      if (battleMode === "bot") {
        let botLevel = battleDifficulty === "easy" ? easyBotLevel : hardBotLevel;
        if (battleDifficulty === "hard") {
          const counterCards = cards.filter(c => isCounterType(c.type[0], p1Card.type[0]));
          p2Card = counterCards.length ? counterCards[Math.floor(Math.random() * counterCards.length)] : cards[Math.floor(Math.random() * cards.length)];
        } else {
          p2Card = cards[Math.floor(Math.random() * cards.length)];
        }
        p2Level = Math.max(0, playerLevel + (battleDifficulty === "hard" ? 1 : 0));
        renderArena();
      }
    }

    function isCounterType(typeA, typeB) {
      const typeChart = {
        Fire: ["Grass"],
        Water: ["Fire"],
        Grass: ["Water", "Rock"],
        Rock: ["Flying"],
        Flying: ["Grass"],
        Fighting: ["Normal", "Rock"],
        Fairy: ["Fighting"]
      };
      return typeChart[typeA]?.includes(typeB) || false;
    }

    function renderArena() {
      const arena = document.getElementById("battleArena");
      const p1Level = getCopyLevel(p1Copy);

      arena.innerHTML = `
        <div class="battleHeader" style="display:flex;justify-content:space-between;align-items:center;">
          <div class="battlePlayer" style="width:40%;">
            <div class="battlePlayerTop">
              <img class="battleCardImage" src="${escapeHtml(p1Card.image)}" style="width:80px;height:80px">
              <div>
                <div style="font-weight:bold">${escapeHtml(username)}</div>
                <div>${escapeHtml(p1Card.name)}</div>
                <div class="battleLevelBadge">Lv. ${p1Level}</div>
              </div>
            </div>
            <div class="hpBar"><div class="hpFill" id="p1HpFill" style="width:${p1Hp}%"></div></div>
            <div class="hpText" id="p1HpText">${p1Hp} / ${BATTLE_HP} HP</div>
          </div>

          <div class="battleVs">VS</div>

          <div class="battlePlayer" style="width:40%;">
            <div class="battlePlayerTop">
              <img class="battleCardImage" src="${escapeHtml(p2Card.image)}" style="width:80px;height:80px">
              <div>
                <div style="font-weight:bold">${escapeHtml(battleOpponentUsername)}</div>
                <div>${escapeHtml(p2Card.name)}</div>
                <div class="battleLevelBadge">Lv. ${p2Level}</div>
              </div>
            </div>
            <div class="hpBar"><div class="hpFill" id="p2HpFill" style="width:${p2Hp}%"></div></div>
            <div class="hpText" id="p2HpText">${p2Hp} / ${BATTLE_HP} HP</div>
          </div>
        </div>

        <div id="battleControls" class="battleMove" style="margin-top:20px;text-align:center">
          <div class="moveName" style="font-size:18px;font-weight:bold">${escapeHtml(p1Card.move)}</div>
          <div class="moveType">Type: ${p1Card.moveType} | Power: ${p1Card.power}</div>
          <button class="packButton" style="width:100%;margin-top:10px" onclick="executeTurn()">ATTACK!</button>
        </div>

        <div class="battleLog" id="battleLog" style="margin-top:15px;background:#111;padding:10px;border-radius:4px">The battle begins!</div>
      `;
    }

    window.executeTurn = () => {
      const p1Level = getCopyLevel(p1Copy);
      let damageToP2 = Math.floor(p1Card.power * (1 + p1Level * 0.05));

      if (isCounterType(p1Card.moveType, p2Card.type[0])) damageToP2 = Math.floor(damageToP2 * 1.3);
      p2Hp = Math.max(0, p2Hp - damageToP2);

      let logText = `Your ${p1Card.name} used ${p1Card.move} for ${damageToP2} damage!`;

      if (p2Hp <= 0) {
        updateHpUI();
        document.getElementById("battleLog").textContent = logText;
        endBattle(true);
        return;
      }

      let damageToP1 = Math.floor(p2Card.power * (1 + p2Level * 0.05));
      if (isCounterType(p2Card.moveType, p1Card.type[0])) damageToP1 = Math.floor(damageToP1 * 1.3);
      p1Hp = Math.max(0, p1Hp - damageToP1);

      logText += ` Enemy ${p2Card.name} hit back for ${damageToP1} damage!`;
      updateHpUI();
      document.getElementById("battleLog").textContent = logText;

      if (p1Hp <= 0) {
        endBattle(false);
      }
    };

    function updateHpUI() {
      document.getElementById("p1HpFill").style.width = Math.max(0, p1Hp) + "%";
      document.getElementById("p1HpText").textContent = Math.max(0, p1Hp) + " / " + BATTLE_HP + " HP";
      document.getElementById("p2HpFill").style.width = Math.max(0, p2Hp) + "%";
      document.getElementById("p2HpText").textContent = Math.max(0, p2Hp) + " / " + BATTLE_HP + " HP";
    }

    async function endBattle(playerWon) {
      if (battleRewardGiven) return;
      battleRewardGiven = true;

      document.getElementById("battleControls").style.display = "none";
      const arena = document.getElementById("battleArena");

      let coinsEarned = 0;
      let dolbEarned = 0;
      let levelUpText = "";

      if (playerWon) {
        p1Copy.levelWins = (p1Copy.levelWins || 0) + 1;
        if (p1Copy.levelWins >= winsNeededForLevel(p1Copy.level || 0)) {
          p1Copy.level = (p1Copy.level || 0) + 1;
          p1Copy.levelWins = 0;
        }

        playerLevelWins += 1;
        if (playerLevelWins >= winsNeededForLevel(playerLevel)) {
          playerLevel += 1;
          playerLevelWins = 0;
          coinsEarned += NORMAL_RANK_COINS;
          dolbEarned += NORMAL_RANK_DOLB;

          if (playerLevel === 15) coinsEarned += LEVEL_15_BONUS_COINS;
          if (playerLevel === 20) dolbEarned += LEVEL_20_BONUS_DOLB;

          levelUpText = `<div class="levelUpBox" style="color:#f1c40f;margin-top:10px">🎉 RANK UP! You reached Rank ${playerLevel}! +${coinsEarned} Coins, +${dolbEarned} Dolb</div>`;
        } else {
          coinsEarned = 15;
        }

        money += coinsEarned;
        dolb += dolbEarned;

        if (battleDifficulty === "easy") easyBotWins++;
        if (battleDifficulty === "hard") hardBotWins++;

        await savePlayerData();
        updateUI();
      }

      const resDiv = document.createElement("div");
      resDiv.className = "battleResult";
      resDiv.innerHTML = `
        <div class="winText" style="color:${playerWon ? "#25b864" : "#e74c3c"}">
          ${playerWon ? "VICTORY!" : "DEFEAT!"}
        </div>
        ${playerWon ? `<div class="rewardText">+${coinsEarned} Coins${dolbEarned ? ` | +${dolbEarned} Dolb` : ""}</div>` : ""}
        ${levelUpText}
        <button class="packButton" style="width:100%;margin-top:15px" onclick="cancelBattleSetup()">BACK TO BATTLE MENU</button>
      `;
      arena.appendChild(resDiv);
    }

    function stopBattleListener() {
      if (battleListener) {
        battleListener();
        battleListener = null;
      }
    }

    // Initialize Page State
    updateUI();
  </script>
</body>
</html>
