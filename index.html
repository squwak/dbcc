<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Battle System</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    .status { margin: 20px 0; font-size: 1.2rem; }
    button { padding: 10px 20px; font-size: 1rem; cursor: pointer; }
    #log { margin-top: 20px; color: #555; }
  </style>
</head>
<body>

  <h1>Battle Arena</h1>

  <div class="status">
    <p>Player HP: <span id="player-hp">100</span></p>
    <p>Enemy HP: <span id="enemy-hp">50</span></p>
  </div>

  <button id="attack-btn">Attack</button>
  <button id="restart-btn" style="display: none;">Play Again</button>

  <p id="log">Click "Attack" to start the fight!</p>

  <script>
    // 1. Initial State Variables
    let playerHp = 100;
    let enemyHp = 50;
    let isBattleOver = false;

    // 2. DOM Elements
    const playerHpEl = document.getElementById('player-hp');
    const enemyHpEl = document.getElementById('enemy-hp');
    const attackBtn = document.getElementById('attack-btn');
    const restartBtn = document.getElementById('restart-btn');
    const logEl = document.getElementById('log');

    // 3. Update UI Display
    function updateDisplay() {
      playerHpEl.textContent = playerHp;
      enemyHpEl.textContent = enemyHp;
    }

    // 4. Main Attack Handler (Triggered ONLY on click)
    function handlePlayerAttack() {
      if (isBattleOver) return;

      // Player attacks enemy
      const playerDamage = Math.floor(Math.random() * 15) + 5; // 5 to 19 dmg
      enemyHp = Math.max(0, enemyHp - playerDamage);
      updateDisplay();

      // Check if enemy is defeated
      if (enemyHp <= 0) {
        logEl.textContent = `You dealt ${playerDamage} damage and WON the battle! 🎉`;
        endBattle();
        return;
      }

      // Enemy retaliates
      const enemyDamage = Math.floor(Math.random() * 12) + 3; // 3 to 14 dmg
      playerHp = Math.max(0, playerHp - enemyDamage);
      updateDisplay();

      // Check if player is defeated
      if (playerHp <= 0) {
        logEl.textContent = `Enemy dealt ${enemyDamage} damage. You were DEFEATED! 💀`;
        endBattle();
        return;
      }

      logEl.textContent = `You dealt ${playerDamage} damage. Enemy dealt ${enemyDamage} damage back!`;
    }

    // 5. End Battle State
    function endBattle() {
      isBattleOver = true;
      attackBtn.style.display = 'none';
      restartBtn.style.display = 'inline-block';
    }

    // 6. Reset Game State
    function resetBattle() {
      playerHp = 100;
      enemyHp = 50;
      isBattleOver = false;
      logEl.textContent = 'Click "Attack" to start the fight!';
      attackBtn.style.display = 'inline-block';
      restartBtn.style.display = 'none';
      updateDisplay();
    }

    // 7. Event Listeners (Pass functions as callbacks, DO NOT execute with parentheses)
    attackBtn.addEventListener('click', handlePlayerAttack);
    restartBtn.addEventListener('click', resetBattle);
  </script>

</body>
</html>
